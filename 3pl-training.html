iler, so there is a spotter at the door. Check the wheel chocks and the dock lock first: a trailer rolling away mid-load kills people."],["Appointments","LTL and FTL into an FBA or Walmart building need a booked slot. Arrive without one, or late, and the trailer is turned away; a reschedule is usually days."],["BOL and proof","Pallet count, piece count and weight on the bill of lading have to match what is actually aboard; check them line by line before the driver signs. Photograph the load before the doors come down -- in a damage claim that photograph is the only thing that shows it left here intact."]]},"TRUCKLOAD_LIMITS":{"zh":[["標準棧板","北美 GMA 標準板 48 x 40 in（約 122 x 102 cm），四面進叉。歐規 EUR 板是 120 x 80 cm，兩者不通用。"],["堆疊高度","含棧板本身通常不超過 72 in（約 183 cm）；FBA 單層堆疊上限 72 in，可堆疊板另有規定。超高會被要求重打或改雙層計費。"],["單板重量","一般不超過 1,500 lb（約 680 kg）；FBA 多數收貨點上限 1,500 lb。地牛與電動拖板車的額定荷重也在這個量級。"],["外突容許","零。箱體不得超出棧板邊緣，並無 2 in 之緩衝；FBA 為零容許，LTL 承運人條款要求切齊，實務建議內縮約 1 in。超出者收貨端得予拒收，或以最外緣重新丈量計價。"],["整車載重","53 呎乾櫃可裝 26 個 GMA 板（單層）或 52 個（雙層）。惟美國聯邦公路總重上限為 80,000 lb，扣除車頭與拖車自重後，貨重實務上約於 42,000-45,000 lb 達上限。先達重量上限或先達材積上限，視貨物密度而定。"],["材積重","LTL 依 NMFC 貨物等級計價，等級取決於密度、易損性、失竊風險與裝載難易度。密度低於 6 lb/ft³ 者等級跳升，運費差距顯著；打板時壓縮空隙即為直接之成本控制手段。"],["不可疊放","標示 Do Not Stack 之棧板須加裝頂錐或錐帽，否則承運人仍會向上堆疊。壓損之舉證責任在託運人——未標示者視同同意疊放。"]],"en":[["Standard pallet","North America runs the GMA pallet, 48 x 40 in, four-way entry. Europe runs the EUR pallet at 120 x 80 cm. They are not interchangeable."],["Stack height","Normally 72 in including the pallet itself, which is also the FBA limit for a single-stacked pallet. Over it and the load is rebuilt or rebilled."],["Weight per pallet","1,500 lb is the usual ceiling and the FBA limit at most receiving buildings. It is also about what the pallet jacks on the floor are rated for."],["Overhang allowance","None. No carton may pass the deck edge and there is no two-inch buffer: FBA allows none, carrier tariffs ask for flush, and the working target is an inch of underhang. Past the edge, the dock may refuse it or the carrier may remeasure to the outermost point."],["Trailer capacity","A 53 ft dry van holds 26 GMA pallets on the floor, or 52 double-stacked. But the US federal gross limit is 80,000 lb, and after the tractor and trailer that leaves roughly 42,000-45,000 lb of freight. Whether you run out of weight or out of floor depends on the goods."],["Density and class","LTL is priced on NMFC freight class, set by density, fragility, theft risk and handling. Below about 6 lb/ft3 the class steps up and the rate with it, which is why squeezing the air out of a pallet is real money."],["Do not stack","A pallet that must not be stacked needs cones or a cap; without them the carrier will stack on it, and the claim fails because an unmarked pallet is a pallet you agreed could be stacked."]]},"FBA_MODES":{"zh":[["SPD 之定義","Small Parcel Delivery。每一外箱各為獨立包裹，交付 UPS／FedEx，一箱一組追蹤號，分別送達 Amazon 倉庫。無須叫車、無須預約、無須棧板。"],["LTL／FTL 之定義","貨物打成棧板後交付貨運公司。LTL 為零擔，與他人貨物共用車廂；FTL 為整車承包。二者皆經月台交接、皆須預約，並以棧板為交接單位。"],["計價基礎","SPD 按件計價：每箱各自計算材積重與分區。LTL 依板數與 NMFC 貨物等級計價（等級取決於密度、易損性、失竊風險與裝載難易度），另加燃油與各項附加費。FTL 按趟計價，與箱數無直接關聯。"],["標籤","SPD：每箱一張 FBA 外箱標（含 Amazon 貨件標籤）及一張承運商面單，商品本身另具 FNSKU。LTL／FTL：外箱標照貼，另加板標，每板四面皆須張貼，缺面者收貨端得予拒收。"],["預約","SPD 無須預約，到場即卸。LTL／FTL 須先於賣家後台建立 carrier 資訊、取得 ISA（Amazon 進倉預約編號）並排定時段。未持 ISA 到場者不予收貨。"],["量體分界","現場之概略分界：六箱以內且單箱不重者，SPD 通常較具成本優勢；超過一板之量體開始評估 LTL；六板以上評估 FTL。此為概略區間而非規則，決策時應就同一批貨取三方報價比較。"],["常見錯誤","① 打板完成後始發現未建立 ISA，無法派車。② 板標僅貼正面，收貨端拒收。③ 貨物蓬鬆，密度低於 6 lb/ft³ 致等級跳升，運費高於預估。④ 同一貨件混用 SPD 與 LTL 外箱標，兩端皆無法勾稽。"]],"en":[["What SPD is","Small Parcel Delivery. Each carton travels as its own parcel with its own tracking number, handed to UPS or FedEx and delivered into the Amazon building one box at a time. No truck to book, no appointment, no pallets."],["What LTL and FTL are","The cartons go on pallets and a freight carrier collects them. LTL shares the trailer with other shippers' freight; FTL is the whole trailer for one load. Both go through a dock, both need an appointment, and both hand over by the pallet."],["How each is priced","SPD is priced per piece -- every carton gets its own dimensional weight and zone. LTL is priced on pallet count and NMFC freight class (set by density, fragility, theft risk and handling), plus fuel and accessorials. FTL is priced by the run and barely notices the carton count."],["Labels","SPD: an FBA carton label on every box plus the carrier's own label, with the FNSKU on the item itself. LTL and FTL: the same carton labels, plus pallet labels on all four sides of every pallet. A pallet short of a label can be refused at the door."],["Appointments","SPD needs none -- the parcels simply arrive. LTL and FTL need the carrier registered in Seller Central and an ISA, the delivery appointment number, booked to a slot. A trailer without one is turned away on arrival."],["Where the line falls","As a rough shape: six cartons or fewer of no great weight usually still favour SPD; more than a pallet's worth starts to favour LTL; past about six pallets, price FTL as well. Decide it with three real quotes on the same shipment, not with this paragraph."],["What goes wrong","1. Pallets built before the ISA was booked, so no truck can be dispatched. 2. Pallet labels on the front face only, and the dock refuses the load. 3. Freight too bulky -- under about 6 lb/ft3 the class steps up and the rate with it. 4. SPD and LTL carton labels mixed inside one shipment, so neither reconciles."]]},"RMA":{"zh":[["RMA 是什麼","Return Merchandise Authorization，退貨授權編號。沒有 RMA 的包裹到倉是無主件——查不出是誰的、哪一張單、該退款還是換貨。收貨端第一件事是刷 RMA，不是拆箱。"],["收件與建檔","刷 RMA、拍外箱狀況、記錄到貨日。外箱破損或封條已開者，應於拆箱前完成拍照，該照片是後續與買家或承運人爭議的唯一憑證。"],["拆箱與比對","核對實際內容物與 RMA 所載品項、數量、序號是否一致。不符者不進入判定流程，逕列爭議件由客服處理。"],["判定四類","① 良品重新上架 ② 需整新加工（換標、換包裝、清潔）③ 隔離待判（疑似瑕疵、含電池、疑似仿品）④ 報廢。此判定應由受訓合格人員為之，非揀貨人員順手決定。"],["入庫與扣帳","僅良品與整新完成品回可售庫存，並即時回寫平台與 WMS。回寫延遲即造成超賣，超賣之成本高於該件商品本身。"],["計費項目","退貨處理通常按件計價，整新加工另計工時或料件。報廢與隔離品之倉租照計——沒有判定就沒有出口，隔離區堆積是實務上最常見的隱性倉租來源。"]],"en":[["What an RMA is","Return Merchandise Authorization. A parcel arriving without one is an orphan: no order to match, no decision on refund or replacement. The first act at the returns bench is scanning the RMA, not opening the box."],["Book it in","Scan the RMA, photograph the outer carton, record the arrival date. If the carton is damaged or the seal is already broken, photograph it before opening: that image is the only evidence in a later dispute with the buyer or carrier."],["Open and match","Check the contents against what the RMA says was sent back -- item, quantity, serial. A mismatch does not go on to be graded; it goes to customer service as a disputed return."],["Grade it, four ways","1. Good, straight back to sellable. 2. Needs rework -- relabel, repack, clean. 3. Quarantine, for a suspected fault, a battery, or a suspected counterfeit. 4. Scrap. Grading is a trained job, not something a picker decides in passing."],["Put away and post","Only good and reworked stock goes back to sellable, and the platform and the WMS are updated as it does. A late update is an oversell, and an oversell costs more than the item."],["What it costs","Returns handling is normally billed per piece, with rework billed as labour or materials on top. Storage still runs on quarantined and scrap stock -- nothing leaves without a decision, and a growing quarantine bay is the most common hidden storage bill there is."]]},"PREP":{"zh":[["Amazon FBA","最常見。要貼 FNSKU 商品標和外箱標，箱重和尺寸有上限，超過要貼 Team Lift。出貨計畫從 Seller Central 建，系統會指定送到哪一個 FC。"],["Walmart WFS","流程類似 FBA，但標籤格式和收貨要求是 Walmart 自己一套，不能拿亞馬遜的標直接用。"],["TikTok Shop","近年才起來的通路，倉庫和規則還在變，出貨前先確認當期文件。"],["整箱 vs 打板","量小走 SPD（一箱一箱交給 UPS／FedEx），量大走 LTL／FTL（打成棧板叫貨運）。兩者的成本結構完全不同。"],["預約進倉","LTL 進 FBA 要先預約時段，沒有預約或遲到，整車可能被退回。"]],"en":[["Amazon FBA","The common one. Every item needs an FNSKU label and every carton a box label; carton weight and size are capped, and over the limit a team-lift label is required. The shipment plan comes from Seller Central and names the destination center."],["Walmart WFS","Similar in shape to FBA, but the label formats and receiving requirements are Walmart's own -- Amazon labels do not transfer."],["TikTok Shop","A newer channel whose warehouses and rules are still moving; check the current documentation before shipping."],["Cartons vs pallets","Small volumes go SPD, carton by carton via UPS or FedEx. Large volumes go LTL or FTL on pallets. The cost structures are nothing alike."],["Delivery appointments","An LTL delivery into an FBA center needs a booked slot. Turn up without one, or late, and the whole trailer can be turned away."]],"es":[["Amazon FBA","El caso más común. Cada artículo necesita etiqueta FNSKU y cada caja su etiqueta de caja; el peso y el tamaño de la caja tienen tope, y pasando el límite se exige etiqueta de Team Lift. El plan de embarque sale de Seller Central y ahí se indica el centro de destino."],["Walmart WFS","Parecido a FBA en su forma, pero los formatos de etiqueta y los requisitos de recibo son propios de Walmart: las etiquetas de Amazon no sirven."],["TikTok Shop","Un canal nuevo cuyos almacenes y reglas siguen cambiando; revisa la documentación vigente antes de enviar."],["Cajas contra tarimas","Los volúmenes chicos van SPD, caja por caja con UPS o FedEx. Los volúmenes grandes van LTL o FTL en tarimas. Las estructuras de costo no se parecen en nada."],["Citas de entrega","Una entrega LTL a un centro de FBA necesita cita reservada. Llegar sin ella, o tarde, y pueden regresar el tráiler completo."]]},"CARRIERS":[["UPS","ups"],["FedEx","fedex"],["USPS","usps"]],"RULE_KEYS":["divisor","dimcube","dimzone","nstdl1","nstdl2","nstdcu","nstdf1","nstdf2","nstdfc","balloonlg","balloonmin","ahsmin","lpsmin","ahsw","ahsl","ahss","ahsg","lpsw","lpsl","lpsg","lpscu","ahscu","maxw","maxl","maxlg","ressur","dascom","dasres","edascom","edasres","rascom","rasres","sigfee","omaxfee","pkres","pkahs","pklps","pkomax","fuel"],"LB_PER_KG":2.2046226218,"IN_PER_CM":0.39370078740157477,"SCENE_ZONE_NAMES":{"zh":{"pacific":"美西 太 <script>
var D = JSON.parse(document.getElementById("tooldata").textContent);
var module = undefined;
/* ===========================================================================
   計價引擎。桌面版 App.data() 與 App.render() 的逐行移植。

   移植規則：運算順序一律照抄。加法和乘法的先後在浮點數上是有差的，
   照抄才會兩邊算到同一分錢——驗收就是拿同一批包裹兩邊各跑一次比到分。
   =========================================================================== */

const LB_PER_KG = D.LB_PER_KG;
const IN_PER_CM = D.IN_PER_CM;

/* Python 的 f"{x:g}"：六位有效數字，去掉尾巴的零。 */
function g(x) {
  if (!isFinite(x)) return String(x);
  if (Number.isInteger(x) && Math.abs(x) < 1e6) return String(x);
  let s = Number(x.toPrecision(6));
  return String(s);
}

/* f"{v:,.2f}" */
function money(v) {
  const neg = v < 0;
  let s = Math.abs(v).toFixed(2);
  let [i, f] = s.split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-$" : "$") + i + "." + f;
}

function fixed(x, n) { return x.toFixed(n); }

/* 東亞字寬。中文一個字佔兩欄，用 length 補空白會整排對不齊。 */
const WIDE = /[\u1100-\u115F\u2E80-\uA4CF\uA960-\uA97F\uAC00-\uD7A3\uF900-\uFAFF\uFE10-\uFE19\uFE30-\uFE6F\uFF00-\uFF60\uFFE0-\uFFE6\u3000-\u303E]/;
function dispWidth(s) {
  let w = 0;
  for (const ch of s) w += WIDE.test(ch) ? 2 : 1;
  return w;
}

/* --------------------------------------------------------------------------
   查表。級距是「大於等於」那一格：12.4 lb 讀 13 lb 那一列，不會往下取。
   -------------------------------------------------------------------------- */
function lookupBaseRate(table, weight, zone) {
  const z = String(zone).trim();
  const breaks = Object.keys(table)
    .filter(w => table[w][z] !== undefined)
    .map(Number)
    .sort((a, b) => a - b);
  if (!breaks.length) return [null, null];
  for (const w of breaks) {
    if (weight <= w) return [table[g(w)][z], w];
  }
  return [null, null];
}

function zoneGroup(zone) {
  const z = parseFloat(String(zone).trim());
  if (!isFinite(z)) return null;
  const zi = Math.trunc(z);
  if (D.OFFSHORE_ZONES.indexOf(zi) >= 0 || zi > 9) return "7+";
  if (!(zi >= 1 && zi <= 9)) return null;
  return (zi === 1 || zi === 2) ? "2"
       : (zi === 3 || zi === 4) ? "3-4"
       : (zi === 5 || zi === 6) ? "5-6" : "7+";
}

/* --------------------------------------------------------------------------
   狀態。桌面版是一堆 StringVar，這裡是一個物件，讀寫的路徑一樣只有一條。
   -------------------------------------------------------------------------- */
const S = {
  lang: "en",
  carrier: "ups",
  service: "Ground",
  address: "commercial",
  units: "imperial",
  v: Object.assign({}, D.DEFAULT),
  zoneFees: JSON.parse(JSON.stringify(D.ZONE_FEE_DEFAULTS)),
  signature: false,
  ahspack: false,
  peak: false,
  dastier: "none",
  usemin: true,
  autoahs: true,
  autolps: true,
  omax: true,
  rateTable: D.RATE_TABLE,
  last: null,
  zoneNote: "",
};

function tr(k) {
  const t = D.TXT[S.lang];
  return (t && t[k] !== undefined) ? t[k] : (D.TXT.en[k] !== undefined ? D.TXT.en[k] : k);
}

function num(k, allowNeg) {
  const raw = String(S.v[k] === undefined ? "" : S.v[k]).trim();
  const x = raw === "" ? NaN : Number(raw);
  if (!isFinite(x)) {
    throw new Error(tr(k) + "：" + (S.lang === "zh" ? "請輸入數字" : "enter a number"));
  }
  /* A few rule fields carry a negative sentinel meaning "this service has no
     such rule at all" (Media Mail sets dimcube = -1 to switch DIM off). Those
     must survive the guard, or the service can never be rated. */
  if (x < 0 && !allowNeg) {
    throw new Error(tr(k) + "：" + (S.lang === "zh" ? "不可小於 0" : "cannot be negative"));
  }
  return x;
}

function zoneFee(key, band) {
  const row = S.zoneFees[key] || {};
  const raw = String(row[band] === undefined ? 0 : row[band]).replace(/[$,]/g, "").trim();
  const x = Number(raw || 0);
  return isFinite(x) ? x : 0.0;
}

function zoneRules() { return D.CARRIER_ZONES[S.carrier] || D.CARRIER_ZONES.ups; }
function zoneValid(z) {
  const r = zoneRules();
  return (r.lo <= z && z <= r.hi) || r.offshore.indexOf(z) >= 0;
}
function carrierLabel() {
  for (const [lab, key] of D.CARRIERS) if (key === S.carrier) return lab;
  return "UPS";
}

/* 費率表是分承運商的：只有那家自己跑的 Zone，而且不能有超過它重量上限

function rateTableFor() {
  const r = zoneRules();
  const zones = [];
  for (let z = r.lo; z <= r.hi; z++) zones.push(String(z));
  for (const z of r.offshore) zones.push(String(z));
  let cap = 0;
  try { cap = num("maxw"); } catch (e) { cap = 0; }
  const out = {};
  for (const w in D.RATE_TABLE) {
    if (cap > 0 && Number(w) > cap) continue;
    const row = {};
    for (const z of zones) {
      if (D.RATE_TABLE[w][z] !== undefined) row[z] = D.RATE_TABLE[w][z];
    }
    if (Object.keys(row).length) out[w] = row;
  }
  return out;
}

/* 服務規則：先鋪承運商的整套，服務自己的覆寫再蓋上去。順序反了，
   從 Ground Advantage 換到 Priority 會留著 130in 的天花板。 */
function applyServiceRules() {
  const list = D.SERVICES[S.carrier] || [];
  const names = list.map(x => x[0]);
  if (names.length && names.indexOf(S.service) < 0) S.service = names[0];
  const base = D.CARRIER_RULES[S.carrier] || {};
  for (const f in base) if (f in S.v) S.v[f] = base[f];
  for (const [n, over] of list) {
    if (n === S.service) for (const f in over) if (f in S.v) S.v[f] = over[f];
  }
  S.rateTable = rateTableFor();
}

/* --------------------------------------------------------------------------
   引擎本體。
   -------------------------------------------------------------------------- */
function computeData() {
  const zh = S.lang === "zh";
  let w = num("weight"), l = num("length"), wd = num("width"), h = num("height");
  const unit_mode = S.units;
  const entered = [w, l, wd, h];
  if (unit_mode === "metric") {
    w = w * LB_PER_KG;
    l = l * IN_PER_CM; wd = wd * IN_PER_CM; h = h * IN_PER_CM;
  }
  const div = num("divisor");
  if (div === 0) throw new Error(zh ? "材積除數不可為 0" : "DIM Divisor cannot be 0");

  const dims = [l, wd, h].sort((a, b) => b - a);
  const longest = dims[0], second = dims[1], third = dims[2];
  const lg = longest + 2 * (second + third);
  const cubic = l * wd * h;
  const dim = cubic / div;

  let zone = String(S.v.zone || "").trim() || "5";
  const zone_src = S.zoneNote || D.T_ZONE_TYPED[S.lang] || D.T_ZONE_TYPED.en;
  const cube_min = num("dimcube", true), zone_min = num("dimzone");
  const zone_n = isFinite(Number(zone)) ? Number(zone) : 0.0;
  let dim_skip = "";
  if (cube_min < 0) dim_skip = "service";
  else if (cube_min > 0 && cubic <= cube_min) dim_skip = "cube";
  else if (zone_min > 0 && zone_n < zone_min) dim_skip = "zone";
  const dim_used = dim_skip ? 0.0 : dim;
  const standard = Math.ceil(Math.max(w, dim_used));

  const aw = [], az = [], lp = [];
  const ap = !!S.ahspack;
  /* 門檻一律是「嚴格大於」。剛好踩在 110 lb 或 130 in 不觸發。 */
  if (S.autoahs) {
    if (w > num("ahsw")) aw.push([w, num("ahsw")]);
    if (longest > num("ahsl")) az.push(["longest", longest, num("ahsl")]);
    if (second > num("ahss")) az.push(["second", second, num("ahss")]);
    if (lg > num("ahsg")) az.push(["lg", lg, num("ahsg")]);
    if (num("ahscu") > 0 && cubic > num("ahscu")) az.push(["cubic", cubic, num("ahscu")]);
  }
  if (S.autolps) {
    if (w > num("lpsw")) lp.push(["weight", w, num("lpsw")]);
    if (longest > num("lpsl")) lp.push(["longest", longest, num("lpsl")]);
    if (lg > num("lpsg")) lp.push(["lg", lg, num("lpsg")]);
    if (num("lpscu") > 0 && cubic > num("lpscu")) lp.push(["cubic", cubic, num("lpscu")]);
  }

  const over = [];
  let over_w = false;
  if (num("maxw") > 0 && w > num("maxw")) { over.push([D.T_OMAX.w, w, num("maxw"), "lb"]); over_w = true; }
  if (num("maxl") > 0 && longest > num("maxl")) over.push([D.T_OMAX.l, longest, num("maxl"), "in"]);
  if (num("maxlg") > 0 && lg > num("maxlg")) over.push([D.T_OMAX.g, lg, num("maxlg"), "in"]);

  const omax = (over.length > 0 && !over_w && S.omax
                && S.carrier === "ups" && num("omaxfee") > 0);
  if (over.length && !omax) {
    const det = over.map(([lab, val, lim, unit]) =>
      "  " + (zh ? lab[0] : lab[1]) + "  " + g(val) + " " + unit + " > " + g(lim) + " " + unit).join("\n");
    const who = carrierLabel();
    const tail = {
      ups: ["必須改走貨運。硬寄會被收 Over Maximum Limits，2026 約 $1,875 一件，" +
            "而且是加在所有其他費用之上——LPS、最低計費重量都照樣算，不會因此免掉。",
            "It has to move as freight. Shipped anyway it incurs Over Maximum Limits, " +
            "around $1,875 per package in 2026, and that is on top of everything else -- " +
            "the large package surcharge and the weight floor still apply."],
      fedex: ["必須改走貨運。硬寄會被收 Unauthorized Package Charge，金額很重，" +
              "而且是加在 Oversize 等其他費用之上，不是取代。請查當年度服務指南。",
              "It has to move as freight. Shipped anyway it draws the Unauthorized " +
              "Package Charge, which is heavy and sits on top of the oversize charge " +
              "rather than replacing it. Check the current Service Guide."],
      usps: ["超過就是 nonmailable（不可寄遞），郵局會退件或加收約 $200 的超大／超重費，" +
             "而且郵資不退。70 磅是所有 USPS 國內郵件的絕對上限，改用 UPS、FedEx 或貨運。",
             "Past this it is nonmailable: the post office refuses it or adds an oversize/" +
             "overweight fee of about $200, and the postage is not refunded. 70 lb is the " +
             "hard ceiling for every USPS domestic class -- use UPS, FedEx or freight."],
    };
    const t2 = tail[S.carrier] || tail.ups;
    throw new Error(zh
      ? ("這件超過 " + who + " 的包裹上限，不能用包裹費率計算：\n\n" + det + "\n\n" + t2[0])
      : ("This exceeds the " + who + " parcel limits and cannot be rated as a parcel:\n\n" + det + "\n\n" + t2[1]));
  }

  const nstd = [];
  if (num("nstdl1") > 0 && longest > num("nstdl1")) nstd.push(["nstd_len1", longest, num("nstdl1"), num("nstdf1")]);
  if (num("nstdl2") > 0 && longest > num("nstdl2")) nstd.push(["nstd_len2", longest, num("nstdl2"), num("nstdf2")]);
  if (num("nstdcu") > 0 && cubic > num("nstdcu")) nstd.push(["nstd_cube", cubic, num("nstdcu"), num("nstdfc")]);

  const lps = lp.length > 0;
  const ahsw = aw.length > 0 && !lps;
  const ahss = az.length > 0 && !lps;
  const ahsp = ap && !lps;
  let minw = (lps && S.usemin) ? num("lpsmin")
           : (ahss && S.usemin) ? num("ahsmin") : 0;
  let balloon = false;
  if (S.usemin && num("balloonlg") > 0 && lg > num("balloonlg") && num("balloonmin") > minw) {
    minw = num("balloonmin"); balloon = true;
  }
  const final = Math.ceil(Math.max(standard, minw));

  const band = zoneGroup(zone);
  if (band === null) {
    const who = carrierLabel();
    const r = zoneRules();
    const zi = isFinite(Number(zone)) ? Math.trunc(Number(zone)) : null;
    if (zi !== null && r.offshore.indexOf(zi) >= 0) {
      throw new Error(zh
        ? ("Zone " + zone + " 是夏威夷／阿拉斯加的 Ground 區域，是有效的 Zone，只是本工具的示範費率表沒有這一區，請改用實際費率表查詢。")
        : ("Zone " + zone + " is a genuine Hawaii/Alaska Ground zone; the demonstration tables in this tool simply do not carry it. Use the real rate table."));
    }
    if (zi !== null && zoneValid(zi)) {
      throw new Error(zh
        ? ("Zone " + zone + " 對 " + who + " 來說是有效的（" + who + " 的範圍是 " + r.lo + "-" + r.hi + "），但本工具的示範費率與附加費表只做到 Zone 2-8，查不到這一區。")
        : ("Zone " + zone + " is valid for " + who + " (its range is " + r.lo + "-" + r.hi + "), but the demonstration rate and surcharge tables here only cover zones 2-8."));
    }
    throw new Error(zh
      ? ("Zone「" + zone + "」不是 " + who + " 的有效 Zone。" + who + " 的範圍是 " + r.lo + "-" + r.hi
         + (r.offshore.length ? "，另有 " + r.offshore.join("、") + "（夏威夷／阿拉斯加）。" : "。")
         + "\n如果這個數字來自 Zone Chart 的空運欄位（例如 102、302、242），那是空運的編碼，不能直接當 Ground Zone 使用。")
      : ("Zone '" + zone + "' is not a valid " + who + " zone. " + who + " runs " + r.lo + "-" + r.hi
         + (r.offshore.length ? ", plus " + r.offshore.join(", ") + " for Hawaii and Alaska." : ".")
         + "\nIf it came from an air column of the zone chart (102, 302, 242), that is an encoded air zone and cannot be used as a Ground zone."));
  }

  const fees = [];
  const peak = !!S.peak && S.carrier !== "usps";
  const tier = S.dastier;
  if (tier === "das" || tier === "edas" || tier === "ras") {
    const res = S.address === "residential";
    fees.push([tier, num(tier + (res ? "res" : "com"))]);
  }
  if (S.signature) fees.push(["signature", num("sigfee")]);
  if (S.address === "residential" && num("ressur") > 0) {
    fees.push(["residential", num("ressur")]);
    if (peak && num("pkres") > 0) fees.push(["pk_residential", num("pkres")]);
  }
  if (omax) {
    fees.push(["omax", num("omaxfee")]);
    if (peak && num("pkomax") > 0) fees.push(["pk_omax", num("pkomax")]);
  }
  if (lps) {
    fees.push(["lps", zoneFee(S.address === "residential" ? "f_lps_r" : "f_lps_c", band)]);
    if (peak && num("pklps") > 0) fees.push(["pk_lps", num("pklps")]);
  } else if (ahsw || ahss || ahsp) {
    const opts = [];
    if (ahsw) opts.push(["ahs_weight", zoneFee("f_ahs_w", band)]);
    if (ahss) opts.push(["ahs_size", zoneFee("f_ahs_s", band)]);
    if (ahsp) opts.push(["ahs_pack", zoneFee("f_ahs_p", band)]);
    /* max()：同額取先出現的那一個，跟 Python 一樣。 */
    let best = opts[0];
    for (const o of opts) if (o[1] > best[1]) best = o;
    fees.push(best);
    if (peak && num("pkahs") > 0) fees.push(["pk_ahs", num("pkahs")]);
  }
  for (const [name, , , amt] of nstd) fees.push([name, amt]);

  let base = 0.0, base_break = null, base_src;
  const [r0, bk] = lookupBaseRate(S.rateTable, final, zone);
  if (r0 === null) { base = 0.0; base_src = "missing"; }
  else { base = r0; base_break = bk; base_src = "table"; }

  let subtotal = 0.0;
  for (const x of fees) subtotal += x[1];
  const fuel_base = base + subtotal;
  const fuel = fuel_base * num("fuel") / 100;
  const total = base + subtotal + fuel;

  return { w, l, wd, h, entered, unit_mode, div, longest, second, third, lg,
           cubic, dim, dim_skip, dim_used, cube_min, zone_min, zone, zone_src,
           standard, aw, az, lp, ap, over, omax, nstd, lps, ahsw, ahss, ahsp,
           minw, balloon, final, band, fees, base, base_break, base_src,
           subtotal, fuel_base, fuel, total, peak };
}

/* --------------------------------------------------------------------------
   結果頁。逐行照抄桌面版的 render()：十個步驟、四行小計、一行總算式。
   -------------------------------------------------------------------------- */
function renderResult(d) {
  const zh = S.lang === "zh", es = S.lang === "es";
  const L = [];
  const add = (text = "", tag = "body") => L.push([text, tag]);
  const head = (t) => add(t, "step");
  const rule = (t) => add("  ▸ " + t, "note");
  const T = zh ? ((a) => a)
          : es ? ((a, b) => (D.ES_RESULT[b] !== undefined ? D.ES_RESULT[b] : b))
               : ((a, b) => b);
  const gutter = es ? 30 : 22;
  const pad = (text, width) => {
    width = (width === undefined) ? gutter : Math.max(width, gutter);
    return text + " ".repeat(Math.max(width - dispWidth(text), 2));
  };

  const names = {
    das: T("偏遠地區附加費（DAS）", "Delivery Area Surcharge (DAS)"),
    edas: T("延伸偏遠附加費（Extended DAS）", "Extended Delivery Area Surcharge"),
    ras: T("極偏遠附加費（RAS）", "Remote Area Surcharge (RAS)"),
    signature: T("簽名服務費", "Signature Fee"),
    lps: T("大型包裹附加費（LPS）", "Large Package Surcharge (LPS)"),
    ahs_weight: T("額外處理費－重量", "Additional Handling - Weight"),
    ahs_size: T("額外處理費－尺寸", "Additional Handling - Size"),
    ahs_pack: T("額外處理費－包裝", "Additional Handling - Packaging"),
    residential: T("住宅附加費", "Residential Surcharge"),
    pk_residential: T("旺季加價－住宅", "Demand - Residential Delivery"),
    pk_ahs: T("旺季加價－額外處理", "Demand - Additional Handling"),
    pk_lps: T("旺季加價－大型包裹", "Demand - Large Package"),
    omax: T("超過包裹上限罰款（Over Max）", "Over Maximum Limits"),
    pk_omax: T("旺季加價－超過包裹上限", "Demand - Over Maximum Limits"),
    nstd_len1: T("非標準尺寸費－長度第一段", "Nonstandard Fee - Length tier 1"),
    nstd_len2: T("非標準尺寸費－長度第二段", "Nonstandard Fee - Length tier 2"),
    nstd_cube: T("非標準尺寸費－體積", "Nonstandard Fee - Cube"),
  };
  const side = {
    longest: T("最長邊", "longest side"), second: T("第二長邊", "second side"),
    lg: T("長度加周長", "length + girth"), weight: T("實際重量", "actual weight"),
    cubic: T("材積體積", "cubic volume"),
  };

  const who = carrierLabel();
  const now = new Date();
  const hhmmss = [now.getHours(), now.getMinutes(), now.getSeconds()]
    .map(n => String(n).padStart(2, "0")).join(":");
  add((es ? "Facturación " + who : who + " " + T("計費", "billing")) + "　·　" + hhmmss, "eyebrow");
  add(T("計算結果", "Calculation Result"), "title");
  const verdict = d.lps ? T("LPS 大型包裹成立", "Large Package Surcharge applies")
    : d.ahsw ? T("AHS－重量成立", "AHS - Weight applies")
    : (d.ahss || d.ahsp) ? T("AHS－尺寸／包裝成立", "AHS - Size / Packaging applies")
    : (d.nstd && d.nstd.length) ? T("非標準尺寸費成立", "Nonstandard fee applies")
    : T("一般包裹：沒有 AHS 或 LPS", "Standard parcel: no AHS or LPS");
  add("  " + verdict, "total");
  add("  " + T("最終計費重量", "Final billable weight") + "：" + d.final + " lb", "sum");
  add("  " + T("預估總額", "Estimated total") + "：" + money(d.total), "sum");
  add();
  add(T("完整判斷過程", "Full calculation"), "title");
  add();

  if (d.unit_mode === "metric") {
    const [ew, el, ewd, eh] = d.entered;
    head(T("步驟 0：單位換算", "STEP 0: Convert the units"));
    add("  " + pad(T("輸入", "Entered"), 22) + g(ew) + " kg / " + g(el) + " x " + g(ewd) + " x " + g(eh) + " cm");
    add("  " + pad(T("換算後", "Converted"), 22) + fixed(d.w, 2) + " lb / " + fixed(d.l, 2) + " x " + fixed(d.wd, 2) + " x " + fixed(d.h, 2) + " in");
    add();
  }
  head(T("步驟 1：確認路線", "STEP 1: Identify the lane"));
  add("  " + pad(T("寄件 ZIP Code", "From ZIP Code"), 22) + (S.v.from || T("未填寫", "blank")));
  add("  " + pad(T("收件 ZIP Code", "To ZIP Code"), 22) + (S.v.to || T("未填寫", "blank")));
  add("  " + pad(T("Zone", "Zone"), 22) + d.zone + "   (" + d.zone_src + ")");
  add("  " + pad(T("地址類型", "Address type"), 22)
      + (S.address === "residential" ? T("住宅", "Residential") : T("商業", "Commercial")));
  add("");

  head(T("步驟 2：三邊由大到小排序", "STEP 2: Sort the three sides"));
  add("  " + pad(T("輸入", "Entered"), 22) + g(d.l) + " x " + g(d.wd) + " x " + g(d.h) + " in");
  add("  " + pad(T("排序後", "Sorted"), 22) + g(d.longest) + " / " + g(d.second) + " / " + g(d.third) + " in");
  add("");

  head(T("步驟 3：長度加周長", "STEP 3: Length + Girth"));
  add("  " + g(d.longest) + " + 2 x " + g(d.second) + " + 2 x " + g(d.third) + " = " + g(d.lg) + " in");
  add("");

  head(T("步驟 4：材積重量", "STEP 4: DIM weight"));
  add("  " + g(d.l) + " x " + g(d.wd) + " x " + g(d.h) + " / " + g(d.div) + " = " + fixed(d.dim, 2) + " lb");
  if (d.dim_skip === "cube") add("  " + pad(T("體積", "Cube"), 22) + g(d.cubic) + " in³ ≤ " + g(d.cube_min) + " in³");
  else if (d.dim_skip === "service") add("  " + T("此服務不計材積重", "This service takes no dimensional weight"));
  else if (d.dim_skip === "zone") add("  Zone " + d.zone + " < " + g(d.zone_min));
  add("");

  head(T("步驟 5：實重與材積重取大", "STEP 5: Actual vs DIM, take the larger"));
  add("  " + pad(T("實際重量", "Actual"), 22) + fixed(d.w, 2) + " lb");
  if (d.dim_skip) {
    add("  " + pad(T("材積重量", "DIM"), 22) + T("不適用（見步驟 4）", "does not apply (see step 4)"));
    add("  " + pad(T("進位", "Rounded up"), 22) + d.standard + " lb");
  } else {
    add("  " + pad(T("材積重量", "DIM"), 22) + fixed(d.dim, 2) + " lb");
    const winner = d.dim > d.w ? T("材積重量", "DIM") : T("實際重量", "Actual");
    add("  " + pad(T("取大後進位", "Larger, rounded up"), 22) + d.standard + " lb  (" + winner + ")");
  }
  add("");

  head(T("步驟 6：附加費觸發判斷", "STEP 6: Surcharge triggers"));
  for (const [name, val, lim] of (d.nstd || [])) {
    const what = name !== "nstd_cube" ? T("最長邊", "longest side") : T("材積體積", "cubic volume");
    const unit = name === "nstd_cube" ? "in³" : "in";
    add("  " + names[name] + "：" + what + " " + g(val) + " " + unit + " > " + g(lim) + " " + unit);
  }
  if (!S.autolps && !S.autoahs) add(T("  自動判斷已關閉。", "  Automatic checking is switched off."));
  if (d.lp.length) {
    add(T("  LPS 成立，因為：", "  LPS applies because:"));
    for (const [k, v, th] of d.lp) add("    " + side[k] + " " + g(v) + " > " + g(th));
  } else {
    if (S.autolps) add(T("  LPS 不成立。", "  LPS does not apply."));
    if (d.aw.length) {
      add(T("  AHS－重量成立，因為：", "  AHS Weight applies because:"));
      for (const [v, th] of d.aw) add("    " + side.weight + " " + g(v) + " > " + g(th));
    }
    if (d.az.length) {
      add(T("  AHS－尺寸成立，因為：", "  AHS Size applies because:"));
      for (const [k, v, th] of d.az) add("    " + side[k] + " " + g(v) + " > " + g(th));
    }
    if (d.ahsp) {
      add(T("  AHS－包裝成立：", "  AHS Packaging applies:"));
      add(T("    未用瓦楞紙箱完整包覆（人工勾選，無法由尺寸推得）",
            "    not fully encased in corrugated cardboard (ticked by hand; cannot be derived from dimensions)"));
    }
    if (!d.aw.length && !d.az.length && !d.ahsp && S.autoahs)
      add(T("  AHS 不成立。", "  AHS does not apply."));
  }
  add("");

  head(T("步驟 7：最終計費重量", "STEP 7: Final billable weight"));
  if (!S.usemin) add(T("  最低計費重量已關閉。", "  Minimum billable weight is switched off."));
  else if (d.minw <= 0) add(T("  沒有觸發任何最低計費重量。", "  No minimum billable weight applies."));
  else {
    const src = d.balloon
      ? T("大而輕：長度加周長 " + g(d.lg) + " in 超過門檻",
          es ? ("grande pero ligero: largo + contorno " + g(d.lg) + " in arriba del umbral")
             : ("big but light: length + girth " + g(d.lg) + " in over the threshold"))
      : (d.lps ? T("LPS", "LPS") : T("AHS－尺寸", "AHS Size"));
    add("  " + pad(T("適用最低計費重量", "Minimum applied"), 22) + g(d.minw) + " lb  (" + src + ")");
  }
  add("  max(" + d.standard + ", " + g(d.minw) + ") = " + d.final + " lb");
  add("");

  if (d.omax) {
    head(T("超過包裹上限（Over Maximum Limits）", "OVER MAXIMUM LIMITS"));
    for (const [lab, val, lim, unit] of d.over)
      add("  " + pad(zh ? lab[0] : lab[1], 22) + g(val) + " " + unit + " > " + g(lim) + " " + unit);
    rule(T("UPS 條款：超過上限者不接受承運。實務上仍會送達，並加收此罰款。",
           "UPS terms: over-limit packages are not accepted for carriage. In practice they are delivered and this penalty is added."));
    rule(T("此費用「加在所有其他費用之上」，不取代 LPS，也不受 AHS／LPS 互斥規則影響。",
           "Charged in addition to all other charges. It does not replace LPS and is outside the AHS/LPS mutual exclusion."));
    add("");
  }

  head(T("步驟 8：基本運費", "STEP 8: Base transportation"));
  if (d.base_src === "table") {
    add("  " + pad(T("查表", "Lookup"), 22) + d.final + " lb + Zone " + d.zone);
    add("  " + pad(T("適用重量級距", "Weight break used"), 22) + g(d.base_break) + " lb");
    add("  " + pad(T("基本運費", "Base rate"), 22) + money(d.base));
  } else if (d.base_src === "missing") {
    add(T("  費率表裡找不到 " + d.final + " lb / Zone " + d.zone + "，基本運費以 $0 計。",
          "  " + d.final + " lb / zone " + d.zone + " is not in the rate table; base counted as $0."));
    const cap = num("maxw");
    if (cap && d.final > cap) {
      rule(T("計費重 " + d.final + " lb 超過 " + who + " 的 " + g(cap) + " lb 上限，這件根本不能用這家寄，不是費率表不夠長。",
             "A billable weight of " + d.final + " lb is past " + who + "'s " + g(cap) + " lb ceiling. This parcel cannot go with this carrier at all -- the table is not merely short."));
    } else {
      add(T("  費率表裡沒有這個重量或這個 Zone。", "  That weight or that zone is not in the rate table."));
    }
  }
  add("");

  head(T("步驟 9：附加費金額", "STEP 9: Surcharge amounts"));
  if (d.fees.length) for (const [k, a] of d.fees) add("  " + pad(names[k], 34) + money(a));
  else add(T("  沒有附加費。", "  No surcharges."));
  add("  " + pad(T("小計", "Subtotal"), 34) + money(d.subtotal));
  add("");

  head(T("步驟 10：燃油", "STEP 10: Fuel"));
  add("  " + pad(T("計算基礎", "Fuel basis"), 22) + money(d.base) + " + " + money(d.subtotal) + " = " + money(d.fuel_base));
  add("  " + money(d.fuel_base) + " x " + g(num("fuel")) + "% = " + money(d.fuel));
  add("  " + pad(T("比例來源", "Rate source"), 22) + T("手動輸入", "typed in"));
  add("");

  add();
  add("  " + pad(T("基本運費", "Base"), 22) + money(d.base), "sum");
  add("  " + pad(T("附加費", "Surcharges"), 22) + money(d.subtotal), "sum");
  add("  " + pad(T("燃油", "Fuel"), 22) + money(d.fuel), "sum");
  add("  " + pad(T("合計", "TOTAL"), 22) + money(d.total), "total");
  add();
  add("  " + T("總算式　（基本運費 ＋ 附加費）×（1 ＋ 燃油%）",
               "Total  =  (base + surcharges) x (1 + fuel%)"), "step");
  add("  (" + money(d.base) + " + " + money(d.subtotal) + ") x (1 + " + g(num("fuel")) + "%) = " + money(d.total), "sum");
  if (d.base_src === "missing") {
    add();
    add("  " + T("這不是完整報價：基本運費查不到，上面只是附加費與燃油的合計。",
                 "This is not a full quote: no base freight was found, so the figure above is surcharges and fuel only."), "total");
  }
  add();
  add(T("正式作業請核對該運輸商當期費率與你的客戶合約。",
        "For production work, verify against the carrier's current rates and your customer contract."), "foot");
  return L;
}

/* 桌面版 SELF_TESTS 那七筆，同一組期望值。 */
function runSelfTests() {
  const keep = JSON.parse(JSON.stringify({
    v: S.v, carrier: S.carrier, service: S.service, address: S.address,
    units: S.units, signature: S.signature, ahspack: S.ahspack,
    dastier: S.dastier, peak: S.peak,
  }));
  const out = [];
  S.units = "imperial";
  for (const [label, carrier, service, f, expW, expT] of D.SELF_TESTS) {
    let gw = "-", gt = "-", ok = false, err = "";
    try {
      S.carrier = carrier; S.service = service;
      applyServiceRules();
      for (const k of ["zone", "weight", "length", "width", "height"]) S.v[k] = f[k];
      S.v.from = "30340"; S.v.to = "";
      S.address = f.address;
      S.signature = !!f.signature; S.ahspack = !!f.ahspack;
      S.dastier = f.das || "none"; S.peak = !!f.peak;
      const d = computeData();
      gw = d.final; gt = Math.round(d.total * 100) / 100;
      ok = (gw === expW) && Math.abs(gt - expT) < 0.01;
    } catch (e) { err = String(e.message || e); }
    out.push({ label, ok, gw, gt, expW, expT, err });
  }
  S.v = keep.v; S.carrier = keep.carrier; S.service = keep.service;
  S.address = keep.address; S.units = keep.units; S.signature = keep.signature;
  S.ahspack = keep.ahspack; S.dastier = keep.dastier; S.peak = keep.peak;
  return out;
}

if (typeof module !== "undefined" && module.exports) {

/* ===========================================================================
   畫布轉接層。

   桌面版三萬行繪圖程式全部是 cv.create_line / create_oval / create_rectangle /
   create_polygon / create_arc / create_text 這六個呼叫。這裡把這六個實作在
   HTML5 canvas 上，參數名字、預設值、座標順序都照 tkinter——這樣搬過來的
   繪圖程式可以一行都不改，不必邊搬邊翻譯。

   已搬：draw_static 的房子本體（牆、地、天花板接縫、側牆、燈、招牌、EXIT、
   纏膜台、貨架三排含箱子、待運通道、月台開口）。
   未搬：屋架、盆栽、棧板、輸送帶、滑道、時鐘、飲水機、兩翼，以及所有會動
   的角色（人、狗、貓、堆高機）。那些在桌面版是另外四千多行。
   =========================================================================== */

const C = D.C;
const WX0 = -300, WX1 = 900 + 200, BLEED = 520;
const FLOOR_Y = 420, DOCK_X = 640, LANE_Y = 405, H = 560;
const VP = [452, 300];
const STUD_H = 3.2, STUD_MAX_ROW = 26, STUD_PITCH = 15.0;

/* tkinter 的畫布：座標系原點在左上、y 往下，和 canvas 一樣，所以不必翻轉。 */
class Cv {
  constructor(canvas, logicalW, logicalH) {
    this.c = canvas;
    this.g = canvas.getContext("2d");
    this.items = 0;
    this.lw = logicalW || canvas.width;
    this.lh = logicalH || canvas.height;
    this.k = 1;
  }
  /* 底圖對齊實際顯示的大小×螢幕密度，座標維持原本那一套。 */
  fit() {
    const c = this.c;
    const cssW = c.clientWidth || this.lw;
    const dpr = (typeof window !== "undefined" && window.devicePixelRatio) || 1;
    const want = Math.max(1, Math.round(cssW * dpr));
    const k = want / this.lw;
    const wantH = Math.max(1, Math.round(this.lh * k));
    if (c.width !== want || c.height !== wantH) { c.width = want; c.height = wantH; }
    this.k = k;
  }
  clear() {
    this.fit();
    this.g.setTransform(1, 0, 0, 1, 0, 0);
    this.g.clearRect(0, 0, this.c.width, this.c.height);
    this.g.setTransform(this.k, 0, 0, this.k, 0, 0);
    this.items = 0;
  }
  _paint(fill, outline, width) {
    const g = this.g;
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (outline) { g.strokeStyle = outline; g.lineWidth = width || 1; g.stroke(); }
    this.items++;
  }
  /* tkinter 的 smooth=True 是通過控制點的樣條。用「相鄰點的中點當端點、
     原點當控制點」的二次曲線逼近，形狀與 Tk 幾乎一致。 */
  _path(pts, smooth, close) {
    const g = this.g;
    g.beginPath();
    if (!smooth || pts.length < 6) {
      g.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
      if (close) g.closePath();
      return;
    }
    const p = [];
    for (let i = 0; i < pts.length; i += 2) p.push([pts[i], pts[i + 1]]);
    if (close) { p.unshift(p[p.length - 1]); p.push(p[1], p[2]); }
    g.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) {
      const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
      g.quadraticCurveTo(p[i][0], p[i][1], mx, my);
    }
    if (close) g.closePath();
    else g.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
  }
  create_line(...pts) {
    const o = (typeof pts[pts.length - 1] === "object") ? pts.pop() : {};
    const g = this.g;
    this._path(pts, o.smooth, false);
    g.strokeStyle = o.fill || "#000";
    g.lineWidth = o.width || 1;
    g.lineCap = o.capstyle === "round" ? "round" : "butt";
    g.setLineDash(o.dash || []);
    g.stroke();
    g.setLineDash([]);
    this.items++;
  }
  create_rectangle(x0, y0, x1, y1, o = {}) {
    const g = this.g;
    g.beginPath();
    g.rect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
    this._paint(o.fill, o.outline, o.width);
  }
  create_oval(x0, y0, x1, y1, o = {}) {
    const g = this.g;
    g.beginPath();
    g.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2,
              Math.abs(y1 - y0) / 2, 0, 0, Math.PI * 2);
    this._paint(o.fill, o.outline, o.width);
  }
  create_polygon(...pts) {
    const o = (typeof pts[pts.length - 1] === "object") ? pts.pop() : {};
    this._path(pts, o.smooth, true);
    this._paint(o.fill, o.outline, o.width);
  }
  create_arc(x0, y0, x1, y1, o = {}) {
    const g = this.g;
    const start = -(o.start || 0) * Math.PI / 180;
    const ext = -(o.extent === undefined ? 90 : o.extent) * Math.PI / 180;
    g.beginPath();
    g.ellipse((x0 + x1) / 2, (y0 + y1) / 2, Math.abs(x1 - x0) / 2,
              Math.abs(y1 - y0) / 2, 0, start, start + ext, ext < 0);
    if (o.style !== "arc") g.lineTo((x0 + x1) / 2, (y0 + y1) / 2);
    this._paint(o.fill, o.outline, o.width);
  }
  create_text(x, y, o = {}) {
    const g = this.g;
    const f = o.font || [14, false];
    g.font = (f[1] ? "bold " : "") + f[0] + 'px "Trebuchet MS", system-ui, sans-serif';
    g.fillStyle = o.fill || "#000";
    g.textBaseline = "middle";
    g.textAlign = o.anchor === "w" ? "left" : o.anchor === "e" ? "right" : "center";
    const lines = String(o.text).split("\n");
    const lh = f[0] * 1.15;
    lines.forEach((ln, i) => g.fillText(ln, x, y + (i - (lines.length - 1) / 2) * lh));
    this.items++;
  }
}

const font = (n, bold) => [n, !!bold];

function mixHex(col, amt) {
  const h = col.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16), g_ = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  const t = amt > 0 ? 255 : 0, a = Math.abs(amt);
  const f = v => Math.max(0, Math.min(255, Math.round(v + (t - v) * a)));
  const hx = v => f(v).toString(16).toUpperCase().padStart(2, "0");
  return "#" + hx(r) + hx(g_) + hx(b);
}
const vp = (x, y, k) => [x + (VP[0] - x) * k, y + (VP[1] - y) * k];

/* ---- 樂高顆粒 ------------------------------------------------------------ */
function bkStud(cv, cx, cy, r, col, h) {
  h = h === undefined ? STUD_H : h;
  const ry = Math.max(1.0, r * 0.44);
  const top = mixHex(col, 0.20), edge = mixHex(col, -0.36);
  if (r >= 3.4) cv.create_rectangle(cx - r, cy - h, cx + r, cy, { fill: mixHex(col, -0.12), outline: "" });
  cv.create_oval(cx - r, cy - h - ry, cx + r, cy - h + ry, { fill: top, outline: edge });
}
function bkStuds(cv, x0, x1, y, col, n, sc, outline) {
  sc = sc === undefined ? 1 : sc;
  const span = x1 - x0;
  if (span <= 0) return;
  const pitch = STUD_PITCH * sc;
  if (n === undefined || n === null) n = Math.max(1, Math.round(span / pitch));
  n = Math.min(n, STUD_MAX_ROW);
  if (n <= 0) return;
  const r = Math.min(pitch * 0.29, span / (n * 2.6));
  if (r < 1.1) return;
  const step = span / n;
  for (let i = 0; i < n; i++) bkStud(cv, x0 + step * (i + 0.5), y, r, col, STUD_H * sc);
}
function bkBaseplate(cv, x0, y0, x1, y1, col, sc, rows, fill) {
  sc = sc === undefined ? 1 : sc; rows = Math.max(1, Math.min(rows || 2, 3));
  if (fill) cv.create_rectangle(x0, y0, x1, y1, { fill: col, outline: "" });
  const depth = Math.max(1.0, y1 - y0);
  for (let r = 0; r < rows; r++) {
    const f = (r + 0.5) / rows;
    const yy = y0 + depth * (1.0 - f) * 0.72 + 3 * sc;
    const s = sc * (0.62 + 0.38 * f);
    const off = (r % 2) ? (STUD_PITCH * s * 0.5) : 0.0;
    bkStuds(cv, x0 - off, x1, yy, col, null, s);
  }
}
function box3d(cv, x0, y0, x1, y1, fill, outline, k) {
  k = k === undefined ? 0.10 : k;
  const side = mixHex(fill, -0.16), cap = mixHex(fill, 0.12);
  if ((x0 + x1) / 2 <= VP[0]) {
    const [ax, ay] = vp(x1, y0, k), [bx, by] = vp(x1, y1, k);
    cv.create_polygon(x1, y0, ax, ay, bx, by, x1, y1, { fill: side, outline });
  } else {
    const [ax, ay] = vp(x0, y0, k), [bx, by] = vp(x0, y1, k);
    cv.create_polygon(x0, y0, ax, ay, bx, by, x0, y1, { fill: side, outline });
  }
  const [tx0, ty0] = vp(x0, y0, k), [tx1, ty1] = vp(x1, y0, k);
  cv.create_polygon(x0, y0, tx0, ty0, tx1, ty1, x1, y0, { fill: cap, outline });
  bkStuds(cv, (x0 + tx0) / 2, (x1 + tx1) / 2, (y0 + ty0) / 2, fill,
          null, Math.min(1.0, (x1 - x0) / 46.0), outline);
  cv.create_rectangle(x0, y0, x1, y1, { fill, outline });
}

/* ---- draw_static 的房子本體 ---------------------------------------------- */
function drawStatic(cv) {
  cv.create_rectangle(WX0, 0, WX1 + BLEED, 105, { fill: C.wall2, outline: "" });
  cv.create_rectangle(WX0, 96, WX1 + BLEED, 108, { fill: C.wood2, outline: "" });
  trusses(cv);

  /* 天花板接縫 */
  for (let x = WX0 - 100; x < WX1 + BLEED + 200; x += 130) {
    const [px, py] = vp(x, 46, 0.14);
    cv.create_line(x, 46, px, py, { fill: "#2F4652" });
  }
  cv.create_rectangle(WX0, 105, WX1 + BLEED, FLOOR_Y, { fill: C.wall, outline: "" });

  /* 牆面的光暈：分五段，看起來是漸層而不是一塊平色 */
  const tones = ["#273943", "#253640", "#23343E", "#21323C", "#1F303A"];
  const top = 105, bot = FLOOR_Y, n = tones.length;
  tones.forEach((col, i) => {
    cv.create_rectangle(WX0, top + (bot - top) * i / n, WX1 + BLEED,
                        top + (bot - top) * (i + 1) / n + 1, { fill: col, outline: "" });
  });

  /* 側牆：房間要有往觀眾這邊來的牆，不然後牆會變成唯一的面 */
  for (const x of [WX0, WX1 + BLEED]) {
    const [tx, ty] = vp(x, 16, 0.20), [bx, by] = vp(x, FLOOR_Y, 0.20);
    cv.create_polygon(x, 16, tx, ty, bx, by, x, FLOOR_Y,
                      { fill: x === WX0 ? "#233440" : "#1F2F3A", outline: "" });
    for (let i = 1; i < 4; i++) {
      const p0 = vp(x, 16 + (FLOOR_Y - 16) * i / 4.0, 0.0);
      const p1 = vp(x, 16 + (FLOOR_Y - 16) * i / 4.0, 0.20);
      cv.create_line(p0[0], p0[1], p1[0], p1[1], { fill: "#2C4250" });
    }
  }

  cv.create_rectangle(WX0, FLOOR_Y, WX1 + BLEED, H, { fill: C.floor, outline: "" });
  bkBaseplate(cv, WX0, FLOOR_Y, WX1 + BLEED, H, mixHex(C.floor, 0.13), 1.15, 5, false);

  /* 燈 */
  for (const x of [-210, -80, 130, 355, 580, 805, 1010, 1230, 1450]) {
    cv.create_line(x, 0, x, 34, { fill: C.steel2, width: 2 });
    cv.create_oval(x - 55, FLOOR_Y - 10, x + 55, FLOOR_Y + 16, { fill: C.floor2, outline: "" });
    cv.create_oval(x - 18, 34, x + 18, 49, { fill: C.glow, outline: "" });
    cv.create_oval(x - 8, 37, x + 8, 45, { fill: C.glow2, outline: "" });
  }

  /* 招牌。名字只有這一個地方寫，跟桌面版的 BRAND_NAME 是同一件事。 */
  cv.create_rectangle(318, 24, 582, 74, { fill: C.dark, outline: C.steel });
  cv.create_text(450, 44, { text: (D.brand.name || D.brand.fallback),
                            fill: C.cream, font: font(15, true) });
  cv.create_text(450, 63, { text: "WAREHOUSE • DOCK 6", fill: C.muted, font: font(8) });

  cv.create_rectangle(590, 116, 630, 136, { fill: "#2E7D55", outline: "#D7F1E3" });
  cv.create_text(610, 126, { text: "EXIT", fill: "#F3FFF8", font: font(8, true) });

  /* 纏膜台與滅火器 */
  cv.create_rectangle(565, 148, 610, 210, { fill: C.mint, outline: C.steel2, width: 2 });
  for (const y of [163, 176, 189]) cv.create_line(572, y, 603, y, { fill: C.cream });
  cv.create_text(587, 222, { text: "WRAP", fill: C.muted, font: font(8) });
  cv.create_line(618, 300, 643, 300, { fill: C.safety, width: 3 });
  cv.create_line(625, 292, 643, 300, { fill: C.safety, width: 3 });
  cv.create_line(625, 308, 643, 300, { fill: C.safety, width: 3 });
  cv.create_rectangle(596, 288, 616, 300, { fill: C.orange2, outline: "" });

  /* 貨架三排 */
  for (let bay = 0; bay < 3; bay++) {
    const bx = 48 + bay * 175;
    const k = 0.085;
    const r0 = vp(bx, 150, k), r1 = vp(bx + 145, 150, k);
    const r2 = vp(bx + 145, 326, k), r3 = vp(bx, 326, k);
    cv.create_polygon(r0[0], r0[1], r1[0], r1[1], r2[0], r2[1], r3[0], r3[1],
                      { fill: "", outline: C.rack2, width: 2 });
    for (const [a, b] of [[[bx, 150], r0], [[bx + 145, 150], r1],
                          [[bx + 145, 326], r2], [[bx, 326], r3]]) {
      cv.create_line(a[0], a[1], b[0], b[1], { fill: C.rack2, width: 2 });
    }
    cv.create_rectangle(bx, 150, bx + 145, 326, { outline: C.rack, width: 3, fill: "" });
    for (const yy of [198, 250, 302]) {
      cv.create_line(bx, yy, bx + 145, yy, { fill: C.orange2, width: 4 });
      for (let slot = 0; slot < 2; slot++) {
        const sx = bx + 10 + slot * 67;
        const tone = [C.kraft2, C.kraft, C.kraft3][(bay + slot + yy) % 3];
        box3d(cv, sx, yy - 29, sx + 58, yy - 6, tone, C.wood2, 0.07);
        cv.create_line(sx + 29, yy - 29, sx + 29, yy - 6, { fill: C.wood2 });
        cv.create_rectangle(sx + 6, yy - 24, sx + 22, yy - 17, { fill: C.cream, outline: "" });
        cv.create_rectangle(sx, yy - 6, sx + 58, yy, { fill: C.wood, outline: "" });
      }
    }
    cv.create_text(bx + 72, 340, { text: "A" + (bay + 1), fill: C.muted, font: font(8) });
  }

  /* 待運通道 */
  cv.create_line(85, LANE_Y + 7, 470, LANE_Y + 7, { fill: C.safety, width: 3, dash: [13, 8] });

  /* 月台開口 */
  const ox0 = DOCK_X - 6, ox1 = DOCK_X + 190;

/* ---- 磚 ------------------------------------------------------------------ */
const CAP_D = 5.4, CAP_TILT = 0.62;
function bkBrick(cv, x0, y0, x1, y1, col, studs, sc, cap, outline, seam, side, depth) {
  sc = sc === undefined ? 1 : sc;
  if (x1 < x0) { const t = x0; x0 = x1; x1 = t; }
  if (y1 < y0) { const t = y0; y0 = y1; y1 = t; }
  const edge = (outline === undefined || outline === null) ? mixHex(col, -0.30) : outline;
  /* depth 讓呼叫端自己指定進深。磚塊沿用通用的 CAP_D 沒問題，但棧板有實際
     尺寸（48x40），進深必須照那個比例算，不能套磚塊的固定小位移。 */
  const d = (depth === undefined ? CAP_D * sc : depth), dy = d * CAP_TILT;
  /* 右側面。只有頂蓋和正面時，箱子讀起來是「一片板子加個蓋」——沒有任何一條
     線在說它有厚度。補上這一面，四個面才立得起來。 */
  if (side && d > 0.8) {
    cv.create_polygon(x1, y0, x1 + d, y0 - dy, x1 + d, y1 - dy, x1, y1,
                      { fill: mixHex(col, -0.16), outline: edge });
  }
  if (cap !== false && d > 0.8) {
    const top = mixHex(col, 0.14);
    cv.create_polygon(x0, y0, x0 + d, y0 - dy, x1 + d, y0 - dy, x1, y0,
                      { fill: top, outline: edge });
    bkStuds(cv, x0 + d * 0.5, x1 + d * 0.5, y0 - dy * 0.5, col, studs, sc, edge);
  }
  cv.create_rectangle(x0, y0, x1, y1, { fill: col, outline: edge });
  if (seam !== false && (y1 - y0) > 7 * sc) {
    cv.create_line(x0, y1 - 2 * sc, x1, y1 - 2 * sc, { fill: mixHex(col, -0.16) });
    if (side && d > 0.8)
      cv.create_line(x1, y1 - 2 * sc, x1 + d, y1 - 2 * sc - dy,
                     { fill: mixHex(col, -0.26) });
  }
}

/* ---- 盆栽 ---------------------------------------------------------------- */
const LEAVES = [[-1.34, 27, 0.72], [-0.98, 39, 0.90], [-0.58, 49, 1.00],
                [-0.16, 55, 1.06], [0.28, 52, 1.02], [0.72, 43, 0.92],
                [1.16, 31, 0.76], [1.46, 21, 0.62]];
function plant(cv, x, y, sc) {
  sc = sc === undefined ? 1 : sc;
  const S = v => v * sc;
  const pot = C.pot, potDk = mixHex(pot, -0.30), potLt = mixHex(pot, 0.20);
  const soil = "#3E2C1E";
  const bodyH = S(23), topW = S(16), botW = S(11);
  const crownY = y - bodyH - S(2);
  LEAVES.forEach(([ang, ln, k], i) => {
    const dx = Math.sin(ang), dy = -Math.cos(ang);
    const px = -dy, py = dx;
    const bow = S(4) * (dx >= 0 ? 1 : -1);
    const tipx = x + dx * S(ln), tipy = crownY + dy * S(ln);
    const midx = x + dx * S(ln) * 0.52 + px * bow * 0.5;
    const midy = crownY + dy * S(ln) * 0.52 + py * bow * 0.5;
    cv.create_line(x, crownY, midx, midy, tipx, tipy,
                   { fill: mixHex(C.leaf, -0.12), width: Math.max(2, Math.trunc(S(2.4))),
                     smooth: true, capstyle: "round" });
    const blade = (i % 2) ? C.leaf2 : C.leaf;
    const w = S(8.5 * k);
    const hx0 = x + dx * S(ln) * 0.24, hy0 = crownY + dy * S(ln) * 0.24;
    cv.create_polygon(hx0, hy0, midx + px * w, midy + py * w, tipx, tipy,
                      midx - px * w, midy - py * w,
                      { fill: blade, outline: mixHex(blade, -0.28), smooth: true });
    cv.create_line(midx - px * w * 0.30, midy - py * w * 0.30, tipx, tipy,
                   { fill: mixHex(blade, 0.22), width: Math.max(1, Math.trunc(S(1.4))),
                     capstyle: "round" });
  });
  cv.create_polygon(x - topW, y - bodyH, x - topW - S(1), y - bodyH * 0.45,
                    x - botW, y - S(3), x - botW * 0.7, y,
                    x + botW * 0.7, y, x + botW, y - S(3),
                    x + topW + S(1), y - bodyH * 0.45, x + topW, y - bodyH,
                    { fill: pot, outline: potDk, smooth: true });
  cv.create_polygon(x - topW + S(3), y - bodyH + S(2), x - topW + S(1), y - bodyH * 0.45,
                    x - botW + S(2), y - S(5), x - botW + S(5), y - S(5),
                    x - topW + S(7), y - bodyH * 0.5, x - topW + S(8), y - bodyH + S(2),
                    { fill: potLt, outline: "", smooth: true });
  cv.create_oval(x - topW - S(3), y - bodyH - S(7), x + topW + S(3), y - bodyH + S(2),
                 { fill: potLt, outline: potDk });
  cv.create_oval(x - topW + S(1), y - bodyH - S(5), x + topW - S(1), y - bodyH,
                 { fill: soil, outline: "" });
  for (const [ox, oy, r] of [[-6, -3.0, 1.6], [2, -2.2, 1.3], [7, -3.4, 1.1]])
    cv.create_oval(x + S(ox) - S(r), y - bodyH + S(oy) - S(r * 0.6),
                   x + S(ox) + S(r), y - bodyH + S(oy) + S(r * 0.6),
                   { fill: mixHex(soil, 0.14), outline: "" });
}

/* ---- 棧板 ---------------------------------------------------------------- */
function palletAt(cv, x, y, p, scale) {
  scale = scale === undefined ? 1 : scale;
  /* 48 x 40 標準棧板。正面那一邊是 48 吋，w 就代表 48 吋，每吋 = w/48；側面
     40 吋照同一個尺換算，再乘斜投影的縮短率——不縮的話 40 吋會畫得跟 48 吋
     差不多長，跟場景其他斜角就對不上了。 */
  const w = 72 * scale, bh = 12 * scale, stackH = p.boxes * bh;
  const PALLET_IN_W = 48, PALLET_IN_D = 40, FORESHORTEN = 0.42;
  const dep = PALLET_IN_D * (w / PALLET_IN_W) * FORESHORTEN;
  const depy = dep * CAP_TILT;
  cv.create_oval(x - 5, y - 3 - depy, x + w + dep + 6, y + 8,
                 { fill: mixHex(C.floor, -0.17), outline: "" });
  let top = y - 9 * scale;
  for (let i = 0; i < p.boxes; i++) {
    bkBrick(cv, x + 1 * scale, top - bh, x + w - 1 * scale, top, p.tone, 3, scale,
            i === p.boxes - 1, C.kraft2, true, true, dep);
    top -= bh;
  }
  if (p.wrapped) {
    const ww = Math.max(1, Math.trunc(2 * scale));
    const wd = dep, wdy = depy;
    cv.create_rectangle(x + 1, y - 9 * scale - stackH, x + w - 1, y - 9 * scale,
                        { outline: C.wrap, width: ww });
    /* 膜是整箱裹起來的，右側面也要包到；只框正面會變成箱子前面立了一塊白框。 */
    cv.create_polygon(x + w - 1, y - 9 * scale - stackH,
                      x + w - 1 + wd, y - 9 * scale - stackH - wdy,
                      x + w - 1 + wd, y - 9 * scale - wdy,
                      x + w - 1, y - 9 * scale,
                      { fill: "", outline: C.wrap, width: ww });
  }
  bkBrick(cv, x, y - 9 * scale, x + w, y - 4 * scale, C.wood, 4, scale, false,
          C.wood2, false, true, dep);
  /* 棧板腳墩：正面一塊、側面一塊。少了側面，整塊板就成了貼在地上的色條。 */
  cv.create_polygon(x + w, y - 4 * scale, x + w + dep, y - 4 * scale - depy,
                    x + w + dep, y - depy, x + w, y,
                    { fill: mixHex(C.wood2, -0.18), outline: "" });
  cv.create_rectangle(x, y - 4 * scale, x + w, y, { fill: C.wood2, outline: "" });
}

function wingRack(cv, bx, label, seed) {
  const rack = mixHex(C.rack, -0.10), rack2 = C.rack2, k = 0.070;
  const r0 = vp(bx, 168, k), r1 = vp(bx + 112, 168, k);
  const r2 = vp(bx + 112, 322, k), r3 = vp(bx, 322, k);
  cv.create_polygon(r0[0], r0[1], r1[0], r1[1], r2[0], r2[1], r3[0], r3[1],
                    { fill: "", outline: rack2, width: 2 });
  for (const [a, b] of [[[bx, 168], r0], [[bx + 112, 168], r1],
                        [[bx + 112, 322], r2], [[bx, 322], r3]])
    cv.create_line(a[0], a[1], b[0], b[1], { fill: rack2, width: 2 });
  cv.create_rectangle(bx, 168, bx + 112, 322, { outline: rack, width: 3, fill: "" });
  const picks = D.SCENE_RNG.wing_racks[String(seed)];
  let n = 0;
  for (const yy of [212, 262, 312]) {
    cv.create_line(bx, yy, bx + 112, yy, { fill: mixHex(C.orange2, -0.12), width: 4 });
    for (let slot = 0; slot < 2; slot++) {
      const sx = bx + 8 + slot * 52;
      const tone = [C.kraft2, C.kraft, C.kraft3][picks[n++]];
      box3d(cv, sx, yy - 26, sx + 44, yy - 6, mixHex(tone, -0.08), C.wood2, 0.06);
      cv.create_rectangle(sx + 5, yy - 22, sx + 17, yy - 16, { fill: C.cream, outline: "" });
      cv.create_rectangle(sx, yy - 6, sx + 44, yy, { fill: C.wood, outline: "" });
    }
  }
  cv.create_text(bx + 56, 336, { text: label, fill: C.muted, font: font(8) });
}

}

function usDst(u) {
  const nthSunday = (year, month, n) => {
    const wd = new Date(Date.UTC(year, month - 1, 1)).getUTCDay(); /* 0=Sun */
    const first = 1 + (7 - wd) % 7;
    return first + (n - 1) * 7;
  };
  const y = u.getUTCFullYear();
  const start = Date.UTC(y, 2, nthSunday(y, 3, 2), 10);
  const end = Date.UTC(y, 10, nthSunday(y, 11, 1), 9);
  const t = u.getTime();
  return start <= t && t < end;
}
function sceneNow() {
  const [off, dstRule, tags] = D.SCENE_ZONES[SCENE_ZONE] || D.SCENE_ZONES.pacific;
  const u = new Date();
  const dst = dstRule && usDst(u);
  const local = new Date(u.getTime() + (off + (dst ? 1 : 0)) * 3600000);
  return [local, tags[dst ? 1 : 0]];
}
function shiftPhase() {
  const [now] = sceneNow();
  const wd = (now.getUTCDay() + 6) % 7;          /* Python weekday()：一=0 */
  if (wd >= 5) return "closed";
  const m = now.getUTCHours() * 60 + now.getUTCMinutes();
  const at = hm => hm[0] * 60 + hm[1];
  if (m < at(SHIFT_START)) return "closed";
  if (m < at(SHIFT_START) + ARRIVE_MINS) return "arrive";
  if (m < at(SHIFT_LUNCH)) return "work";
  if (m < at(SHIFT_BACK)) return "lunch";
  if (m < at(SHIFT_WRAP)) return "work";
  if (m < at(SHIFT_WRAP) + 10) return "wrap";
  if (m < at(SHIFT_END)) return "leave";
  return "closed";
}

const BELT_ITEMS = [[0, 34], [170, 26], [330, 40], [470, 30]];

const beltPos = (t, k) => {
  const span = K.BELT_X1 - K.BELT_X0 + 120;
  return K.BELT_X0 - 60 + (((t * BELT_SPEED + k) % span) + span) % span;
};
function beltBoxes(t) {

    const bx = beltPos(t, k);
    if (K.BELT_X0 - 40 <= bx && bx <= K.BELT_X1 + BELT_DROP) out.push([bx, w]);
  }

}

function conveyor(cv, t) {
  const x0 = K.BELT_X0, x1 = K.BELT_X1, y = K.BELT_Y;
  const tread = ((t * BELT_SPEED) % 30 + 30) % 30;

    if (x0 + 2 <= mx && mx <= x1 - 2) cv.create_line(mx, y - 5, mx, y + 5, { fill: C.steel });

    cv.create_line(bx + w / 2, top, bx + w / 2, by - 6, { fill: mixHex(C.kraft, -0.18) });

/* ---- 餵食那一趟：走進來→蹲下提袋→抱去碗邊→蹲著倒→放回去→走出去 ---- */
const FEED = { HOME_X: -46.0, BAG_X: 112.0, BAG_Y: FLOOR_Y + 74,
               POUR_X: WATER_BOWL_X, WALK: 190, LIFT: 34, BACK: 170,
               POUR: 90, HOME: 190, OUT: 190 };
FEED.TOTAL = FEED.WALK + FEED.LIFT + FEED.BACK + FEED.POUR + FEED.HOME + FEED.OUT;
function feedState() {
  if (DK.feedFrom === null || DK.feedFrom === undefined) return null;
  let u = DK.frame - DK.feedFrom;
  if (u < 0 || u > FEED.TOTAL) return null;
  if (u < FEED.WALK) {
    const a = FEED.HOME_X, b = FEED.BAG_X;
    return [a + (b - a) * (u / FEED.WALK), "fetch", u / FEED.WALK];
  }
  u -= FEED.WALK;
  if (u < FEED.LIFT) return [FEED.BAG_X, "lift", u / FEED.LIFT];
  u -= FEED.LIFT;
  if (u < FEED.BACK) {
    const a = FEED.BAG_X, b = FEED.POUR_X;
    return [a + (b - a) * (u / FEED.BACK), "carry", u / FEED.BACK];
  }
  u -= FEED.BACK;
  if (u < FEED.POUR) {
    const k = u / FEED.POUR;
    return [k < 0.5 ? DOG_BOWL_X - 26 : CAT_BOWL_X + 26, "pour", k];
  }
  u -= FEED.POUR;
  if (u < FEED.HOME) {
    const a = FEED.POUR_X, b = FEED.BAG_X;
    return [a + (b - a) * (u / FEED.HOME), "back", u / FEED.HOME];
  }
  u -= FEED.HOME;
  const a = FEED.BAG_X, b = FEED.HOME_X;
  return [a + (b - a) * (u / FEED.OUT), "exit", u / FEED.OUT];
}
function feeding(cv) {
  const st = feedState();
  if (st === null) { feedSack(cv, FEED.BAG_X, FEED.BAG_Y, 1.0, true); return; }
  const [x, phase, u] = st;
  const carrying = ["lift", "carry", "pour"].indexOf(phase) >= 0;
  const walking = ["fetch", "carry", "back", "exit"].indexOf(phase) >= 0;
  let heading;
  if (phase === "fetch") heading = -1;
  else if (phase === "carry") heading = 1;
  else if (phase === "pour") heading = ((u < 0.5 ? DOG_BOWL_X : CAT_BOWL_X) > x) ? 1 : -1;
  else heading = -1;
  let crouch = 0.0;
  if (phase === "lift") crouch = Math.sin(Math.PI * u);
  else if (phase === "pour") crouch = u < 0.5 ? Math.min(1.0, u * 5.0) : Math.min(1.0, (1.0 - u) * 5.0);
  const tilt = phase === "pour" ? Math.sin(Math.PI * Math.min(1.0, u * 1.4)) : 0.0;
  if (!carrying) feedSack(cv, FEED.BAG_X, FEED.BAG_Y, 1.0, true);
  workerFig(cv, x, WALK_Y, walking ? DK.frame * 0.13 : 0.0,
            { arm_lift: carrying ? (phase === "carry" ? 0.9 : 0.25) : 0.0,
              crouch, face: heading });
  if (carrying) {
    const bowl = u < 0.5 ? DOG_BOWL_X : CAT_BOWL_X;
    const lean = bowl > x ? 1 : -1;
    let bx, by;
    if (phase === "lift") { bx = FEED.BAG_X + 13; by = WALK_Y - 4 - 16 * u; }
    else if (phase === "carry") { bx = x; by = WALK_Y - 30; }
    else {
      const standY = WALK_Y - 30;
      bx = x + 15 * lean + 8 * lean * tilt;
      by = standY + 13 * crouch + (WALK_Y - 12 - standY) * crouch * 0.55;
    }
    feedSack(cv, bx, by, 0.85 * (1.0 - 0.10 * crouch), false);
    if (phase === "pour" && tilt > 0.25) {
      const drop = BOWL_Y - 7 - by;
      for (let k = 0; k < 7; k++) {
        const f = (((DK.frame * 0.09 + k * 0.143) % 1.0) + 1.0) % 1.0;
        const dy = by + drop * f;
        const dx = bx + (bowl - bx) * f + (k % 2 ? 2.4 : -2.4);
        const r = 1.6 + 0.5 * (k % 3);
        cv.create_oval(dx - r, dy - r, dx + r, dy + r, { fill: "#C98A4B", outline: "" });
      }
    }
  }
}

const EAT_FRAMES = 150;
function sceneClick(px, py) {
  const s = DK;
  const cands = [

    ["cat", Math.hypot(px - s.catPos[0], py - s.catPos[1]), 28],
    ["dogbowl", Math.hypot(px - DOG_BOWL_X, py - BOWL_Y), 16],
    ["catbowl", Math.hypot(px - CAT_BOWL_X, py - BOWL_Y), 15],
    ["waterbowl", Math.hypot(px - WATER_BOWL_X, py - WATER_BOWL_Y), 15],
    ["litter", Math.hypot(px - LITTER_X, py - LITTER_Y), 22],
  ].concat(s.poos.map(x => ["litter", Math.hypot(px - x, py - (FLOOR_Y + 66)), 14]))
   .concat(s.pees.map(x => ["litter", Math.hypot(px - x, py - (FLOOR_Y + 66)), 14]));
  const near = cands.filter(c => c[1] < c[2]);
  if (!near.length) return;
  let best = near[0];
  for (const c of near) if (c[1] / c[2] < best[1] / best[2]) best = c;
  const what = best[0];
  if (what === "waterbowl") {
    s.eat.dog = Math.min(s.eat.dog, s.frame);
    s.eat.cat = Math.min(s.eat.cat, s.frame);

  if (what === "litter") { callClean(); return; }
  if (what.endsWith("bowl")) { startFeed(); return; }
  /* 摸到本人：狗停下、面向你、汪汪；貓喵一聲冒愛心。 */
  s.pokeX = px;
  if (what === "dog") s.dogReact = s.frame + 90;
  else s.catPoke = s.frame + 90;

/* 叫清潔阿姨：按下去的當下把路線排好——地上的屎一坨一坨鏟、尿一灘一灘
   拖、最後到貓砂盆挖，全部由近到遠一趟走完，提著袋子出去。 */
function callClean() {
  if (DK.cleanPlan !== null && DK.cleanPlan !== undefined) return false;
  const speed = 2.0;
  let jobs = DK.poos.map(x => ["poo", x])
    .concat(DK.pees.map(x => ["pee", x]))
    .concat([["tray", LITTER_X]]);
  if (!DK.poos.length && !DK.pees.length && DK.dirty < 0.12
      && !DK.litterLumps.length)
    jobs = [["sweep", -152.0], ["wipe", 500.0]];
  jobs.sort((a, b) => Math.abs(a[1] - FEED.HOME_X) - Math.abs(b[1] - FEED.HOME_X));
  const plan = [];
  let t = 0.0, here = FEED.HOME_X;
  const DUR = { poo: 70.0, pee: 100.0, tray: 110.0, sweep: 150.0, wipe: 130.0 };
  for (const [kind, x] of jobs) {
    const walk = Math.abs(x - here) / speed;
    plan.push([t, t + walk, "walk", here, x - 18, null]); t += walk;
    plan.push([t, t + DUR[kind], kind, x - 18, x - 18, x]); t += DUR[kind];
    here = x - 18;
  }
  const walk = Math.abs(FEED.HOME_X - here) / speed;
  plan.push([t, t + walk, "walk_out", here, FEED.HOME_X, null]); t += walk;
  DK.cleanPlan = [DK.frame, t, plan];
  DK.cleanGot = 0;
  DK.trayLast = -99;
  return true;
}
function cleanState() {
  if (DK.cleanPlan === null || DK.cleanPlan === undefined) return null;
  const [t0, total, plan] = DK.cleanPlan;
  const u = DK.frame - t0;
  if (u < 0 || u > total) { DK.cleanPlan = null; return null; }
  for (const [a, b, kind, x0, x1, stop] of plan) {
    if (u <= b) {
      const k = b <= a ? 0.0 : (u - a) / (b - a);
      if (kind === "poo") {
        if (k > 0.94 && DK.poos.indexOf(stop) >= 0) {
          DK.poos.splice(DK.poos.indexOf(stop), 1); DK.cleanGot++;
        }
        return [x0, "poo", k, stop];
      }
      if (kind === "pee") {
        if (k > 0.9 && DK.pees.indexOf(stop) >= 0)
          DK.pees.splice(DK.pees.indexOf(stop), 1);
        return [x0, "pee", k, stop];
      }
      if (kind === "sweep" || kind === "wipe") return [x0, kind, k, stop];
      if (kind === "tray") {
        DK.dirty = Math.max(0.0, DK.dirty - 0.016 * DK.dt);
        if (DK.litterLumps.length) {
          const reach = (Math.sin(DK.frame * 0.30) + 1) / 2;
          if (reach > 0.92 && DK.frame - DK.trayLast > 22) {
            DK.litterLumps.pop(); DK.cleanGot++; DK.trayLast = DK.frame;
          }
        }
        return [x0, "tray", k, stop];
      }
      return [x0 + (x1 - x0) * k, kind, k, null];
    }
  }

}

function bitePose(sx, y, sc, t, offset) {
  const u = ((((t + offset) % BITE_PERIOD) + BITE_PERIOD) % BITE_PERIOD) / BITE_PERIOD;
  let k;
  if (u < 0.30) k = u / 0.30;
  else if (u < 0.60) k = 1.0;
  else if (u < 0.85) k = 1.0 - (u - 0.60) / 0.25;
  else k = 0.0;
  const rest = [sx + 15 * sc, y - 16 * sc], mouth = [sx + 7 * sc, y - 34 * sc];
  const hx = rest[0] + (mouth[0] - rest[0]) * k;
  const hy = rest[1] + (mouth[1] - rest[1]) * k;
  const dip = (0.36 < u && u < 0.58) ? 1.6 * sc : 0.0;
  return [[hx, hy], dip, k];
}
/* 午休：六個人入座——走道兩位加四位站點人員，走到位子才坐下，還在路

/* ---- 天色系統。分頁二～四的戶外場景共用：十段天色照鐘點內插，首尾相
   接（23:30 到 00:30 不閃）。時鐘用場景自己的時區。 ------------------- */
function pyRound(v) {
  /* Python 的 round：五成雙。0.5 進位到偶數那一側。 */
  const f = Math.floor(v), r = v - f;
  if (r > 0.5) return f + 1;
  if (r < 0.5) return f;
  return f % 2 === 0 ? f : f + 1;
}
function skyMix(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return "#" + pa.map((x, i) => {
    const v = Math.max(0, Math.min(255, pyRound(x + (pb[i] - x) * t)));
    return v.toString(16).toUpperCase().padStart(2, "0");
  }).join("");
}
function skyAt(hour) {
  const h = ((hour % 24.0) + 24.0) % 24.0;
  const pts = D.SKY_PHASES;
  for (let i = 0; i < pts.length; i++) {
    const [t0, a] = pts[i];
    const [t1, b] = i + 1 < pts.length ? pts[i + 1] : [pts[0][0] + 24.0, pts[0][1]];
    if (t0 <= h && h < t1) {
      const k = (h - t0) / (t1 - t0);
      return { top: skyMix(a.top, b.top, k), low: skyMix(a.low, b.low, k),
               cloud: skyMix(a.cloud, b.cloud, k), shade: skyMix(a.shade, b.shade, k),
               light: a.light + (b.light - a.light) * k, hour: h };
    }
  }
  return Object.assign({}, pts[0][1], { hour: h });
}
function skyHour() {
  const [now] = sceneNow();
  return now.getUTCHours() + now.getUTCMinutes() / 60.0 + now.getUTCSeconds() / 3600.0;
}

/* ---- 站點人員的走位系統（s.hands 那一套，照桌面版） ---------------------- */
const DOOR_X = -46.0, HAND_POSTS = [[570.0, 392.0], [500.0, FLOOR_Y - 4],
                                    [486.0, FLOOR_Y + 68], [420.0, 496.0]];
const HAND_STEP = [0.78, 0.64, 0.70, 0.58];
const CREW_STEP = 1.9, LEAVE_STEP = 0.85, WALK_EASE = 22.0;
const LUNCH_A = 222.0, LUNCH_B = 268.0;
function handTargets() {
  const ph = shiftPhase();
  if (ph === "lunch")
    return [[BREAK_SEATS[2], BREAK_Y - 14], [BREAK_SEATS[3], BREAK_Y - 14],
            [BREAK_SEATS[4], BREAK_Y - 14], [BREAK_SEATS[5], BREAK_Y - 14]];
  if (ph === "leave" || ph === "closed")
    return [0, 1, 2, 3].map(i => [DOOR_X - 20 * i, WALK_Y]);
  return HAND_POSTS.map(p => p.slice());
}
function stepHands() {
  const tg = handTargets();
  for (let i = 0; i < 4; i++) {
    const step = HAND_STEP[i] * DK.speed;
    for (const k of [0, 1]) {
      const gap = tg[i][k] - DK.hands[i][k];
      if (Math.abs(gap) <= step) DK.hands[i][k] = tg[i][k];
      else DK.hands[i][k] += gap > 0 ? step : -step;
    }
  }
}
function handAtPost(i) {
  return Math.abs(DK.hands[i][0] - HAND_POSTS[i][0]) < 0.6
      && Math.abs(DK.hands[i][1] - HAND_POSTS[i][1]) < 0.6;
}
function insideStaff(x) { return x <= DOOR_X + 8.0; }
function walkTo(x, target, step) {
  step = (step === null || step === undefined ? CREW_STEP : step) * DK.dt;
  const gap = target - x;
  if (Math.abs(gap) < WALK_EASE)
    step = Math.max(step * 0.32, step * Math.abs(gap) / WALK_EASE);
  if (Math.abs(gap) <= step) return target;
  return x + (gap > 0 ? step : -step);
}
function crewTargets() {
  const ph = shiftPhase();
  if (ph === "arrive") return [310.0, 120.0];
  if (ph === "lunch") return [LUNCH_A, LUNCH_B];
  if (ph === "leave" || ph === "closed") return [DOOR_X, DOOR_X - 46];
  return null;
}
/* 員工門兩片鋼門：往兩側滑，開度由「有沒有人在門口」算——人到門開、
   人走門關，不另外存門的狀態機。 */
function staffDoorLeaf(cv, k) {
  const x = K.STAFF_X, y0 = K.DOOR_TOP, y1 = K.DOOR_BOT;
  const half = 28, slide = (half - 4) * k;
  for (const side of [-1, 1]) {
    const a = x + side * slide - (side < 0 ? half : 0);
    const b = a + half;
    cv.create_rectangle(a, y0, b, y1, { fill: C.steel2, outline: C.steel, width: 2 });
    const wx0 = Math.max(a + 4, x - 20 + side * slide);
    const wx1 = Math.min(b - 4, x + 20 + side * slide);
    if (wx1 > wx0 + 4)
      cv.create_rectangle(wx0, y0 + 9, wx1, y0 + 29, { fill: "#2A3C47", outline: C.steel });
  }
}
function staffOpen() {
  let best = 0.0;
  const xs = [DK.workerX, DK.worker2X].concat(DK.hands.map(h => h[0]));
  for (const px of xs) {
    const k = 1.0 - Math.abs(px - K.STAFF_X) / 46.0;
    if (k > best) best = k;
  }
  for (const fn of [feedState, cleanState]) {
    const st = fn();
    if (st === null) continue;
    const k = 1.0 - Math.abs(st[0] - K.STAFF_X) / 40.0;
    if (k > best) best = k;
  }
  return Math.max(0.0, Math.min(1.0, best));
}

/* ---- 月台的拖車循環 ------------------------------------------------------
   門洞現在是一個大黑洞，因為該停在裡面的那台拖車還沒搬。整段照桌面版：
   truck_state / phase 八段、捲門、升降平台、車上一板一板堆起來、六板滿
   關門開走。車身寬 230 而門洞只有 196——牆是實心的，門洞外那截不畫。 */
const BED_Y = 352;
const DOCK = {
  phase: "wait_truck", timer: 0, truckX: 1100, door: 0.0, gate: 1.0,
  gateLoad: false, load: 0, done: 0,
  forkX: 430.0, forkTarget: 140.0, forkCarry: false, stage: 0,
};
function ease(v, target, k) { return v + (target - v) * k; }
function stepDock(d) {
  const s = DOCK, sp = DK.speed;
  s.timer += d;
  /* 堆高機來回補待運通道的板。 */
  s.forkX += (s.forkTarget > s.forkX ? 1 : -1) * 1.25 * sp;
  if (Math.abs(s.forkX - s.forkTarget) < 3) {
    if (s.forkTarget > 300) {
      if (!s.forkCarry) s.forkCarry = true;
      s.forkTarget = 140;
    } else {
      if (s.stage < 2 && s.forkCarry) { s.stage += 1; s.forkCarry = false; }
      s.forkTarget = 430;
    }
  }
  if (s.phase === "wait_truck") {
    s.truckX = ease(s.truckX, DOCK_X + 8, 0.055);
    if (Math.abs(s.truckX - (DOCK_X + 8)) < 2) {
      s.truckX = DOCK_X + 8; s.phase = "open"; s.timer = 0;
    }
  } else if (s.phase === "open") {
    s.door = Math.min(1.0, s.door + 0.025 * sp);
    if (s.door >= 1.0 && s.timer > 35) { s.phase = "lower"; s.timer = 0; }
  } else if (s.phase === "lower") {
    s.gate = Math.max(0.0, s.gate - 0.025 * sp);
    if (s.gate <= 0.0 && s.timer > 30) { s.phase = "load_gate"; s.timer = 0; }
  } else if (s.phase === "load_gate") {
    if (!s.gateLoad && s.stage > 0) { s.stage -= 1; s.gateLoad = true; }
    if (s.timer > 45) { s.phase = "raise"; s.timer = 0; }
  } else if (s.phase === "raise") {
    s.gate = Math.min(1.0, s.gate + 0.025 * sp);
    if (s.gate >= 1.0 && s.timer > 30) { s.phase = "push"; s.timer = 0; }
  } else if (s.phase === "push") {
    if (s.timer > 35) {
      s.gateLoad = false; s.load += 1;
      s.phase = s.load >= 6 ? "close" : "lower";
      s.timer = 0;
    }
  } else if (s.phase === "close") {
    s.door = Math.max(0.0, s.door - 0.025 * sp);
    if (s.door <= 0 && s.timer > 35) { s.phase = "leave"; s.timer = 0; }
  } else if (s.phase === "leave") {
    s.truckX += 4.0 * sp;
    if (s.truckX > WX1 + 180) {
      s.done += 1; s.load = 0; s.phase = "wait_truck"; s.timer = 0;
      s.truckX = WX1 + 180;
    }
  }
}
function dockTruck(cv) {

  if (s.phase === "wait_truck" || s.phase === "leave") {

  } else {

    for (let i = 0; i < s.load; i++) {

                      { fill: C.steel, outline: C.steel2 });
  cv.create_rectangle(DOCK_X - 5, gy, DOCK_X + 72, gy + 5, { fill: C.steel2, outline: "" });
  if (s.gateLoad)
    palletAt(cv, DOCK_X - 2, gy - 8, D.SCENE_RNG.pallets["952"], 0.68);

function rollingDoor(cv) {
