                 { fill: C.glow, outline: mixHex(C.glow, -0.35) });
}

/* ---- 貓。醒著是四腳站姿（走路對角步態），睡著捲成一團打呼。 ---------- */
function catFig(cv, x, y, t, o = {}) {
  const sc0 = o.sc === undefined ? 0.40 : o.sc;
  const { spooked = false, awake = false, walking = false, face = 1,
          gait = 0.0, eat = 0.0, fat = 0.0, squat = 0.0 } = o;
  const body = "#C79A63", edge = C.wood2;
  const cream = "#F6EFE4", pink = "#EFA9A8", blush = "#E8A08F";
  const sc = sc0 * (spooked ? 1.18 : 1.0);
  const wide = 1.0 + 0.55 * fat;
  const S = v => v * sc, W = v => v * sc * wide, F = v => v * face;
  const ears = (hx, hy) => {
    for (const [ear, lean] of [[-13, -3], [5, 3]]) {
      cv.create_polygon(hx + F(S(ear)), hy - S(6),
                        hx + F(S(ear + 4 + lean * 0.4)), hy - S(21),
                        hx + F(S(ear + 11)), hy - S(4),
                        { fill: body, outline: edge, smooth: true });
      cv.create_polygon(hx + F(S(ear + 3.2)), hy - S(7),
                        hx + F(S(ear + 5.4 + lean * 0.3)), hy - S(16),
                        hx + F(S(ear + 8.8)), hy - S(6),
                        { fill: pink, outline: "", smooth: true });
    }
  };
  const muzzle = (hx, hy) => {
    const w = Math.max(1, Math.trunc(1.2 * sc));
    for (const side of [-1, 1])
      for (const dy of [-2.2, 0.4, 2.8])
        cv.create_line(hx + S(6.5 * side), hy + S(2.4), hx + S(16 * side), hy + S(dy),
                       { fill: mixHex(cream, -0.22), width: w, capstyle: "round" });
    cv.create_oval(hx - S(7.5), hy - S(0.5), hx + S(7.5), hy + S(8), { fill: cream, outline: "" });
    for (const cxo of [-9.5, 9.5])
      cv.create_oval(hx + S(cxo) - S(3.6), hy + S(1.4), hx + S(cxo) + S(3.6), hy + S(5.2),
                     { fill: blush, outline: "" });
    cv.create_polygon(hx - S(2.4), hy + S(1.4), hx + S(2.4), hy + S(1.4), hx, hy + S(4.0),
                      { fill: pink, outline: "", smooth: true });
    for (const side of [-1, 1])
      cv.create_line(hx, hy + S(4.2), hx + S(1.6 * side), hy + S(6.4),
                     hx + S(3.6 * side), hy + S(4.6),
                     { fill: mixHex(edge, 0.15), width: w, smooth: true, capstyle: "round" });
  };
  if (spooked || awake) {
    const br = 1 + ((spooked ? 0.14 : 0.04) * (1.0 - 0.85 * eat) * Math.sin(t * (spooked ? 0.5 : 0.14)));
    const step = walking ? Math.sin(gait) : 0.0;
    const sq = Math.max(0.0, Math.min(1.0, squat));
    const drop = S(7) * sq;
    cv.create_oval(x + F(S(-26)), y - S(2), x + F(S(22)), y + S(4), { fill: C.floor2, outline: "" });
    if (spooked) {
      for (let k = 0; k < 11; k++) {
        const th = Math.PI * (0.10 + 0.80 * k / 10.0);
        const ox = Math.cos(th), oy = Math.sin(th);
        const bx = x + F(S(-4)), by = y - S(24);
        cv.create_line(bx + F(ox * S(19)), by - oy * S(8), bx + F(ox * S(24)), by - oy * S(13),
                       { fill: body, width: Math.max(1, Math.trunc(2.4 * sc)), capstyle: "round" });
      }
    }
    if (sq > 0.5) {
      cv.create_line(x + F(S(-19)), y - S(16) + drop, x + F(S(-30)), y - S(11) + drop,
                     x + F(S(-40)), y - S(6) + drop,
                     { fill: body, width: Math.max(3, Math.trunc(7 * sc)), smooth: true, capstyle: "round" });
      cv.create_oval(x + F(S(-44)), y - S(9) + drop, x + F(S(-37)), y - S(2) + drop,
                     { fill: cream, outline: "" });
    } else {
      cv.create_line(x + F(S(-19)), y - S(22), x + F(S(-32)), y - S(36),
                     x + F(S(-22)), y - S(50), x + F(S(-31)), y - S(55),
                     { fill: body, width: Math.max(3, Math.trunc(7 * sc)), smooth: true, capstyle: "round" });
      cv.create_oval(x + F(S(-35)), y - S(59), x + F(S(-27)), y - S(51), { fill: cream, outline: "" });
    }
    const far = mixHex(body, -0.16), farCream = mixHex(cream, -0.12);
    const lw = Math.max(2, Math.round(6.2 * sc));
    const paw = (ox, sw, near) => {
      const lx = x + F(S(ox)), tip = lx + F(sw);
      const coat = near ? body : far, sock = near ? cream : farCream;
      const top = y - S(19) + drop;
      cv.create_line(lx, top, tip, y - S(7) + drop * 0.5, { fill: coat, width: lw, capstyle: "round" });
      cv.create_line(tip, y - S(8) + drop * 0.6, tip, y - S(2.5),
                     { fill: sock, width: Math.max(2, Math.round(5.6 * sc)), capstyle: "round" });
      cv.create_oval(tip - S(4.2), y - S(4), tip + S(4.2), y + S(0.6),
                     { fill: sock, outline: near ? edge : "" });
    };
    paw(6, -step * S(4.4), false);
    paw(-13, step * S(4.4), false);
    cv.create_oval(x + F(W(-22)), y - S(31) * br + drop, x + F(W(18)),
                   y - S(14) + S(4) * fat + drop, { fill: body, outline: edge });
    paw(13, step * S(4.4), true);
    paw(-6, -step * S(4.4), true);
    const chew = eat * (1.0 + 0.09 * Math.sin(t * 0.26));
    const hx = x + F(S(17)) - F(S(3) * sq) + F(S(6) * chew);
    const hy = y - S(36) * br + drop + S(22) * chew;
    cv.create_oval(x + F(S(4)), y - S(30) * br + drop, x + F(S(24)), y - S(17) + drop,
                   { fill: body, outline: "" });
    cv.create_oval(x + F(S(3)), y - S(23) * br + drop, x + F(S(19)), y - S(15) + drop,
                   { fill: cream, outline: "" });
    cv.create_oval(hx - S(15), hy - S(13), hx + S(15), hy + S(13), { fill: body, outline: edge });
    ears(hx, hy - S(4));
    cv.create_arc(hx - S(14), hy - S(12), hx + S(14), hy + S(5),
                  { start: 25, extent: 130, style: "arc", outline: mixHex(body, 0.22),
                    width: Math.max(1, Math.trunc(2 * sc)) });
    muzzle(hx, hy + S(2));
    return;
  }
  const br = 1 + 0.05 * Math.sin(t * 0.06);
  cv.create_oval(x - S(30), y - S(3), x + S(38), y + S(4), { fill: C.floor2, outline: "" });
  cv.create_oval(x - S(28), y - S(19) * br, x + S(22), y + S(3), { fill: body, outline: edge });
  cv.create_oval(x - S(16), y - S(12) * br, x + S(16), y + S(2), { fill: cream, outline: "" });
  cv.create_line(x - S(24), y - S(2), x - S(35), y - S(12), x - S(22), y - S(21),
                 x + S(4), y - S(16),
                 { fill: body, width: Math.max(2, Math.trunc(6 * sc)), smooth: true, capstyle: "round" });
  cv.create_oval(x, y - S(20), x + S(9), y - S(12), { fill: cream, outline: "" });
  const hx = x + S(25), hy = y - S(17) * br;
  cv.create_oval(hx - S(14), hy - S(12), hx + S(14), hy + S(12), { fill: body, outline: edge });
  ears(hx, hy - S(3));
  muzzle(hx, hy + S(2));
  for (let k = 0; k < 3; k++) {
    const ph = ((t * 0.012 + k * 0.34) % 1.0 + 1.0) % 1.0;
    cv.create_text(hx + S(13) + ph * S(14), hy - S(15) - ph * S(20),
                   { text: "z", fill: mixHex(edge, 0.35 + ph * 0.45),
                     font: font(Math.max(6, Math.trunc(10 * sc * (0.7 + ph * 0.6)))) });
  }
}

/* ---- 碗與貓砂盆 ---------------------------------------------------------- */
function petBowl(cv, x, y, sc, tone, food) {
  const S = v => v * sc;
  cv.create_oval(x - S(11), y - S(5), x + S(11), y + S(4),
                 { fill: tone, outline: mixHex(tone, -0.3) });
  if (food <= 0.02) {
    cv.create_oval(x - S(8), y - S(4), x + S(8), y + S(2),
                   { fill: mixHex(tone, -0.22), outline: "" });
    return;
  }
  const h = S(1) + S(6) * food, w = S(5) + S(3) * food;
  cv.create_oval(x - w, y - h, x + w, y + S(1), { fill: "#C98A4B", outline: "" });
}
function waterBowl(cv, x, y, sc, level) {
  const S = v => v * sc;
  const tone = "#7C8B94";
  cv.create_oval(x - S(12), y - S(5), x + S(12), y + S(4),
                 { fill: tone, outline: mixHex(tone, -0.3) });
  if (level <= 0.04) {
    cv.create_oval(x - S(9), y - S(4), x + S(9), y + S(2),
                   { fill: mixHex(tone, -0.22), outline: "" });
    return;
  }
  const w = S(4) + S(5.5) * level, top = y - S(3.4) * level;
  cv.create_oval(x - w, top - S(2.2), x + w, top + S(2.6), { fill: "#5C93B8", outline: "" });
  cv.create_arc(x - w, top - S(2.2), x + w, top + S(2.6),
                { start: 28, extent: 94, style: "arc", outline: "#A8D2E8",
                  width: Math.max(1, Math.trunc(S(1.4))) });
}
function litterBox(cv, x, y, dirty, lumps) {
  lumps = lumps || [];
  const tone = "#A8A89C", dark = "#7A7A70";
  cv.create_rectangle(x - 18, y - 8, x + 18, y + 4, { fill: dark, outline: "" });
  cv.create_rectangle(x - 16, y - 6, x + 16, y + 2, { fill: tone, outline: "" });
  const t = Math.max(0.0, Math.min(1.0, dirty));
  const ah = [0xD8, 0xCF, 0xA8], bh = [0x7A, 0x6A, 0x50];
  const sand = "#" + ah.map((a, i) =>
    Math.trunc(a + (bh[i] - a) * t).toString(16).toUpperCase().padStart(2, "0")).join("");
  cv.create_oval(x - 14, y - 8, x + 14, y, { fill: sand, outline: "" });
  if (dirty > 0.35)
    for (const [ox, oy] of [[-6, -5], [4, -3], [-2, -7]])
      cv.create_oval(x + ox - 3, y + oy - 2, x + ox + 3, y + oy + 2,
                     { fill: mixHex("#7A6A50", -0.20), outline: "" });
  for (const ox of lumps) {
    const lx = x + ox;
    cv.create_oval(lx - 5, y - 6, lx + 5, y - 1, { fill: "#3E2A16", outline: "" });
    cv.create_oval(lx - 4, y - 6, lx + 3, y - 3, { fill: "#7A5634", outline: "" });
    cv.create_oval(lx - 2, y - 7, lx + 1, y - 5, { fill: "#8A6540", outline: "" });
  }
  cv.create_rectangle(x - 16, y + 1, x + 16, y + 3, { fill: "#C8C8BC", outline: "" });
}

let SCENE = null, STATIC_CV = null, STATIC_OFF = null;
/* 換承運商：倉庫的靜態層是離屏快取的，要重畫一次才會換色。 */
function rebuildStatic() {
  if (!STATIC_CV || !STATIC_OFF) return;
  STATIC_CV.clear();
  drawStatic(STATIC_CV);
}
function drawScene() {
  const c = document.getElementById("dockscene");
  if (!c) return;
  if (!SCENE) {
    SCENE = new Cv(c, c.width, c.height);
    /* 靜態層畫一次存成離屏畫布，之後每一格用貼的。一千多個不動的圖元
       每秒重畫六十次，是這一格最貴的地方——桌面版同一個道理。 */
    const off = document.createElement("canvas");
    const lw = c.width, lh = c.height;
    off.width = lw; off.height = lh;
    STATIC_CV = new Cv(off, lw, lh);
    STATIC_CV.fit = function () {           /* 離屏的跟著主畫布的倍率走 */
      const k = SCENE ? SCENE.k : 1;
      const w = Math.max(1, Math.round(this.lw * k));
      const h = Math.max(1, Math.round(this.lh * k));
      if (this.c.width !== w || this.c.height !== h) { this.c.width = w; this.c.height = h; }
      this.k = k;
    };
    STATIC_OFF = off;
    drawStatic(STATIC_CV);
    c.addEventListener("click", sceneClickEvent);
    c.style.cursor = "pointer";
    startLoop();
  }
  renderFrame();
  return STATIC_CV.items;
}
function renderFrame() {
  if (!SCENE) return;
  SCENE.clear();
  /* 主畫布的倍率變了（換視窗寬度、拖到另一個螢幕），靜態層要跟著重畫，
     不然貼上去的是一張放大的舊圖。 */
  if (Math.abs((STATIC_CV.k || 1) - SCENE.k) > 1e-6) rebuildStatic();
  try { SCENE.g.drawImage(STATIC_CV.c, 0, 0, STATIC_CV.lw, STATIC_CV.lh); }
  catch (e) { drawStatic(SCENE); }
  drawDynamic(SCENE);
}
function startLoop() {
  if (DK.running) return;
  DK.running = true;
  DK.lastMs = (typeof performance !== "undefined" ? performance.now() : 0);
  const TICK_MS = 30.0, MAX_DT = 3.0;
  const step = (ms) => {
    /* 時間制：一格前進多少看實際經過的毫秒，掉格只會少畫不會變慢動作。 */
    DK.dt = Math.min(MAX_DT, Math.max(0.05, (ms - DK.lastMs) / TICK_MS));
    DK.lastMs = ms;
    DK.speed = 1.35 * DK.dt;
    const c = document.getElementById("dockscene");
    if (c && c.offsetParent !== null) renderFrame();  /* 沒在看的分頁不畫 */
    if (typeof bannerFrame !== "undefined") bannerFrame(DK.dt);
    if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(step);
  };
  if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(step);
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { Cv, drawStatic, drawDynamic, dockTick, DK, sceneClick, skyAt, rebuildStatic, DOCK, setSceneZone,
                   feedState, startFeed,
                   shiftPhase, sceneNow, usDst, person, workerFig,
                   beltBoxes, beltPos, mixHex, vp, box3d };
}

/* ===========================================================================
   分頁三、四的橫幅場景。

   底座（CarrierScene 的背景那一半，逐行照抄）：天空漸層混主題色、星星、
   日月照鐘點走弧線、山脊、天際線（夜裡窗戶亮燈）、lit()/night_amt() 的
   入夜曲線。分頁四 TariffScene 完整：費用一層一層疊、加油機把燃油打進
   去、UPS 車、疊完閃一下重來。分頁三先掛 GaugeScene 自己的林地背景
   （色盤、地平線照它的常數），量測台本體下一輪。
   =========================================================================== */

function themeColors() {
  return (typeof D !== "undefined" && D.THEMES[(typeof S !== "undefined" && S.carrier) || "ups"])
         || D.THEMES.ups;
}

/* 種子隨機：天際線和星星要固定，跳動的星星會變成整場唯一被看的東西。
   Python random.Random 的手感用一個小小的 LCG 重現——這裡只求「固定且
   分佈自然」，不求和桌面版同一串（桌面版自己也只求固定）。 */
function seededRng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

class Banner {
  constructor(canvas, W, H, HORIZON, GROUND) {
    this.cv = new Cv(canvas, W, H);
    this.W = W; this.H = H; this.HORIZON = HORIZON; this.GROUND = GROUND;
    this._skyCache = null; this._skyHour = -99;
  }
  sky() {
    const h = skyHour();
    if (this._skyCache === null || Math.abs(h - this._skyHour) > 0.004) {
      this._skyHour = h; this._skyCache = skyAt(h);
    }
    return this._skyCache;
  }
  blend(a, b, t) { return skyMix(a, b, t); }
  mixc(hex, pct, target) {
    target = target === undefined ? 255 : target;
    const h = hex.replace("#", "");
    const f = v => Math.max(0, Math.min(255, pyRound(v + (target - v) * pct)));
    return "#" + [0, 2, 4].map(i => f(parseInt(h.slice(i, i + 2), 16))
      .toString(16).toUpperCase().padStart(2, "0")).join("");
  }
  tint(key, pct) { return this.mixc(themeColors()[key], pct); }
  shade(key, pct) { return this.mixc(themeColors()[key], pct, 0); }
  nightAmt() {
    const L = this.sky().light;
    return Math.max(0.0, Math.min(1.0, (0.86 - L) / 0.86));
  }
  lit(colour) {
    const sky = this.sky(), L = sky.light;
    const out = this.blend("#101A2E", colour, 0.72 + 0.28 * L);
    return this.blend(out, sky.low, 0.20 * (1.0 - L));
  }
  litGround(colour, amt) {
    amt = amt === undefined ? 0.42 : amt;
    return this.blend(this.lit(colour), "#0C1424", amt * this.nightAmt());
  }
  skyEnds() {
    const sky = this.sky(), acc = themeColors().accent, L = sky.light;
    return [this.blend(sky.top, this.mixc(acc, 0.30), 0.30 * L),
            this.blend(sky.low, this.mixc(acc, 0.62), 0.34 * L)];
  }
  skyBand(y) {
    const [top, low] = this.skyEnds();
    const k = Math.pow(Math.max(0.0, Math.min(1.0, y / this.HORIZON)), 1.25);
    return this.blend(top, low, k);
  }
  drawSky() {
    const [top, low] = this.skyEnds();
    const n = 20;
    for (let i = 0; i < n; i++) {
      const k = Math.pow(i / (n - 1), 1.25);
      this.cv.create_rectangle(0, this.HORIZON * i / n - 1, this.W,
                               this.HORIZON * (i + 1) / n + 1.5,
                               { fill: this.blend(top, low, k), outline: "" });
    }
    const L = this.sky().light;
    if (L < 0.34) this.stars(1.0 - L / 0.34);
  }
  stars(k) {
    const rng = seededRng(4);
    const col = this.blend(this.sky().top, "#FFFFFF", 0.55 + 0.35 * k);
    for (let i = 0; i < 26; i++) {
      const x = rng() * this.W;
      const y = (0.06 + rng() * 0.66) * this.HORIZON;
      const r = [0.8, 0.8, 1.1, 1.4][Math.trunc(rng() * 4)];
      this.cv.create_oval(x - r, y - r, x + r, y + r, { fill: col, outline: "" });
    }
  }
  daystar(r) {
    const sky = this.sky(), h = sky.hour;
    const UP = D.SUN.up, DOWN = D.SUN.down;
    const day = UP <= h && h <= DOWN;
    let u;
    if (day) u = (h - UP) / (DOWN - UP);
    else { const night = ((h - DOWN) % 24.0 + 24.0) % 24.0; u = night / ((24.0 - DOWN) + UP); }
    const x = this.W * (0.10 + 0.80 * u);
    const y = this.HORIZON - 6 - (this.HORIZON * 0.62) * Math.sin(Math.PI * u);
    if (day) {
      const warm = 1.0 - Math.sin(Math.PI * u);
      const core = this.blend("#FFFFFF", sky.low, 0.22 + 0.55 * warm);
      for (const [k, t] of [[4.0, 0.14], [3.2, 0.26], [2.5, 0.42], [1.9, 0.60], [1.4, 0.80]])
        this.cv.create_oval(x - r * k, y - r * k, x + r * k, y + r * k,
                            { fill: this.blend(this.skyBand(y), core, t), outline: "" });
      this.cv.create_oval(x - r, y - r, x + r, y + r, { fill: core, outline: "" });
    } else {
      r *= 0.72;
      const band = this.skyBand(y);
      const glow = this.blend(band, "#C9D6E8", 0.40);
      for (const [k, t] of [[2.8, 0.34], [1.9, 0.62]])
        this.cv.create_oval(x - r * k, y - r * k, x + r * k, y + r * k,
                            { fill: this.blend(band, glow, t), outline: "" });
      this.cv.create_oval(x - r, y - r, x + r, y + r,
                          { fill: this.blend(band, "#E8EDF4", 0.86), outline: "" });
    }
  }
  ridge(base, amp, freq, phase, colour, foot) {
    const pts = [-30.0, foot];
    for (let x = -30.0; x <= this.W + 30; x += 16) {
      const y = base - amp * Math.sin(x * freq + phase)
                - amp * 0.34 * Math.sin(x * freq * 2.7 + phase * 1.9);
      pts.push(x, y);
    }
    pts.push(this.W + 30, foot);
    const n = this.nightAmt();
    const fill = this.blend(this.lit(colour), "#0C1626", 0.40 * n);
    this.cv.create_polygon(...pts, { fill, outline: "", smooth: true });
  }
  skyline(y, colour, seed) {
    const rng = seededRng(seed === undefined ? 7 : seed);
    const night = this.sky().light < 0.42;
    colour = this.lit(colour);
    let x = -20;
    while (x < this.W + 30) {
      const w = [38, 54, 70, 46][Math.trunc(rng() * 4)];
      const h = [22, 34, 46, 28, 58][Math.trunc(rng() * 5)];
      this.cv.create_rectangle(x, y - h, x + w, y + 4, { fill: colour, outline: "" });
      if (h > 40)
        this.cv.create_rectangle(x + w * 0.5 - 3, y - h - 14, x + w * 0.5 + 3, y - h,
                                 { fill: colour, outline: "" });
      if (night) {
        const nn = [0, 1, 2, 2, 3][Math.trunc(rng() * 5)];
        for (let i = 0; i < nn; i++) {
          const wx = x + 6 + rng() * Math.max(1, w - 16);
          const wy = y - 8 - rng() * Math.max(1, h - 12);
          this.cv.create_rectangle(wx, wy, wx + 4, wy + 5, { fill: "#E8C86A", outline: "" });
        }
      }
      x += w + [3, 7, 11][Math.trunc(rng() * 3)];
    }
  }
}

/* ---- 分頁四：TariffScene（完整） ----------------------------------------- */
const TARIFF = { laid: 0, drop: 0.0, hold: 0, fuel: 0.0, flash: 0 };
const T_COURSES = [[0.00, 34], [0.32, 16], [0.52, 12], [0.70, 12], [0.86, 10]];
const T_HOLD = 12;
class TariffBanner extends Banner {
  constructor(canvas) {
    super(canvas, 860, 210, 92, 168);
    this.GREEN_MID = "#8C9C58"; this.GREEN_NEAR = "#76884B";
  }
  tick(d) {
    const s = TARIFF;
    if (s.flash > 0) {
      s.flash -= d;
      if (s.flash <= 0) { s.laid = 0; s.fuel = 0.0; s.hold = 0; }
      return;
    }
    if (s.drop > 0) { s.drop = Math.max(0.0, s.drop - 0.09 * d); return; }
    s.hold += d;
    s.fuel = Math.min(1.0, s.laid / T_COURSES.length);
    if (s.hold >= T_HOLD) {
      s.hold = 0;
      if (s.laid < T_COURSES.length) { s.laid += 1; s.drop = 1.0; }
      else s.flash = 22;
    }
  }
  stack(x, base) {
    const acc = themeColors().accent;
    let y = base;
    const width = 128;
    for (let i = 0; i < T_COURSES.length; i++) {
      if (i >= TARIFF.laid) break;
      const [toneK, ht] = T_COURSES[i];
      const col = this.blend(acc, "#F2EFE7", toneK);
      let dy = 0.0;
      if (i === TARIFF.laid - 1 && TARIFF.drop > 0) dy = -110 * TARIFF.drop;
      const lit = TARIFF.flash > 0 && Math.trunc(TARIFF.flash / 4) % 2 === 0;
      bkBrick(this.cv, x, y - ht + dy, x + width, y + dy,
              lit ? this.mixc(col, 0.35) : col, 6, 1.0, true, this.shade("accent", 0.34));
      if (dy === 0.0) y -= ht;
    }
  }
  pump(x, y, level) {
    const acc = themeColors().accent;
    const body = this.tint("muted", 0.36);
    bkBrick(this.cv, x, y - 74, x + 34, y, body, 2, 1.0, true, this.shade("muted", 0.36));
    this.cv.create_rectangle(x + 6, y - 66, x + 28, y - 26,
                             { fill: "#F4F1E8", outline: this.shade("muted", 0.40) });
    const fillH = 38 * Math.max(0.0, Math.min(1.0, level));
    this.cv.create_rectangle(x + 8, y - 28 - fillH, x + 26, y - 28, { fill: acc, outline: "" });
    this.cv.create_line(x + 34, y - 58, x + 70, y - 40, x + 104, y - 56,
                        { fill: this.shade("muted", 0.30), width: 3, smooth: true });
  }
  van(x, y) {
    /* 三家各一台。桌面版 van() 就是照 theme_key 分派的——一台棕色的
       UPS 車掛著 FedEx 的紫色介面，是這一格最先被看出來的破綻。 */
    const key = (typeof S !== "undefined" && S.carrier) || "ups";
    if (key === "fedex") return this.vanFedex(x, y);
    if (key === "usps") return this.vanUsps(x, y);
    return this.vanUps(x, y);
  }
  wheels(x, y, positions, edge) { YardBanner.prototype.wheels.call(this, x, y, positions, edge); }
  driver(x, y, cap) { YardBanner.prototype.driver.call(this, x, y, cap); }
  vanFedex(x, y) {
    /* Sprinter：車頂比 package car 低、鼻子長，白車身配紫色側裙與橘色斜飛。 */
    const c = themeColors();
    const body = "#FFFFFF", edge = this.tint("muted", 0.40);
    const glass = this.tint("accent", 0.70);
    bkBrick(this.cv, x, y - 90, x + 132, y - 30, body, 5, 1.0, true, edge);
    this.cv.create_polygon(x + 132, y - 88, x + 168, y - 86, x + 196, y - 56,
                           x + 206, y - 44, x + 206, y - 30, x + 132, y - 30,
                           { fill: body, outline: edge, width: 2 });
    this.cv.create_polygon(x + 140, y - 80, x + 164, y - 79, x + 186, y - 56,
                           x + 140, y - 56, { fill: glass, outline: edge });
    this.driver(x + 156, y - 70, c.accent);
    for (const wx of [x + 22, x + 74])
      this.cv.create_rectangle(wx, y - 82, wx + 44, y - 60, { fill: glass, outline: edge });
    this.cv.create_rectangle(x + 2, y - 48, x + 205, y - 32, { fill: c.accent, outline: "" });
    this.cv.create_polygon(x + 96, y - 48, x + 205, y - 48, x + 205, y - 41,
                           x + 104, y - 41, { fill: this.shade("soft", 0.30), outline: "" });
    this.cv.create_rectangle(x + 132, y - 32, x + 207, y - 24,
                             { fill: this.shade("muted", 0.35), outline: "" });
    this.cv.create_oval(x + 198, y - 46, x + 207, y - 37,
                        { fill: this.tint("soft", 0.25), outline: "" });
    this.wheels(x, y, [42, 166], edge);
  }
  vanUsps(x, y) {
    /* Mail truck：高方的車身、短鼻、側面一排方窗，藍帶下面一條較細的紅帶。 */
    const c = themeColors();
    const body = "#FFFFFF", edge = this.tint("muted", 0.40);
    const glass = this.tint("accent", 0.72);
    bkBrick(this.cv, x, y - 100, x + 152, y - 30, body, 6, 1.0, true, edge);
    this.cv.create_polygon(x + 152, y - 94, x + 180, y - 92, x + 202, y - 66,
                           x + 206, y - 30, x + 152, y - 30,
                           { fill: body, outline: edge, width: 2 });
    this.cv.create_polygon(x + 158, y - 87, x + 177, y - 86, x + 193, y - 66,
                           x + 158, y - 66, { fill: glass, outline: edge });
    this.driver(x + 172, y - 78, c.accent);
    for (const wx of [x + 20, x + 68, x + 116])
      this.cv.create_rectangle(wx, y - 92, wx + 32, y - 70, { fill: glass, outline: edge });
    this.cv.create_rectangle(x + 2, y - 58, x + 204, y - 48, { fill: c.accent, outline: "" });
    this.cv.create_rectangle(x + 2, y - 47, x + 204, y - 40,
                             { fill: this.shade("soft", 0.38), outline: "" });
    this.cv.create_rectangle(x + 152, y - 30, x + 207, y - 22,
                             { fill: this.shade("muted", 0.35), outline: "" });
    this.cv.create_rectangle(x + 204, y - 84, x + 210, y - 72,
                             { fill: this.shade("muted", 0.25), outline: "" });
    this.cv.create_oval(x + 197, y - 54, x + 206, y - 45,
                        { fill: this.tint("soft", 0.30), outline: "" });
    this.wheels(x, y, [44, 174], edge);
  }
  vanUps(x, y) {
    const c = themeColors();
    const body = c.accent, edge = this.shade("accent", 0.34), pale = this.tint("accent", 0.72);
    bkBrick(this.cv, x, y - 98, x + 150, y - 30, body, 6, 1.0, true, edge);
    this.cv.create_polygon(x + 150, y - 92, x + 184, y - 92, x + 204, y - 62,
                           x + 204, y - 30, x + 150, y - 30,
                           { fill: body, outline: edge, width: 2 });
    this.cv.create_polygon(x + 157, y - 85, x + 180, y - 85, x + 195, y - 64,
                           x + 157, y - 64, { fill: pale, outline: edge });
    this.cv.create_rectangle(x + 98, y - 92, x + 144, y - 34,
                             { fill: this.shade("accent", 0.08), outline: edge });
    this.cv.create_rectangle(x + 106, y - 86, x + 136, y - 68, { fill: pale, outline: edge });
    for (let ry = Math.trunc(y - 92); ry < Math.trunc(y - 34); ry += 10)
      this.cv.create_line(x + 6, ry, x + 44, ry, { fill: this.shade("accent", 0.22) });
    this.cv.create_rectangle(x + 4, y - 58, x + 148, y - 50, { fill: c.soft, outline: "" });
    this.cv.create_rectangle(x + 186, y - 84, x + 194, y - 74,
                             { fill: this.shade("muted", 0.30), outline: "" });
    this.cv.create_oval(x + 197, y - 50, x + 206, y - 41,
                        { fill: this.tint("soft", 0.30), outline: "" });
    this.wheels(x, y, [44, 172], edge);
  }
  render() {
    const cv = this.cv;
    cv.clear();
    this.drawSky();
    this.daystar(14);
    this.skyline(this.HORIZON + 22, this.blend("#8A8779", this.sky().low, 0.34));
    this.ridge(this.HORIZON + 6, 14, 0.011, 2.2, this.GREEN_MID, this.GROUND);
    this.ridge(this.HORIZON + 24, 10, 0.016, 4.0, this.GREEN_NEAR, this.GROUND);
    cv.create_rectangle(0, this.GROUND, this.W, this.H,
                        { fill: this.litGround(this.tint("muted", 0.52)), outline: "" });
    cv.create_rectangle(0, this.GROUND, this.W, this.GROUND + 4,
                        { fill: this.litGround(this.tint("muted", 0.32)), outline: "" });
    bkBaseplate(cv, 0, this.GROUND + 4, this.W, this.H,
                this.litGround(this.tint("muted", 0.52)), 1.2, 3, false);
    const base = this.GROUND - 2;
    this.stack(this.W * 0.10, base);
    this.pump(this.W * 0.42, base, TARIFF.fuel);
    this.van(this.W * 0.56, base + 8);
  }
}

/* ---- 分頁三：GaugeScene 完整——量測台。包裹輪到誰就過一遍：龍門降下
   量高、圍尺合上量周長、上磅、燈號說落在哪一級，亮 150 格重來。三個
   尺寸輪替（同三條規則給三種答案）。遠景：FC 長條建築、磅秤室崗亭、
   鐵軌與定時經過的貨運火車、霧裡的林帶（入夜收掉）。 ------------------ */
const GAUGE = { stage: 0, hold: 0, px: -80.0, verdict: null, doneHold: 0.0,
                box: [46, 38], run: 0, trainX: 860 + 900.0, trainGap: 600.0 };
class GaugeBanner extends Banner {
  constructor(canvas) {
    super(canvas, 860, 210, 96, 196);
    this.GREEN_FAR = "#A2B9AC"; this.GREEN_MID = "#88A587";
    this.GREEN_NEAR = "#729474"; this.GREEN_DEEP = "#5B7C60";
    this.BENCH = 150; this.RAIL_Y = 124; this.TRAIN_LEN = 190;
    this.STOPS = [0.30, 0.52, 0.74]; this.HOLD_N = 34; this.SHOW = 150;
    this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.t = 0;
  }
  resetRun() {
    const g = GAUGE;
    g.stage = 0; g.hold = 0; g.px = -80.0; g.verdict = null; g.doneHold = 0.0;
    g.box = [[46, 38], [74, 62], [34, 30]][g.run % 3];
    g.run += 1;
  }
  targetX() {
    const g = GAUGE;
    if (g.stage >= this.STOPS.length) return this.W + 120;
    return this.W * this.STOPS[g.stage];
  }
  tick(d) {
    this.t += d;
    const g = GAUGE;
    g.trainX -= 1.5 * d;
    if (g.trainX < -this.TRAIN_LEN - 80) {
      g.trainGap -= d;
      if (g.trainGap <= 0) {
        g.trainX = this.W + 200.0;
        g.trainGap = 500.0 + (Math.trunc(this.t) * 37) % 400;
      }
    }
    if (g.stage >= this.STOPS.length && g.verdict) {
      g.doneHold += d;
      if (g.doneHold < this.SHOW) return;
    }
    const tx = this.targetX();
    if (g.px < tx - 1.5) { g.px = Math.min(tx, g.px + 3.4 * d); return; }
    if (g.stage >= this.STOPS.length) { this.resetRun(); return; }
    g.hold += d;
    if (g.hold >= this.HOLD_N) {
      g.hold = 0; g.stage += 1;
      if (g.stage === this.STOPS.length) {
        const [w, h] = g.box;
        g.verdict = (w >= 70 || h >= 58) ? "over" : (w >= 44 ? "watch" : "ok");
      }
    }
  }
  treeline(y, colour, step, h) {
    step = step === undefined ? 34 : step; h = h === undefined ? 22 : h;
    colour = this.blend(this.lit(colour), "#0C1626", 0.66 * this.nightAmt());
    let x = -30, i = 0;
    while (x < this.W + 40) {
      const k = ((i * 53) % 7) - 3;
      const r = (h + k * 2.2) * 0.5;
      const dy = (((i * 29) % 5) - 2) * 1.6;
      const far = i % 3 === 1 ? 0.72 : 1.0;
      this.cv.create_oval(x - r * far, y + dy - r * 1.7 * far,
                          x + r * 1.6 * far, y + dy + 6, { fill: colour, outline: "" });
      x += step; i += 1;
    }
  }
  gaugeFc(x, base) {
    const n = this.nightAmt();
    const push = col => this.blend(this.lit(col), "#0C1626", 0.42 * n);
    const w = 190, h = 30;
    const wall = push("#C9C2B6"), dark = push("#8F887C");
    const band = push(this.mixc(themeColors().accent, 0.20));
    this.cv.create_rectangle(x, base - h, x + w, base, { fill: wall, outline: dark });
    this.cv.create_rectangle(x, base - h, x + w, base - h + 4, { fill: band, outline: "" });
    for (let vx = x + 14; vx < x + w - 8; vx += 30)
      this.cv.create_rectangle(vx, base - h - 5, vx + 10, base - h,
                               { fill: dark, outline: "" });
    for (let dxo = x + 10; dxo < x + w - 12; dxo += 24) {
      this.cv.create_rectangle(dxo, base - 14, dxo + 14, base, { fill: dark, outline: "" });
      this.cv.create_line(dxo, base - 7, dxo + 14, base - 7, { fill: wall });
    }
  }
  weighOffice(x, base) {
    const n = this.nightAmt();
    const push = col => this.blend(this.lit(col), "#0C1424", 0.42 * n);
    const w = 44, h = 34;
    const wall = push("#CFC7B4"), roof = push("#7A6A55"), dark = push("#8A8274");
    this.cv.create_rectangle(x, base - h, x + w, base, { fill: wall, outline: dark });
    this.cv.create_polygon(x - 4, base - h, x + w + 4, base - h, x + w, base - h - 7,
                           x + 4, base - h - 7, { fill: roof, outline: "" });
    const wx = x + w - 16;
    const glass = n > 0.5 ? "#F2E2A8" : push("#9FB6C4");
    this.cv.create_rectangle(wx, base - h + 8, wx + 11, base - h + 19,
                             { fill: glass, outline: dark });
    this.cv.create_rectangle(x + 6, base - 22, x + 17, base, { fill: dark, outline: "" });
  }
  gaugeTrain() {
    const x = GAUGE.trainX;
    if (x > this.W + 120 || x < -this.TRAIN_LEN - 60) return;
    const n = this.nightAmt();
    const push = col => this.blend(this.lit(col), "#0C1626", 0.40 * n);
    const ry = this.RAIL_Y + 2;
    const loco = push("#4A5560"), body = push("#7A6A55");
    const body2 = push("#5E6E62"), dark = push("#3A3630");
    this.cv.create_rectangle(x, ry - 11, x + 26, ry, { fill: loco, outline: dark });
    this.cv.create_polygon(x - 5, ry, x, ry - 7, x, ry, { fill: loco, outline: "" });
    this.cv.create_rectangle(x + 4, ry - 15, x + 13, ry - 11, { fill: loco, outline: dark });
    this.cv.create_rectangle(x + 5, ry - 14, x + 9, ry - 12,
                             { fill: n > 0.5 ? "#F2E2A8" : push("#B8C8D4"), outline: "" });
    const cw = 34, gap = 5;
    for (let i = 0; i < 4; i++) {
      const cx0 = x + 29 + i * (cw + gap);
      this.cv.create_rectangle(cx0, ry - 10, cx0 + cw, ry,
                               { fill: i % 2 ? body : body2, outline: dark });
    }
    for (let wx = x + 4; wx < x + 29 + 4 * (cw + gap); wx += 14)
      this.cv.create_oval(wx, ry - 1, wx + 3, ry + 2, { fill: dark, outline: "" });
  }
  parcel(x, y, w, h) {
    const sc = Math.max(0.45, Math.min(1.0, w / 26.0));
    bkBrick(this.cv, x, y - h, x + w, y, this.CARTON, 2, sc, true, this.CARTON_EDGE,
            true, true);
    this.cv.create_rectangle(x + w * 0.36, y - h, x + w * 0.60, y,
                             { fill: themeColors().accent, outline: "" });
    this.cv.create_rectangle(x + w * 0.36, y - h * 0.66, x + w * 0.60, y - h * 0.58,
                             { fill: this.tint("accent", 0.45), outline: "" });
  }
  gantry(x, drop) {
    const steel = this.tint("muted", 0.30);
    const top = this.BENCH - 96;
    for (const sx of [x - 44, x + 38])
      this.cv.create_rectangle(sx, top, sx + 6, this.BENCH - 2,
                               { fill: steel, outline: this.shade("muted", 0.32) });
    bkBrick(this.cv, x - 50, top - 12, x + 50, top, this.tint("accent", 0.30),
            6, 1.0, true, this.shade("accent", 0.35));
    const headY = top + 16 + drop;
    bkBrick(this.cv, x - 26, headY, x + 26, headY + 14, themeColors().accent,
            3, 1.0, true, this.shade("accent", 0.40));
    this.cv.create_line(x, top + 12, x, headY, { fill: steel, width: 3 });
  }
  girthTape(x, y, w, k) {
    const span = w * 0.5 + 26 * (1.0 - k);
    for (const s of [-1, 1])
      this.cv.create_line(x + s * span, y - 46, x + s * span, y + 2,
                          { fill: this.shade("accent", 0.18), width: 3 });
    this.cv.create_line(x - span, y - 46, x + span, y - 46,
                        { fill: this.shade("accent", 0.18), width: 3 });
  }
  scaleFig(x, y, loaded) {
    bkBrick(this.cv, x - 52, y - 12, x + 52, y, this.tint("muted", 0.24),
            6, 1.0, true, this.shade("muted", 0.36));
    bkBrick(this.cv, x + 34, y - 62, x + 78, y - 14, this.tint("muted", 0.44),
            3, 1.0, true, this.shade("muted", 0.36));
    const cx = x + 56, cy = y - 40;
    this.cv.create_oval(cx - 15, cy - 15, cx + 15, cy + 15,
                        { fill: "#F4F1E8", outline: this.shade("muted", 0.40) });
    const sweep = (0.18 + 0.55 * loaded) * Math.PI
                  + Math.sin(this.t * 0.4) * 0.05 * loaded;
    this.cv.create_line(cx, cy, cx - Math.cos(sweep) * 11, cy - Math.sin(sweep) * 11,
                        { fill: themeColors().accent, width: 2 });
  }
  lampFig(x, y, verdict) {
    const tones = [["ok", "#5E9E58"], ["watch", "#E2A02B"], ["over", "#C4552F"]];
    this.cv.create_rectangle(x + 12, y, x + 20, this.BENCH - 2,
                             { fill: this.shade("muted", 0.28), outline: "" });
    bkBrick(this.cv, x - 2, y - 74, x + 34, y, this.tint("muted", 0.34),
            2, 1.0, true, this.shade("muted", 0.36));
    tones.forEach(([key, tone], i) => {
      const lit = verdict === key;
      const y0 = y - 68 + i * 21;
      if (lit)
        for (const [r, al] of [[14, 0.12], [8, 0.25]])
          this.cv.create_oval(x + 16 - r - 6, y0 + 8 - r, x + 16 + r + 6, y0 + 8 + r,
                              { fill: "rgba(" + [1, 3, 5].map(j =>
                                parseInt(tone.slice(j, j + 2), 16)).join(",")
                                + "," + al + ")", outline: "" });
      bkBrick(this.cv, x + 4, y0, x + 28, y0 + 17,
              lit ? this.mixc(tone, 0.22) : this.mixc(tone, 0.62, 0),
              1, 1.0, false, this.mixc(tone, 0.30, 0));
      if (lit)
        this.cv.create_rectangle(x + 7, y0 + 2, x + 25, y0 + 6,
                                 { fill: this.mixc(tone, 0.55), outline: "" });

  render() {

    this.gaugeFc(this.W * 0.06, this.HORIZON + 20);
    this.ridge(this.HORIZON + 22, 11, 0.015, 3.2, this.GREEN_NEAR, this.BENCH);

    cv.create_rectangle(0, ry + 4, this.W, ry + 6,
                        { fill: this.litGround("#6B615A"), outline: "" });
    cv.create_rectangle(0, ry + 2, this.W, ry + 3,
                        { fill: this.litGround("#8A8078"), outline: "" });
    for (let sx = 0; sx < this.W; sx += 16)
      cv.create_line(sx, ry + 3, sx + 6, ry + 6, { fill: this.litGround("#55493E") });
    this.gaugeTrain();
    this.weighOffice(this.W * 0.115, this.BENCH - 2);
    cv.create_rectangle(0, this.BENCH, this.W, this.H,
                        { fill: this.litGround(this.tint("muted", 0.50)), outline: "" });
    bkBrick(cv, 0, this.BENCH - 10, this.W, this.BENCH + 6,
            this.litGround(this.tint("muted", 0.30)), undefined, 1.0, true,
            this.litGround(this.shade("muted", 0.34)));
    bkBaseplate(cv, 0, this.BENCH + 6, this.W, this.H,
                this.litGround(this.tint("muted", 0.50)), 1.15, 3, false);
    for (let lx = 60; lx < this.W; lx += 150)
      cv.create_rectangle(lx, this.BENCH + 6, lx + 10, this.H - 6,
                          { fill: this.litGround(this.shade("muted", 0.24)), outline: "" });
    const [w, h] = g.box;
    const y = this.BENCH - 8;
    const at = i => g.stage === i && g.px >= this.targetX() - 2;
    const k = Math.min(1.0, g.hold / this.HOLD_N);
    const gx = this.W * this.STOPS[0];
    /* 順序就是遠近。包裹從門架底下經過，所以先畫包裹、再畫門架——立柱要壓在
       包裹前面；壓頭跟著門架一起畫，落下來才是壓在包裹上，而不是被包裹蓋住。
       磅秤仍排在包裹之前，因為包裹是放在秤台上面的。 */
    this.scaleFig(this.W * this.STOPS[2], y,
                  at(2) ? k : (g.stage > 2 ? 1.0 : 0.0));
    const lift = (g.stage >= 2 && g.px >= this.W * this.STOPS[2] - 2) ? 12 : 0;
    this.parcel(g.px - w * 0.5, y - lift, w, h);
    /* 壓頭要停在包裹頂面，不是穿過去。原本寫死的 46 是在壓頭被包裹蓋住的
       年代訂的——看不見，就沒人發現它壓過頭。改成從幾何算：門架頂 + 壓頭
       自身高度，落到包裹上緣剛好為止。 */
    const HEAD_H = 14, gTop = this.BENCH - 96;
    const press = Math.max(0, (y - h) - (gTop + 16 + HEAD_H));
    this.gantry(gx, press * (at(0) ? k : 0.0) + (g.stage > 0 ? press : 0));
    if (at(1)) this.girthTape(g.px, y - lift, w, k);
    this.lampFig(this.W - 62, this.BENCH - 8, g.verdict);
  }
}

/* ---- 分頁二：CarrierScene 堆場。背景整段照抄（天空、四層山脊、樹籬、
   會被風吹斜的樹、電線杆與垂彎的電線、水泥堆場、車位導引線、走道）加上
   每格漂移的雲。卡車倒車入月台、堆高機、保全與小偷那套狀態機下一輪。 */
class YardBanner extends Banner {
  constructor(canvas) {
    super(canvas, 860, 316, 128, 304);
    this.YARD = 246; this.ROAD = 252; this.DOCK_X = 322;
    this.GREEN_FAR = "#8FAE9B"; this.GREEN_MID = "#7FA86B";
    this.GREEN_NEAR = "#6B9459"; this.GREEN_DEEP = "#557A46";
    this.LEAF = "#5E8A56"; this.LEAF2 = "#7BA96C"; this.TRUNK = "#6B5138";
    this.LOBES = [[-26, 12, 21], [0, 5, 30], [27, -3, 37], [60, 8, 27], [87, 14, 19]];
    this.BED_Y = 258; this.DOCK_GAP = 10; this.PALLETS = 3; this.FORK_SPEED = 5.2;
    this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.HIVIS = "#E7C931"; this.HARDHAT = "#E2842B";
    this.t = 0; this.loadPhase = "arriving"; this.truckX = this.W + 380;
    this.plate = 0.0; this.forkX = 0; this.forkCarry = true; this.forkLift = 0.0;
    this.loaded = 0; this.hold = 0; this.handX = 20.0; this.handDir = 1;
    this.dayGuardX = 400.0; this.dayGuardDir = 1;
    /* 夜班：巡邏、發現、追、四種收場。桌面版第四種是「狗咬住」——
       堆場野狗還沒搬進來，這一輪先輪替另外三種（escape/catch/bolt），
       狗那一種跟野貓野狗一起補。 */
    this.watch = "patrol"; this.watchT = 0.0; this.watchN = 0;
    this.guardX = this.DOCK_X + 100.0; this.guardDir = 1;
    this.thiefX = this.W + 40.0; this.seenT = 0.0; this.alarm = 0.0;
    this.outcome = "escape"; this.willCatch = false; this.policeX = this.W + 30.0;
    this.PROWL_EVERY = 900.0; this.PRY_MINS = 120.0; this.SEE_NEAR = 230.0;
    this.SEE_TIME = 55.0; this.BOLT_PRY = 190.0; this.PRY_CAP = 900.0;
    this.WATCH_Y = 286;
    /* 堆場的野狗野貓。狗一路走過去、停下來聞、抬個腿；兩隻貓睡在貨櫃
       前，狗或人靠近就炸毛往後跳開。場上有小偷的時候狗會察覺、轉頭、
       叫——不是只有輪到牠咬的那一次才有反應。 */
    this.YARD_DOG_Y = 298; this.YARD_CAT_Y = 280;
    this.DOG_COATS = ["#8E7551", "#4B4038", "#B99A6B", "#6A5238"];
    this.CAT_COATS = ["#6E6357", "#C0793E", "#2E2A28", "#D8D0C0"];
    this.CAT_NEAR = 92.0; this.CAT_SIDE = 20.0; this.CAT_BACK = 30.0;
    this.planeX = -300.0;
    this.ydX = -40.0; this.ydPhase = "in"; this.ydT = 0.0; this.ydN = 0;
    this.ydPud = 0.0; this.ydFace = 1; this.ydGait = 0.0; this.ydAlert = false;
    this.catN = 0; this.catT = 0.0;
    this.catPuff = [0.0, 0.0]; this.catBack = [0.0, 0.0];
    this.catFlee = [1.0, -1.0]; this.catDodge = [0.0, 0.0];
  }
  groundTone() { return this.tint("muted", 0.54); }
  catSpot(i) {
    if (i % 2) return [this.stackLeft() - 96.0, this.YARD_CAT_Y];
    return [this.DOCK_X + 206.0, this.YARD_CAT_Y + 6];
  }
  faceFromMove(was) {
    const dx = this.ydX - was;
    if (Math.abs(dx) > 0.05) this.ydFace = dx > 0 ? 1 : -1;
  }
  stepStrays(d) {
    this.ydT += d;
    const was = this.ydX;
    this.ydAlert = ["creeping", "prying", "loot", "fleeing", "spotted",
                    "chase", "bitten", "held"].indexOf(this.watch) >= 0
                   && this.ydPhase !== "away" && this.ydPhase !== "attack";
    const post = this.DOCK_X + 366.0;
    if (this.ydAlert && (this.ydPhase === "in" || this.ydPhase === "off")
        && this.ydX > this.DOCK_X + 60.0) {
      /* 警戒的狗站定了叫，不繼續散步。 */
    } else if (this.ydPhase === "in") {
      this.ydX += 1.3 * d;
      if (this.ydX >= post - 18) { this.ydX = post - 18; this.ydPhase = "sniff"; this.ydT = 0.0; }
    } else if (this.ydPhase === "sniff") {
      if (this.ydT > 80) { this.ydPhase = "lift"; this.ydT = 0.0; }
    } else if (this.ydPhase === "lift") {
      if (26 < this.ydT && this.ydT < 100) this.ydPud = Math.min(1.0, this.ydPud + 0.016 * d);
      if (this.ydT > 126) { this.ydPhase = "off"; this.ydT = 0.0; }
    } else if (this.ydPhase === "off") {
      this.ydX += 1.8 * d;
      this.ydPud = Math.max(0.0, this.ydPud - 0.0016 * d);
      if (this.ydX > this.W + 40) { this.ydPhase = "away"; this.ydT = 0.0; }
    } else if (this.ydPhase === "attack") {
      const tgt = this.thiefX + 26;
      this.ydX += Math.max(-3.4 * d, Math.min(3.4 * d, tgt - this.ydX));
      if (Math.abs(this.ydX - tgt) < 1.0) this.ydX = tgt;
      if (["patrol", "off", "away"].indexOf(this.watch) >= 0) {
        this.ydPhase = "off"; this.ydT = 0.0;
      }
      this.ydGait += Math.abs(this.ydX - was) * 0.35;
      this.faceFromMove(was);
      this.stepCats(d);
      return;
    } else if (this.ydPhase === "away") {
      this.ydPud = Math.max(0.0, this.ydPud - 0.0016 * d);
      if (this.ydT > 700) {
        this.ydX = -40.0; this.ydN += 1;
        this.ydPhase = "in"; this.ydT = 0.0;
      }
    }
    /* 狗和小偷不站在同一格：留一個身位，不從他身上穿過去。 */
    if (this.ydPhase !== "attack"
        && ["creeping", "prying", "loot", "fleeing", "spotted", "chase",
            "caught", "escorting", "bitten", "held", "calling",
            "police_in", "cuffed", "taken"].indexOf(this.watch) >= 0) {
      const keep = 46.0, gap = this.ydX - this.thiefX;
      if (Math.abs(gap) < keep) this.ydX = this.thiefX + (gap >= 0 ? keep : -keep);
    }
    this.ydGait += Math.abs(this.ydX - was) * 0.35;
    this.faceFromMove(was);
    this.catT += d;
    if (this.catT > 2200) { this.catT = 0.0; this.catN += 1; }
    this.stepCats(d);
  }
  stepCats(d) {
    const dogHere = this.ydPhase !== "away";
    const spooked = this.alarm > 0.15;
    const dayG = !this.darkNow();
    for (let i = 0; i < 2; i++) {
      const base = this.catSpot(this.catN + i)[0];
      let gap = this.ydX - base;
      const close = dogHere && Math.abs(gap) < this.CAT_NEAR;
      const gGap = (dayG ? this.dayGuardX : this.guardX) - base;
      const gClose = Math.abs(gGap) < this.CAT_NEAR * 0.8;
      if (gClose && !close) gap = gGap;
      if (close || gClose || spooked) {
        if (this.catPuff[i] < 0.02) this.catFlee[i] = gap > 0 ? -1.0 : 1.0;
        this.catPuff[i] = Math.min(1.0, this.catPuff[i]
                                   + (close || gClose ? 0.09 : 0.05) * d);
        this.catBack[i] = Math.min(1.0, this.catBack[i] + 0.10 * d);
      } else {
        this.catPuff[i] = Math.max(0.0, this.catPuff[i] - 0.010 * d);
        this.catBack[i] = Math.max(0.0, this.catBack[i] - 0.008 * d);
      }
      this.catDodge[i] = this.catFlee[i] * this.CAT_SIDE * this.catBack[i];
    }
  }
  strayStream(x, y, k) {
    for (let i = 0; i < 4; i++) {
      const u = ((k * 3.0 + i * 0.25) % 1.0 + 1.0) % 1.0;
      const sx = x - 6 - 13 * u, sy = y - 9 + 11 * u * u;
      this.cv.create_line(sx, sy, sx - 3, sy + 2.5,
                          { fill: "#D9C86A", width: 2, capstyle: "round" });
    }
  }
  strayDog(x, y, o = {}) {
    const { lift = 0.0, walking = true, head_down = 0.0, face = 1,
            bark = false, coat = "#8E7551", sc = 1.0, gait = null } = o;
    const dark = this.mixc(coat, 0.34, 0);
    const f = face >= 0 ? 1 : -1;
    const S = v => v * sc, P = v => x + f * v * sc;
    const k = Math.max(0.0, Math.min(1.0, lift));
    let hd = head_down, sw;
    if (bark) {
      hd = -0.55 - 0.25 * Math.abs(Math.sin(this.t * 0.55));
      sw = (walking && gait !== null) ? Math.sin(gait) * S(4.0)
         : (walking ? Math.sin(this.t * 0.30) * S(4.0) : 0.0);
    } else if (gait !== null) {
      sw = walking ? Math.sin(gait) * S(4.0) : 0.0;
    } else {
      sw = walking ? Math.sin(this.t * 0.30) * S(4.0) : 0.0;
    }
    const sag = S(2.0) * k;
    this.cv.create_oval(x - S(15), y - S(3), x + S(15), y + S(2),
                        { fill: this.mixc(this.groundTone(), 0.26, 0), outline: "" });
    const lw = Math.max(2, Math.round(S(3)));
    const far = this.mixc(coat, 0.18, 0);
    this.cv.create_line(P(6), y - S(11), P(6) - sw, y,
                        { fill: far, width: lw, capstyle: "round" });
    if (k > 0.0)
      this.cv.create_line(P(-11), y - S(11) + sag, P(-11 - 3 - 12 * k),
                          y - S(1) - S(10) * k, { fill: far, width: lw, capstyle: "round" });
    else
      this.cv.create_line(P(-11), y - S(11), P(-11) + sw, y,
                          { fill: far, width: lw, capstyle: "round" });
    this.cv.create_polygon(P(-15), y - S(16) + sag, P(-8), y - S(19) + sag * 0.5,
                           P(4), y - S(20), P(12), y - S(17), P(13), y - S(9),
                           P(-15), y - S(8) + sag,
                           { fill: coat, outline: dark, smooth: true });
    this.cv.create_line(P(-15), y - S(15) + sag, P(-21), y - S(19) - S(7) * k,
                        { fill: coat, width: lw, capstyle: "round" });
    const hy = y - S(26) + S(9) * Math.max(-1.0, Math.min(1.0, hd));
    this.cv.create_line(P(7), y - S(18), P(15), hy + S(3),
                        { fill: coat, width: Math.max(3, Math.round(S(8))), capstyle: "round" });
    this.cv.create_line(P(9), y - S(11), P(9) + sw, y,
                        { fill: dark, width: lw, capstyle: "round" });
    this.cv.create_line(P(-8), y - S(11) + sag * 0.5, P(-8) - sw, y,
                        { fill: dark, width: lw, capstyle: "round" });
    this.cv.create_polygon(P(14), hy - S(4), P(11), hy - S(12), P(19), hy - S(6),
                           { fill: dark, outline: "" });
    this.cv.create_oval(P(18) - S(7), hy - S(6), P(18) + S(7), hy + S(6),
                        { fill: coat, outline: dark });
    this.cv.create_oval(P(22), hy - S(1), P(29), hy + S(5), { fill: coat, outline: dark });
    this.cv.create_oval(P(27), hy, P(30), hy + S(3), { fill: dark, outline: "" });
    this.cv.create_oval(P(20), hy - S(3), P(23), hy, { fill: "#20180F", outline: "" });
  }
  strayCatPuffed(x, y, coat, dark, sc, k, face) {
    const S = v => v * sc, F = v => v * face;
    const sh = Math.sin(this.t * 0.9) * S(0.6) * k;
    const arch = S(9.0) * k;
    this.cv.create_oval(x - S(15), y - S(3), x + S(15), y + S(2),
                        { fill: this.mixc(this.groundTone(), 0.24, 0), outline: "" });
    const lw = Math.max(2, Math.round(S(3)));
    for (const ox of [-9, -4, 5, 9])
      this.cv.create_line(x + F(S(ox)) + sh, y - S(12) - arch * 0.35, x + F(S(ox)), y - S(1),
                          { fill: ox < 0 ? dark : coat, width: lw, capstyle: "round" });
    for (let i = 0; i < 9; i++) {
      const u = i / 8.0;
      const bx = x + F(S(-13 + 26 * u)) + sh;
      const by = y - S(13) - arch * Math.sin(Math.PI * u);
      const ang = Math.PI * (0.30 + 0.42 * u);
      const ln = S(4.0 + 3.0 * Math.sin(Math.PI * u)) * k;
      this.cv.create_line(bx, by, bx - F(Math.cos(ang) * ln), by - Math.sin(ang) * ln,
                          { fill: coat, width: Math.max(1, Math.round(S(1.6))),
                            capstyle: "round" });
    }
    this.cv.create_polygon(
      x + F(S(-14)) + sh, y - S(6), x + F(S(-10)) + sh, y - S(12) - arch * 0.55,
      x + F(S(-2)) + sh, y - S(14) - arch, x + F(S(7)) + sh, y - S(12) - arch * 0.70,
      x + F(S(13)) + sh, y - S(7), x + F(S(11)), y - S(2), x + F(S(-12)), y - S(2),
      { fill: coat, outline: dark, smooth: true });
    /* 尾巴：直立的瓶刷。 */
    const tx = x + F(S(-14)) + sh, ty = y - S(8) - arch * 0.4;
    this.cv.create_line(tx, ty, tx - F(S(4)), ty - S(14) - S(6) * k,
                        { fill: coat, width: Math.max(3, Math.round(S(4 + 3 * k))),
                          capstyle: "round" });
    /* 頭：朝著來的方向，耳朵壓平。 */
    const hx = x + F(S(12)) + sh, hy = y - S(12) - arch * 0.6;
    this.cv.create_oval(hx - S(6), hy - S(6), hx + S(6), hy + S(5),
                        { fill: coat, outline: dark });
    for (const ex of [-4, 1])
      this.cv.create_polygon(hx + F(S(ex)), hy - S(3), hx + F(S(ex + 3)), hy - S(7),
                             hx + F(S(ex + 5)), hy - S(2), { fill: coat, outline: dark });
    this.cv.create_oval(hx + F(S(1)) - S(1.4), hy - S(2) - S(1.4),
                        hx + F(S(1)) + S(1.4), hy - S(2) + S(1.4),
                        { fill: "#20282E", outline: "" });
  }
  strayCat(x, y, o = {}) {
    const { coat = "#6E6357", sc = 1.0, puff = 0.0, face = 1 } = o;
    const dark = this.mixc(coat, 0.36, 0);
    const S = v => v * sc;
    const k = Math.max(0.0, Math.min(1.0, puff));
    if (k > 0.5) { this.strayCatPuffed(x, y, coat, dark, sc, (k - 0.5) * 2.0, face); return; }
    const br = Math.sin(this.t * 0.045) * S(0.7) + S(2.4) * k * 2.0;
    this.cv.create_oval(x - S(15), y - S(3), x + S(15), y + S(2),
                        { fill: this.mixc(this.groundTone(), 0.24, 0), outline: "" });
    this.cv.create_oval(x - S(14), y - S(11) - br, x + S(12), y, { fill: coat, outline: dark });
    this.cv.create_line(x + S(11), y - S(3), x - S(2), y + S(1), x - S(12), y - S(4),
                        { fill: coat, width: Math.max(2, Math.round(S(4))),
                          capstyle: "round", smooth: true });
    const hx = x - S(12), hy = y - S(10);
    this.cv.create_oval(hx - S(6), hy - S(6), hx + S(6), hy + S(5),
                        { fill: coat, outline: dark });
    for (const ex of [-4, 2])
      this.cv.create_polygon(hx + S(ex), hy - S(4), hx + S(ex + 2), hy - S(10),
                             hx + S(ex + 5), hy - S(4), { fill: coat, outline: dark });
    this.cv.create_line(hx - S(3), hy - S(1), hx + S(1), hy - S(1), { fill: dark });
    const u = ((this.t * 0.012) % 1.0 + 1.0) % 1.0;
    for (let i = 0; i < 3; i++) {
      const kk = (u + i * 0.33) % 1.0;
      if (kk > 0.75) continue;
      this.cv.create_text(hx - S(6) - kk * S(14), hy - S(12) - kk * S(18),
                          { text: "z", fill: this.blend(dark, "#FFFFFF", 0.45),
                            font: font(Math.max(5, Math.trunc(S(6 + kk * 3)))) });
    }
  }
  drawYardCats() {
    if (this.ydPud > 0.02) {
      const pw = 4 + 9 * this.ydPud, px = this.DOCK_X + 366.0;
      this.cv.create_oval(px - pw, this.YARD_DOG_Y - 5, px + pw, this.YARD_DOG_Y + 1,
                          { fill: "rgba(140,138,94,0.25)", outline: "" });
    }
    for (let i = 0; i < 2; i++) {
      const [cx, cy] = this.catSpot(this.catN + i);
      const back = this.catBack[i];
      const face = this.ydX > cx ? 1 : -1;
      const catx = cx + this.catDodge[i];
      const coat = this.CAT_COATS[(this.catN + i * 2) % this.CAT_COATS.length];
      const caty = cy - this.CAT_BACK * back;
      const csc = 1.0 - 0.12 * back;
      this.strayCat(catx, caty, { sc: csc, coat, puff: this.catPuff[i], face });
    }
  }
  drawYardDog() {
    if (this.ydPhase === "away") return;
    const coat = this.DOG_COATS[this.ydN % this.DOG_COATS.length];
    const attack = this.ydPhase === "attack";
    const alert = this.ydAlert;
    let face;
    if (alert && !attack) face = this.thiefX > this.ydX ? 1 : -1;
    else if (this.ydPhase === "sniff" || this.ydPhase === "lift") face = 1;
    else face = this.ydFace;
    this.strayDog(this.ydX, this.YARD_DOG_Y, {
      lift: this.ydPhase === "lift" ? 1.0 : 0.0,
      walking: this.ydPhase === "in" || this.ydPhase === "off" || attack,
      head_down: this.ydPhase === "sniff" ? 1.0 : 0.0,
      face,
      bark: (attack && this.watch !== "bitten") || alert,
      coat, gait: this.ydGait });
    if (this.ydPhase === "lift" && 22 < this.ydT && this.ydT < 104)
      this.strayStream(this.ydX - 9, this.YARD_DOG_Y, this.t * 0.06);
  }
  stackLeft() { return Math.max(690, this.W - 470); }
  torchReach() { return 120.0 + 70.0 * Math.sin(this.t * 0.021); }
  pryBudget() { return this.outcome === "bolt" ? this.BOLT_PRY : this.PRY_CAP; }
  spotsThief(d) {
    const beam = this.guardX + this.torchReach() * this.guardDir;
    const saw = this.guardDir > 0 && Math.abs(beam - this.thiefX) < 60;
    const facing = this.guardDir > 0
      && Math.abs(this.thiefX - this.guardX) < this.SEE_NEAR;
    if (facing) this.seenT += d;
    else this.seenT = Math.max(0.0, this.seenT - 0.35 * d);
    return saw || this.seenT > this.SEE_TIME;
  }
  stepWatch(d) {
    if (!this.darkNow()) {
      this.watch = "patrol"; this.watchT = 0.0; this.alarm = 0.0;
      return;
    }
    this.watchT += d;
    const lo = this.DOCK_X + 70.0;
    const hi = Math.max(this.DOCK_X + 140.0, this.stackLeft() - 50.0);
    const box = this.stackLeft() + 100.0;
    if (["patrol", "creeping", "prying", "loot", "fleeing"].indexOf(this.watch) >= 0) {
      if (!(lo <= this.guardX && this.guardX <= hi))
        this.guardX = Math.min(hi, Math.max(lo, this.guardX));
      this.guardX += 0.9 * d * this.guardDir;
      if (this.guardX >= hi) { this.guardX = hi; this.guardDir = -1; }

    } else if (this.watch === "fleeing") {

    } else if (this.watch === "spotted") {

      this.guardX += 2.8 * d;
      if (this.willCatch && this.guardX >= this.thiefX - 26) {
        this.guardX = this.thiefX - 26; this.watch = "caught"; this.watchT = 0.0;

  drawWatch() {
    /* 夜班兩個人。人形共用 scene.js 的 person 骨架（桌面版是 minifig
       ——兜帽等配件的差異註明於此，骨架行為一致）。 */
    if (!this.darkNow()) return;
    const cv = this.cv, y = this.WATCH_Y;
    const onstage = ["creeping", "prying", "loot", "fleeing", "spotted", "chase",
                     "caught", "escorting", "bitten", "held", "calling",
                     "police_in", "cuffed", "taken"];
    let face;
    if (["escorting", "returning", "taken"].indexOf(this.watch) >= 0) face = -1;
    else if (["spotted", "chase", "caught", "bitten", "held", "calling",
              "police_in", "cuffed"].indexOf(this.watch) >= 0) face = 1;
    else face = this.guardDir;
    this.torch(this.guardX, y, face);
    const gsw = Math.sin(this.t * (this.watch === "chase" ? 0.34 : 0.13))
                * (this.watch === "chase" ? 7 : 3);
    this.minifig(this.guardX, y, "#2A3350",
                 { face, cap: "#2A3350", band: "#D7E356", arms: "reach",
                   hands: [this.guardX + (face || 1) * 15, y - 34], swing: gsw });
    if (onstage.indexOf(this.watch) >= 0) {
      let tface;
      if (this.watch === "chase") tface = this.willCatch ? -1 : 1;
      else tface = ["creeping", "prying", "escorting", "taken"]
                   .indexOf(this.watch) >= 0 ? -1 : 1;
      let crouch = 0.0;
      if (this.watch === "prying") crouch = 1.0;
      else if (this.watch === "bitten") crouch = 0.55;
      else if (this.watch === "loot") crouch = Math.max(0.0, 1.0 - this.watchT / 22.0);
      const held = ["caught", "escorting", "held", "calling", "police_in",
                    "cuffed", "taken"].indexOf(this.watch) >= 0;
      const boxed = this.watch === "loot" || this.watch === "fleeing";
      const tsw = Math.sin(this.t * (["chase", "fleeing"].indexOf(this.watch) >= 0
                  ? 0.36 : 0.16))
                  * (["chase", "fleeing"].indexOf(this.watch) >= 0 ? 7 : 2);
      if (boxed && !held) {
        /* 箱子抱在胸腹之間，兩手都上去——「抱」不是「提」。 */
        const dip = 11.0 * Math.max(0.0, Math.min(1.0, crouch));
        const yy = y + dip;
        const cx = this.thiefX + tface * 7;
        this.minifig(this.thiefX, y, "#232838",
                     { face: tface, hood: true, crouch, hair: "#2A2A2A",

                       swing: tsw, mood: "smile" });

        this.minifig(this.thiefX, y, "#232838",

                       skin: "#B9835A", arms: held ? "up" : "reach",
                       hands: [this.thiefX + tface * 17, y - 26 - 11 * crouch],
                       swing: tsw, mood: held ? "glum" : "smile" });
      }
      if (this.watch === "bitten")
        this.sayMark(this.thiefX, y - 74, yelpText());
      if (this.watch === "calling") this.sayMark(this.guardX - 6, y - 78, radioText());
      if (["police_in", "cuffed", "taken"].indexOf(this.watch) >= 0) {
        const pw = ["police_in", "taken"].indexOf(this.watch) >= 0;
        const psw = Math.sin(this.t * (pw ? 0.30 : 0.10)) * (pw ? 6 : 2);
        this.minifig(this.policeX, y, "#1E2A4A",
                     { face: -1, cap: "#1E2A4A", band: "#131A2E",
                       arms: pw ? "swing" : "down", swing: psw,
                       sc: 1.22, build: 1.16, mood: "stern" });
        cv.create_oval(this.policeX - 10, y - 40, this.policeX - 5, y - 35,
                       { fill: "#D8C25A", outline: "" });
      }
    }
    if (this.alarm > 0.05) this.alarmMark(this.guardX + 22, y - 68, this.alarm);

  tick(d) {
    /* CarrierScene.step() 的裝車那一半，逐行。夜班保全與小偷下一輪。 */
    this.t += d;
    this.openNow = this.dockOpen();
    this.planeX += 2.1 * d;
    if (this.planeX > this.W + 160) this.planeX = -300.0;
    this.stepWatch(d);
    this.stepStrays(d);
    if (!this.darkNow()) {
      const loDg = this.DOCK_X + 60.0, hiDg = this.DOCK_X + 200.0;
      this.dayGuardX += 0.85 * d * this.dayGuardDir;
      if (this.dayGuardX >= hiDg) { this.dayGuardX = hiDg; this.dayGuardDir = -1; }
      else if (this.dayGuardX <= loDg) { this.dayGuardX = loDg; this.dayGuardDir = 1; }
    }
    if (this.openNow) {
      this.handX += 1.1 * d * this.handDir;
      if (this.handX > 62) this.handDir = -1;
      else if (this.handX < 4) this.handDir = 1;
    }
    if (!this.forkX) this.forkX = this.forkHome();
    if (this.truckX > this.W + 400) this.truckX = this.W + 380;
    if (this.loadPhase === "arriving" && !this.openNow) {
      this.truckX = this.W + 380; this.forkCarry = false; this.forkLift = 0.0;
    } else if (this.loadPhase === "arriving") {
      this.truckX -= 5.2 * d;
      if (this.truckX <= this.DOCK_X + this.DOCK_GAP) {
        this.truckX = this.DOCK_X + this.DOCK_GAP;
        this.loadPhase = "plate_down"; this.hold = this.t + 14;
      }
    } else if (this.loadPhase === "plate_down") {
      if (this.t >= this.hold) {
        this.plate = Math.min(1.0, this.plate + 0.06 * d);
        if (this.plate >= 1.0) this.loadPhase = "loading";
      }
    } else if (this.loadPhase === "loading") {
      const target = this.forkCarry ? this.forkSlot() : this.forkHome();
      if (this.hold > this.t) {
        this.forkLift += ((this.forkCarry ? 14.0 : 0.0) - this.forkLift)
                         * Math.min(1.0, 0.18 * d);
      } else if (Math.abs(target - this.forkX) > this.FORK_SPEED * d) {
        this.forkX += this.FORK_SPEED * d * (target > this.forkX ? 1 : -1);
        this.forkLift += (6.0 - this.forkLift) * Math.min(1.0, 0.12 * d);
      } else {
        this.forkX = target; this.hold = this.t + 16;
        if (this.forkCarry) { this.forkCarry = false; this.loaded += 1; }
        else {
          this.forkCarry = true;
          if (this.loaded >= this.PALLETS) { this.loadPhase = "plate_up"; this.hold = this.t + 12; }
        }
      }
    } else if (this.loadPhase === "plate_up") {
      if (this.t >= this.hold) {
        this.plate = Math.max(0.0, this.plate - 0.06 * d);
        if (this.plate <= 0.0) this.loadPhase = "leaving";
      }
    } else if (this.loadPhase === "leaving") {
      this.truckX += 6.0 * d;
      if (this.truckX > this.W + 360) {
        this.truckX = this.W + 380; this.loaded = 0; this.forkCarry = true;
        this.forkX = this.forkHome(); this.forkLift = 0.0;
        this.loadPhase = "arriving";
      }
    }

    this.cv.create_line(x, top, x + w, top, { fill: this.mixc(lit, 0.25) });

                               { fill: dark, outline: "" });

                             { fill: this.mixc(wood, 0.10, 0), outline: edge });

    if (!quiet)
      person(cv, this.handX, bed, this.t * 0.13,

                           look: this.handDir, walk: true });
