    this.FEED_EVERY = 118.0; this.COURSES = 4; this.PER_COURSE = 3;
    this.STEP = 5.6; this.EASE_IN = 26.0; this.HAND_EASE = 0.26;
    this.PAL_W = 86; this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.ROOM_WALL = "#24343F"; this.ROOM_WALL2 = "#1E2D36";
    this.ROOM_BAND = "#16222A"; this.ROOM_FLOOR = "#314550";
    this.ROOM_FLOOR2 = "#3A5260"; this.ROOM_LINE = "#49616D";
    this.ROOM_STEEL = "#607987"; this.ROOM_STEEL2 = "#425965";
    this.ROOM_RACK = "#4B7180"; this.ROOM_MUTED = "#91A4AE";
    this.ROOM_WOOD = "#8A6947"; this.ROOM_WOOD2 = "#644B34";
    this.ROOM_KRAFT = "#D0A06B";
  }
  room(k) {
    k = Math.max(0.0, Math.min(1.0, k));
    return this.blend(this.ROOM_WALL, this.ROOM_STEEL, k);
  }
  cartonAt(n) {
    const course = Math.trunc(n / this.PER_COURSE), col = n % this.PER_COURSE;
    const off = course % 2 === 0 ? 0 : 6;
    return [this.PAL_X + 5 + col * 25 + off, this.FLOOR - 12 - course * 22];
  }
  standX() { return this.cartonAt(PBUILD.cartons)[0] - 40; }
  ease01(k) { k = Math.max(0.0, Math.min(1.0, k)); return k * k * (3.0 - 2.0 * k); }
  toward(v, target, step) {
    const gap = target - v;
    if (Math.abs(gap) <= 0.6) return target;
    if (Math.abs(gap) < this.EASE_IN)
      step *= Math.max(0.30, Math.abs(gap) / this.EASE_IN);
    if (step >= Math.abs(gap)) return target;
    return v + (gap > 0 ? step : -step);
  }
  handGoal() {
    const g = PBUILD, ph = g.phase, y = this.FLOOR;
    if (ph === "take") {
      const k = this.ease01(g.hold / 12.0);
      return [g.hand + 26 - 8 * k, this.BELT_Y - 2 + 20 * k];
    }
    if (ph === "wait") return [g.hand + 22, this.BELT_Y + 6];
    if (ph === "to_pallet") {
      const sw = Math.sin(g.t * 0.32) * 3.0;
      return [g.hand + 18 + sw, y - 56];
    }
    if (ph === "place") {
      const k = this.ease01(g.hold / 16.0);
      const [bx, by] = this.cartonAt(g.cartons);
      const a0 = g.hand + 20, b0 = bx - 6, c0 = y - 56, d0 = by - 22;
      return [a0 + (b0 - a0) * k, c0 + (d0 - c0) * k];
    }
    if (ph === "to_belt") {
      const sw = Math.sin(g.t * 0.32) * 4.0;
      return [g.hand - 12 + sw, y - 48];
    }
    if (ph === "wrap") {
      const ang = g.turns * 2 * Math.PI;
      const wx = this.PAL_X + 43 + 86 * Math.sin(ang);
      const top = this.FLOOR - 12 - this.COURSES * 22;
      const hy = this.FLOOR - 12 - (this.FLOOR - 12 - top) * g.wrap;
      const face = Math.cos(ang) > 0 ? 1 : -1;
      return [wx + face * 15,
              Math.min(this.FLOOR - 30, Math.max(hy - 6, this.FLOOR - 78))];
    }
    if (ph === "label") {
      const ang = g.label * 2 * Math.PI;
      const wx = this.PAL_X + 43 + 86 * Math.sin(ang);
      const face = Math.cos(ang) > 0 ? 1 : -1;
      return [wx + face * 15, this.FLOOR - 44];
    }
    return [g.hand + 16, y - 50];
  }
  feedBelt(d) {
    const g = PBUILD;
    g.feed += d;
    if (g.feed >= this.FEED_EVERY) {
      g.feed = 0.0;
      const room = !g.belt.length
        || g.belt[g.belt.length - 1] > this.BELT_X0 + this.BOX_W + this.BELT_GAP;
      if (g.belt.length < this.BELT_CAP && room) g.belt.push(this.BELT_X0);
    }
    let limit = this.BELT_STOP;
    for (let i = 0; i < g.belt.length; i++) {
      const nx = Math.min(limit, g.belt[i] + this.BELT_SPEED * d);
      g.belt[i] = nx;
      limit = nx - this.BOX_W - this.BELT_GAP;
    }
  }
  beltReady() {
    return PBUILD.belt.length > 0 && PBUILD.belt[0] >= this.BELT_STOP - 0.6;
  }
  resetPallet() {
    const g = PBUILD;
    g.cartons = 0; g.wrap = g.turns = g.label = g.clear = 0.0;
    g.phase = "to_belt"; g.hold = 0.0;
  }
  tick(d) {
    const g = PBUILD;
    g.t += d; this.t = g.t;
    g.hold += d;
    this.feedBelt(d);
    const full = this.COURSES * this.PER_COURSE;
    if (g.phase === "to_belt") {
      g.hand = this.toward(g.hand, this.PICK_X, this.STEP * d);
      if (g.hand === this.PICK_X) { g.phase = "wait"; g.hold = 0.0; }
    } else if (g.phase === "wait") {
      if (this.beltReady()) { g.phase = "take"; g.hold = 0.0; }
    } else if (g.phase === "take") {
      if (g.hold > 12) {
        if (g.belt.length) g.belt.shift();
        g.phase = "to_pallet"; g.hold = 0.0;
      }
    } else if (g.phase === "to_pallet") {
      g.hand = this.toward(g.hand, this.standX(), this.STEP * d);
      if (g.hand === this.standX()) { g.phase = "place"; g.hold = 0.0; }
    } else if (g.phase === "place") {
      if (g.hold > 16) {
        g.cartons += 1;
        g.phase = g.cartons >= full ? "wrap" : "to_belt";
        g.hold = 0.0;
      }
    } else if (g.phase === "wrap") {
      g.turns += 0.024 * d;
      g.wrap = Math.min(1.0, g.turns / 2.6);
      if (g.turns >= 2.6) { g.phase = "label"; g.hold = 0.0; }
    } else if (g.phase === "label") {
      g.label = Math.min(1.0, g.label + 0.012 * d);
      if (g.label >= 1.0 && g.hold > 14) { g.phase = "clear"; g.hold = 0.0; }
    } else if (g.phase === "clear") {
      g.hand = this.toward(g.hand, this.PAL_X - 46, this.STEP * d);
      g.clear += 6.2 * d;
      if (g.clear > 320) this.resetPallet();
    }
    const [gx, gy] = this.handGoal();
    const k = Math.min(1.0, this.HAND_EASE * d);
    g.hpos[0] += (gx - g.hpos[0]) * k;
    g.hpos[1] += (gy - g.hpos[1]) * k;
  }
  parcel(x, y, w, h) {
    const sc = Math.max(0.45, Math.min(1.0, w / 26.0));
    bkBrick(this.cv, x, y - h, x + w, y, this.CARTON, 2, sc, true, this.CARTON_EDGE,
            true, true);
    this.cv.create_rectangle(x + w * 0.36, y - h, x + w * 0.60, y,
                             { fill: themeColors().accent, outline: "" });
  }
  gmaP(x, y) { YardBanner.prototype.gmaPallet.call(this, x, y, this.PAL_W, 1.0); }
  palletTruck(x, y) {
    const steel = this.ROOM_STEEL2, light = this.room(0.52), dark = this.room(0.18);
    this.cv.create_rectangle(x + 8, y - 9, x + 86, y - 4, { fill: steel, outline: "" });
    for (const wx of [x + 78, x + 12])
      this.cv.create_oval(wx - 6, y - 7, wx + 6, y + 5, { fill: dark, outline: steel });
    this.cv.create_rectangle(x, y - 44, x + 10, y - 4, { fill: light, outline: steel });
    this.cv.create_line(x + 5, y - 44, x - 18, y - 52,
                        { fill: light, width: 5, capstyle: "round" });
    this.cv.create_line(x - 18, y - 58, x - 18, y - 46,
                        { fill: dark, width: 7, capstyle: "round" });
  }
  rackFig(x, y) {
    const steel = this.ROOM_RACK;
    for (const ux of [x, x + 118])
      this.cv.create_rectangle(ux - 4, y - 148, ux + 4, y, { fill: steel, outline: "" });
    for (const by of [0, 50, 100]) {
      this.cv.create_rectangle(x, y - 48 - by, x + 118, y - 42 - by,
                               { fill: steel, outline: "" });
      for (let cx = 0; cx < 2; cx++)
        this.parcel(x + 12 + cx * 52, y - 48 - by, 40, 30);
    }
  }
  conveyorFig(x0, x1, y) {
    const frame = this.ROOM_STEEL2;
    this.cv.create_rectangle(x0, y, x1, y + 9, { fill: this.room(0.24), outline: frame });
    for (let rx = x0 + 6; rx < x1; rx += 14)
      this.cv.create_oval(rx, y + 1, rx + 8, y + 8, { fill: this.room(0.62), outline: "" });
    for (const lx of [x0 + 14, (x0 + x1) / 2, x1 - 20])
      this.cv.create_rectangle(lx, y + 9, lx + 7, this.FLOOR, { fill: frame, outline: "" });
    this.cv.create_rectangle(this.BELT_STOP + this.BOX_W, y - 22,
                             this.BELT_STOP + this.BOX_W + 5, y + 2,
                             { fill: frame, outline: "" });
  }
  palletLabel(x, y, k) {
    if (k <= 0.10) return;
    const fx = x + 52;
    this.cv.create_rectangle(fx, y - 16, fx + 20, y, { fill: "#F7F8F4", outline: "#9AA3A8" });
    for (let i = 0; i < 3; i++)
      this.cv.create_line(fx + 3, y - 12 + i * 4, fx + 17, y - 12 + i * 4,
                          { fill: "#5A6167" });
  }
  stackFig(x, cartons, wrap, label) {
    this.gmaP(x, this.FLOOR);
    const dx = x - this.PAL_X;
    for (let n = 0; n < cartons; n++) {
      const [bx, by] = this.cartonAt(n);
      this.parcel(bx + dx, by, 24, 20);
    }
    if (wrap > 0.0 && cartons) {
      const top = this.FLOOR - 12 - this.COURSES * 22;
      for (const cx of [x + 1, x + 81])
        this.cv.create_rectangle(cx, top + 2, cx + 4, this.FLOOR - 10,
                                 { fill: "#C8B48C", outline: "#9A835C" });
      const done = this.FLOOR - 12 - (this.FLOOR - 12 - top) * wrap;
      this.cv.create_rectangle(x + 2, done, x + 84, this.FLOOR - 4,
                               { fill: "rgba(233,239,242,0.25)", outline: "" });
      this.cv.create_rectangle(x, done - 5, x + 86, done,
                               { fill: "#F4F8FA", outline: "#C9D3D8" });
    }
    this.palletLabel(x, this.FLOOR - 26, label);
  }
  indoorRoom(floor, sign) {
    const cv = this.cv;
    cv.create_rectangle(0, 0, this.W, floor, { fill: this.ROOM_WALL, outline: "" });
    for (let wy = 26; wy < floor - 18; wy += 44)
      cv.create_line(0, wy, this.W, wy, { fill: this.ROOM_WALL2 });
    for (let lx = 70; lx < this.W; lx += 210) {
      cv.create_rectangle(lx - 30, 8, lx + 30, 15, { fill: "#F5EFE4", outline: "" });
      cv.create_rectangle(lx - 34, 15, lx + 34, 18, { fill: "#8C7F5E", outline: "" });
    }
    cv.create_rectangle(0, floor - 6, this.W, floor, { fill: this.ROOM_BAND, outline: "" });
    cv.create_rectangle(0, floor, this.W, this.H, { fill: this.ROOM_FLOOR, outline: "" });
    cv.create_rectangle(0, floor, this.W, floor + 3, { fill: this.ROOM_FLOOR2, outline: "" });
    bkBaseplate(cv, 0, floor + 3, this.W, this.H, this.ROOM_FLOOR, 1.2, 3, false);
    if (sign) {
      const wide = Math.max(112, 9 * sign.length + 26);
      cv.create_rectangle(this.W - wide - 16, 26, this.W - 16, 48,
                          { fill: this.ROOM_BAND, outline: this.ROOM_LINE });
      cv.create_text(this.W - wide / 2 - 16, 37,
                     { text: sign, fill: this.ROOM_MUTED, font: font(9, true) });
    }
  }
  packerPose() {
    const g = PBUILD, y = this.FLOOR, ph = g.phase;
    const hands = [g.hpos[0], g.hpos[1]];
    if (ph === "take") {
      const k = this.ease01(g.hold / 12.0);
      return { x: g.hand, y, walk: false, face: 1, crouch: 0.0, hands,
               carrying: k > 0.30 };
    }
    if (ph === "wait")
      return { x: g.hand, y, walk: false, face: -1, crouch: 0.0, hands: null };
    if (ph === "place") {
      const k = this.ease01(g.hold / 16.0);
      const course = Math.trunc(g.cartons / this.PER_COURSE);
      const crouch = Math.max(0.0, 1.0 - course / 2.0);
      return { x: g.hand, y, walk: false, face: 1, crouch: crouch * k, hands,
               carrying: k < 0.88 };
    }
    if (ph === "to_pallet")
      return { x: g.hand, y, walk: true, face: 1, crouch: 0.0, hands, carrying: true };
    if (ph === "to_belt")
      return { x: g.hand, y, walk: true, face: -1, crouch: 0.0,
               hands: g.hold < 16 ? hands : null };
    if (ph === "wrap" || ph === "label") {
      const prog = ph === "wrap" ? g.turns : g.label;
      const ang = prog * 2 * Math.PI;
      const wx = this.PAL_X + 43 + 86 * Math.sin(ang);
      const face = Math.cos(ang) > 0 ? 1 : -1;
      return { x: wx, y, walk: true, face, crouch: ph === "label" ? 0.22 : 0.0, hands };
    }
    if (ph === "clear") {
      const px = this.PAL_X + g.clear;
      return { x: px - 46, y, walk: true, face: 1, crouch: 0.10,
               hands: [px - 30, this.FLOOR - 50] };
    }
    return { x: g.hand, y, walk: true, face: -1, crouch: 0.0, hands: null };
  }
  backRacking(from) { RmaBanner.prototype.backRacking.call(this, from); }
  wallBricks() {
    for (let wx = 0; wx < this.W; wx += 46)
      bkBrick(this.cv, wx, this.FLOOR - 20, wx + 44, this.FLOOR, this.room(0.26),
              3, 0.8, true, this.room(0.12), false);
  }
  render() {
    const cv = this.cv, g = PBUILD;
    cv.clear();
    this.indoorRoom(this.FLOOR, "PALLET BUILD");
    this.backRacking(this.PAL_X + 120);   /* 後面那一排庫位，顏色壓低不搶戲 */
    this.wallBricks();                    /* 牆腳一排磚：牆整片平的撐不起前面 */
    this.rackFig(46, this.FLOOR);
    this.conveyorFig(150, this.BELT_END, this.BELT_Y);
    const ang = g.t * 0.15;
    const spin = this.tint("muted", 0.18);
    for (let rx = this.BELT_X0 + 6; rx < this.BELT_END - 8; rx += 14) {
      const cx = rx + 4.0, cy = this.BELT_Y + 4.5;
      cv.create_line(cx, cy, cx + 3.0 * Math.cos(ang), cy + 3.0 * Math.sin(ang),
                     { fill: spin });
    }
    for (const bx of g.belt) this.parcel(bx, this.BELT_Y, this.BOX_W, this.BOX_H);
    if (g.phase === "clear") {
      this.stackFig(this.PAL_X + g.clear, this.COURSES * this.PER_COURSE, 1.0, 1.0);
      this.palletTruck(this.PAL_X + g.clear - 12, this.FLOOR);
      this.gmaP(this.PAL_X, this.FLOOR);
    } else {
      this.stackFig(this.PAL_X, g.cartons, g.wrap, g.label);
    }
    const pose = this.packerPose();
    if (g.phase === "wrap" && pose.hands) {
      const [hx, hy] = pose.hands;
      const top = this.FLOOR - 12 - this.COURSES * 22;
      const fy = this.FLOOR - 12 - (this.FLOOR - 12 - top) * g.wrap;
      cv.create_line(hx, hy, this.PAL_X + 43, fy, { fill: "#DCE6EA", width: 2 });
      cv.create_oval(hx - 6, hy - 7, hx + 6, hy + 7,
                     { fill: "#F1F5F7", outline: "#C1CBD1" });
    }
    person(cv, pose.x, pose.y, pose.walk ? g.t * 0.13 : 0.0,
           "#E7C931", { cap: "#E2842B", sc: 0.95, look: pose.face,
                        crouch: pose.crouch,
                        hold: pose.hands ? pose.hands : undefined });
    if (pose.carrying && pose.hands)
      this.parcel(pose.hands[0] - 12, pose.hands[1] + 10, 24, 20);
  }
}

/* ---- 樂高小人 minifig：堆場上每一個人共用（逐行照抄）。
   梯形上身、圓柱頭、爪型手；差異放在配件（帽、反光帶、兜帽），骨架
   共用。表情三種：smile／stern（眉毛內端低）／glum（內端高、嘴角向下）。 */
Banner.prototype.minifig = function (x, y, coat, o = {}) {
  const { face = 0, skin = "#C98D5F", hair = null, cap = null, band = null,
          swing = 0.0, crouch = 0.0, hands = null, arms = "down",
          hood = false, eyes = true, sc = 1.0, mood = "smile", build = 1.0 } = o;
  const cv = this.cv;
  const dk = this.mixc(coat, 0.26, 0);
  const S = v => v * sc, B = v => v * sc * build;
  const dip = S(11.0) * Math.max(0.0, Math.min(1.0, crouch));
  const yy = y + dip;
  cv.create_oval(x - B(12), y - 4, x + B(12), y + 3,
                 { fill: this.shade("muted", 0.55), outline: "" });
  const pants = this.mixc(coat, 0.40, 0);
  const legs = face ? [[face * 2, -swing], [face * 2, swing]]
                    : [[-B(6), -swing], [B(6), swing]];
  for (const [dx, sw] of legs) {
    const lx = x + dx;
    cv.create_rectangle(lx - B(5), yy - S(16), lx + B(5) + sw * 0.5, y - 3,
                        { fill: pants, outline: "" });
    cv.create_rectangle(lx - B(6), y - 3.5, lx + B(6) + sw * 0.5, y,
                        { fill: "#20282E", outline: "" });
  }
  cv.create_rectangle(x - B(12), yy - S(19), x + B(12), yy - S(15),
                      { fill: this.mixc(pants, 0.10), outline: "" });
  cv.create_polygon(x - B(9), yy - S(38), x + B(9), yy - S(38),
                    x + B(12), yy - S(27), x + B(12), yy - S(16),
                    x - B(12), yy - S(16), x - B(12), yy - S(27),
                    { fill: coat, outline: dk, width: 1 });
  cv.create_polygon(x - B(9), yy - S(38), x + B(9), yy - S(38),
                    x + B(10), yy - S(34), x - B(10), yy - S(34),
                    { fill: this.mixc(coat, 0.13), outline: "" });
  if (band)
    cv.create_rectangle(x - B(12), yy - S(27), x + B(12), yy - S(23),
                        { fill: band, outline: "" });
  const arm = (ax, tx, ty) => {
    const w = B(4);
    cv.create_polygon(ax - w, yy - S(35), ax + w, yy - S(34),
                      tx + w * 0.85, ty, tx - w * 0.85, ty - 1,
                      { fill: this.mixc(coat, 0.07), outline: dk, width: 1 });
    cv.create_rectangle(tx - w * 0.9, ty, tx + w * 0.9, ty + S(3.4),
                        { fill: this.mixc(coat, 0.14, 0), outline: dk });
    cv.create_arc(tx - w * 0.75, ty + S(2.2), tx + w * 0.75, ty + S(7.6),
                  { start: 20, extent: 300, style: "arc", outline: skin,
                    width: Math.max(2, Math.round(2 * sc)) });
  };
  if (arms === "up") {
    for (const sd of [-1, 1]) arm(x + B(13) * sd, x + B(17) * sd, yy - S(44));
  } else if (arms === "reach" && hands !== null) {
    const [hx2, hy2] = hands;
    arm(x + B(13) * (face || 1), hx2, hy2);
    arm(x - B(13) * (face || 1), x - B(14) * (face || 1), yy - S(17));
  } else if (arms === "carry" && hands !== null) {
    const [hx2, hy2] = hands;
    arm(x - B(13), hx2 - B(10), hy2 + S(2));
    arm(x + B(13), hx2 - B(2), hy2 + S(2));
  } else if (arms === "swing" && face) {
    arm(x + face * B(11), x + face * B(14) + swing * 0.6, yy - S(17));
    arm(x - face * B(9), x - face * B(11) - swing * 0.6, yy - S(17));
  } else {
    for (const sd of [-1, 1]) arm(x + B(13) * sd, x + B(14) * sd, yy - S(17));
  }
  const hx = x + face * 3;
  cv.create_rectangle(x - S(3.2), yy - S(41), x + S(3.2), yy - S(37),
                      { fill: this.mixc(skin, 0.20, 0), outline: "" });
  if (hood) {
    cv.create_rectangle(hx - S(9.5), yy - S(60), hx + S(9.5), yy - S(41),
                        { fill: coat, outline: dk });
    cv.create_oval(hx + face * 2 - S(4), yy - S(53), hx + face * 2 + S(4),
                   yy - S(48), { fill: "#0E1017", outline: "" });
    return;
  }
  cv.create_rectangle(hx - S(8.5), yy - S(59), hx + S(8.5), yy - S(41),
                      { fill: skin, outline: this.mixc(skin, 0.28, 0) });
  if (hair)
    cv.create_rectangle(hx - S(8.5), yy - S(61), hx + S(8.5), yy - S(55),
                        { fill: hair, outline: "" });
  if (cap) {
    cv.create_rectangle(hx - S(9.5), yy - S(65), hx + S(9.5), yy - S(57),
                        { fill: cap, outline: "" });
    cv.create_rectangle(hx + (face >= 0 ? 0 : -S(17)), yy - S(59.5),
                        hx + (face >= 0 ? S(17) : 0), yy - S(57),
                        { fill: this.mixc(cap, 0.18, 0), outline: "" });
  }
  if (eyes) {
    const ey = yy - S(51), r = S(1.4);
    for (const c2 of [-S(3.4), S(3.4)]) {
      const ex = hx + c2 + face * 1.4;
      cv.create_oval(ex - r, ey - r, ex + r, ey + r, { fill: "#20282E", outline: "" });
    }
    const lw = Math.max(1, Math.round(1.6 * sc));
    if (mood === "stern") {
      for (const sd of [-1, 1]) {
        const bx0 = hx + sd * S(3.4) + face * 1.4;
        cv.create_line(bx0 - sd * S(3.2), ey - S(2.6), bx0 + sd * S(2.4), ey - S(4.8),
                       { fill: "#4A3526", width: Math.max(2, Math.round(2 * sc)),
                         capstyle: "round" });
      }
      cv.create_line(hx - S(3.4) + face * 1.4, ey + S(4.4),
                     hx + S(3.4) + face * 1.4, ey + S(4.4),
                     { fill: "#8A5748", width: lw });
    } else if (mood === "glum") {
      for (const sd of [-1, 1]) {
        const bx0 = hx + sd * S(3.4) + face * 1.4;
        cv.create_line(bx0 - sd * S(3.0), ey - S(5.0), bx0 + sd * S(2.4), ey - S(2.8),
                       { fill: "#4A3526", width: lw, capstyle: "round" });
      }
      cv.create_arc(hx - S(3.2) + face * 1.4, ey + S(3.0),
                    hx + S(3.2) + face * 1.4, ey + S(7.4),
                    { start: 15, extent: 150, style: "arc",
                      outline: "#8A5748", width: lw });
    } else {
      cv.create_arc(hx - S(3.2) + face * 1.4, ey + S(1.4),
                    hx + S(3.2) + face * 1.4, ey + S(5.8),
                    { start: 195, extent: 150, style: "arc",
                      outline: "#8A5748", width: 1 });
    }
  }
};

/* ---- 第一分頁第二章：RmaScene 完整——退貨區。一條線進、四個桶出。
   左邊判定桌：取件→送上桌→刷 RMA→拆箱→四燈輪流亮著判→判定→入桶。
   右邊驗貨檯（第二工位，和判定桌不同步——兩個工位各做各的）：拆箱→
   取出內容物→逐項比對→鍵入 WMS→封箱→抱去待判堆→取下一件→放上檯面。
   終端螢幕的第四條是判定回寫：貨進了桶，帳也才算結。 ------------------- */
const RMA = { phase: "to_intake", hold: 0.0, hand: 168.0, verdict: 0, lamp: 0,
              flap: 0.0, filled: [0, 0, 0, 0], stock: 5, t: 0,
              chkPhase: "open", chkHold: 0.0, chkAt: 876.0, chkFlap: 0.0,
              chkLift: 0.0, chkLine: 0, checked: 0, done: 0, chkWait: 3 };
class RmaBanner extends Banner {
  constructor(canvas) {

    this.BENCH_X = 290; this.BENCH_W = 156; this.BOX_X = 296;
    this.PANEL_X = 372; this.PICK_X = 168; this.WORK_X = 276; this.STEP = 3.4;
    this.BIN_X0 = 512; this.BIN_GAP = 88; this.BIN_W = 74;

    this.CHK_X = 884; this.CHK_W = 190; this.CHK_BOX_X = 890;
    this.CHK_AT_BOX = 876; this.CHK_AT_PC = 944; this.PC_X = 1004;
    this.KEY_X = 950; this.CHK_DONE_X = 1088; this.CHK_PILE_X = 1140;
    this.CHK_AT_DONE = 1064; this.CHK_AT_PILE = 1124;
    this.BOX_W = 30; this.BOX_H = 26; this.PC_LIT = "#7FD8A6";
    this.CHK_ORDER = ["open", "lift", "count", "key", "close", "hoist",
                      "carry", "stack", "fetch", "take", "back", "place"];
    this.CHK_WALK = ["carry", "fetch", "back"];
    this.CHK_DUR = { open: 46.0, lift: 26.0, count: 64.0, key: 56.0,
                     close: 26.0, hoist: 20.0, stack: 22.0, take: 20.0, place: 22.0 };
    this.CHK_STAND = { open: "box", lift: "box", count: "box", close: "box",
                       hoist: "box", place: "box", back: "box", key: "pc",
                       carry: "done", stack: "done", fetch: "pile", take: "pile" };
    this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.HIVIS = "#E7C931"; this.HARDHAT = "#E2842B";
    this.ROOM_WALL = "#24343F"; this.ROOM_WALL2 = "#1E2D36";
    this.ROOM_BAND = "#16222A"; this.ROOM_FLOOR = "#314550";
    this.ROOM_FLOOR2 = "#3A5260"; this.ROOM_LINE = "#49616D";
    this.ROOM_STEEL = "#607987"; this.ROOM_STEEL2 = "#425965";
    this.ROOM_RACK = "#4B7180"; this.ROOM_RACK2 = "#294651";
    this.ROOM_WOOD = "#8A6947"; this.ROOM_WOOD2 = "#644B34";
    this.ROOM_KRAFT = "#D0A06B"; this.ROOM_MUTED = "#91A4AE";
    this.ROOM_CREAM = "#F5EFE4";
  }
  room(k) {
    k = Math.max(0.0, Math.min(1.0, k));
    return this.blend(this.ROOM_WALL, this.ROOM_STEEL, k);
  }
  binX(i) { return this.BIN_X0 + i * this.BIN_GAP; }
  ease01(k) { k = Math.max(0.0, Math.min(1.0, k)); return k * k * (3.0 - 2.0 * k); }
  toward(v, target, step) {
    const gap = target - v;
    if (Math.abs(gap) < 22.0) step = Math.max(step * 0.32, step * Math.abs(gap) / 22.0);
    if (Math.abs(gap) <= step) return target;
    return v + (gap > 0 ? step : -step);
  }
  standX(ph) {
    return { box: this.CHK_AT_BOX, pc: this.CHK_AT_PC,
             done: this.CHK_AT_DONE, pile: this.CHK_AT_PILE }[this.CHK_STAND[ph]];
  }
  chkK() {
    const dur = this.CHK_DUR[RMA.chkPhase];
    if (!dur) return 0.0;
    return Math.max(0.0, Math.min(1.0, RMA.chkHold / dur));
  }
  boxTop(n) { return this.FLOOR - this.BOX_H * (Math.min(2, n) + 1); }
  tick(d) {
    const g = RMA;
    g.t += d; this.t = g.t;
    g.hold += d;
    if (g.phase === "to_intake") {
      g.hand = this.toward(g.hand, this.PICK_X, this.STEP * d);
      if (g.hand === this.PICK_X) { g.phase = "take"; g.hold = 0.0; }
    } else if (g.phase === "take") {
      if (g.hold > 18) {
        if (g.stock <= 0) g.stock = 5;
        g.stock -= 1;
        g.phase = "to_bench"; g.hold = 0.0;
      }
    } else if (g.phase === "to_bench") {
      g.hand = this.toward(g.hand, this.WORK_X, this.STEP * d);
      if (g.hand === this.WORK_X) { g.phase = "scan"; g.hold = 0.0; }
    } else if (g.phase === "scan") {
      if (g.hold > 26) { g.phase = "open"; g.hold = 0.0; }
    } else if (g.phase === "open") {
      g.flap = Math.min(1.0, g.flap + 0.030 * d);
      if (g.flap >= 1.0 && g.hold > 26) { g.phase = "inspect"; g.hold = 0.0; }
    } else if (g.phase === "inspect") {
      g.lamp = Math.trunc(g.hold / 9.0) % 4;
      if (g.hold > 74) {
        g.verdict = (g.verdict + 1) % 4;
        g.lamp = g.verdict;
        g.phase = "graded"; g.hold = 0.0;

    } else if (g.phase === "graded") {
      if (g.hold > 22) { g.phase = "to_bin"; g.hold = 0.0; }
    } else if (g.phase === "to_bin") {
      const target = this.binX(g.verdict) - 22;
      g.hand = this.toward(g.hand, target, this.STEP * d);
      if (g.hand === target) { g.phase = "drop"; g.hold = 0.0; }
    } else if (g.phase === "drop") {
      if (g.hold > 22) {
        g.filled[g.verdict] = Math.min(4, g.filled[g.verdict] + 1);
        if (g.filled.reduce((a, b) => a + b, 0) >= 12) g.filled = [0, 0, 0, 0];

  stepChecker(d) {

    g.chkAt = this.toward(g.chkAt, this.standX(ph), this.STEP * d);
    if (ph === "open") g.chkFlap = Math.min(1.0, g.chkFlap + 0.032 * d);
    else if (ph === "lift") {
      g.chkFlap = 1.0;
      g.chkLift = this.ease01(g.chkHold / this.CHK_DUR.lift);
    } else if (ph === "count") {
      g.chkLift = 1.0;
      g.chkLine = Math.trunc(g.chkHold / 16.0) % 3;
    } else if (ph === "key") {
      g.chkLift = Math.max(0.0, g.chkLift - 0.06 * d);
      g.chkLine = Math.trunc(g.chkHold / 9.0) % 3;
    } else if (ph === "close") {
      g.chkLift = 0.0;
      g.chkFlap = Math.max(0.0, g.chkFlap - 0.05 * d);
    }
    const over = this.CHK_WALK.indexOf(ph) >= 0
      ? g.chkAt === this.standX(ph)
      : g.chkHold >= this.CHK_DUR[ph];
    if (!over) return;
    const nxt = this.CHK_ORDER[(this.CHK_ORDER.indexOf(ph) + 1) % this.CHK_ORDER.length];
    g.chkPhase = nxt; g.chkHold = 0.0;
    if (nxt === "open") { g.chkFlap = 0.0; g.chkLift = 0.0; }
    else if (nxt === "fetch") {
      g.checked += 1;
      g.done = g.done >= 3 ? 0 : g.done + 1;
    } else if (nxt === "back") {
      g.chkWait -= 1;
      if (g.chkWait <= 0) g.chkWait = 3;

  }
  lerp2(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
  graderPose() {
    const g = RMA, y = this.FLOOR, ph = g.phase;
    if (ph === "take") {
      const k = Math.min(1.0, g.hold / 18.0);
      return { x: g.hand, y, carrying: k > 0.35, walk: false, face: -1, crouch: 0.0,
               hands: [g.hand - 26 + 8 * k, this.BENCH_Y - 6 + 14 * k] };
    }
    if (["scan", "open", "inspect", "graded"].indexOf(ph) >= 0) {
      const wob = Math.sin(g.t * 0.16) * 2.0;
      return { x: g.hand, y, carrying: false, walk: false, face: 1, crouch: 0.06,
               hands: [this.BOX_X + 14 + wob, this.BENCH_Y - 2] };
    }
    if (ph === "drop") {
      const k = this.ease01(g.hold / 22.0);
      const bx = this.binX(g.verdict) + 14, a0 = g.hand + 18;
      return { x: g.hand, y, carrying: k < 0.72, walk: false, face: 1, crouch: 0.0,
               hands: [a0 + (bx - a0) * k, this.FLOOR - 74 + 10 * k] };
    }
    if (ph === "to_bin" || ph === "to_bench")
      return { x: g.hand, y, carrying: true, walk: true, face: 1, crouch: 0.0, hands: null };

  checkerPose() {
    const g = RMA, y = this.FLOOR, ph = g.chkPhase, x = g.chkAt;
    const chest = [x + 15, y - 34];
    if (this.CHK_WALK.indexOf(ph) >= 0)
      return { x, y, carrying: ph !== "fetch", walk: true,
               face: ph === "back" ? -1 : 1, crouch: 0.0, hands: null };
    const k = this.ease01(this.chkK());
    const bench = [this.CHK_BOX_X + 16, this.BENCH_Y - 4];
    if (ph === "hoist")
      return { x, y, carrying: this.chkK() > 0.40, walk: false, face: 1, crouch: 0.0,
               hands: this.lerp2(bench, chest, k) };
    if (ph === "place")
      return { x, y, carrying: this.chkK() < 0.60, walk: false, face: 1, crouch: 0.0,
               hands: this.lerp2(chest, bench, k) };
    if (ph === "stack") {
      const dst = [this.CHK_DONE_X + 8, this.boxTop(g.done) + 12];
      return { x, y, carrying: this.chkK() < 0.70, walk: false, face: 1,
               crouch: 0.30 * k, hands: this.lerp2(chest, dst, k) };
    }
    if (ph === "take") {
      const src = [this.CHK_PILE_X + 8, this.boxTop(g.chkWait - 1) + 12];
      return { x, y, carrying: this.chkK() > 0.35, walk: false, face: 1,
               crouch: 0.30 * (1.0 - k), hands: this.lerp2(src, chest, k) };
    }
    if (ph === "key") {
      const tap = Math.sin(g.t * 0.62) * 2.0;
      return { x, y, carrying: false, walk: false, face: 1, crouch: 0.05,
               hands: [this.KEY_X + 18, this.BENCH_Y - 7 + tap] };
    }
    const wob = Math.sin(g.t * 0.17) * 2.0;
    return { x, y, carrying: false, walk: false, face: 1,
             crouch: 0.06 - 0.06 * g.chkLift,
             hands: [bench[0] + wob, bench[1] - 5 * g.chkLift] };
  }
  parcel(x, y, w, h) {
    const sc = Math.max(0.45, Math.min(1.0, w / 26.0));
    bkBrick(this.cv, x, y - h, x + w, y, this.CARTON, 2, sc, true, this.CARTON_EDGE,
            true, true);

  bkStack(x0, y, w, col, rows, bh, sc, studs, outline) {

      this.bkStack(ux - 6, y, 12, steel, 6, 18, 0.85, 1, edge);

              this.ROOM_WOOD2);

  }
  backRacking(from) {
    const steel = this.room(0.34), edge = this.room(0.20);
    const box = this.blend(this.ROOM_WALL, this.ROOM_KRAFT, 0.42);
    for (let bx = (from === undefined ? 470.0 : from); bx < this.W + 40; bx += 128.0) {
      const base = this.FLOOR - 6;
      for (const ux of [bx, bx + 96])
        this.cv.create_rectangle(ux - 4, base - 116, ux + 4, base, { fill: steel, outline: "" });
      [base - 34, base - 74, base - 114].forEach((by, k) => {
        this.cv.create_rectangle(bx - 5, by, bx + 101, by + 5, { fill: steel, outline: "" });
        for (let i = 0; i < 2; i++) {
          const ox = bx + 6 + i * 50;

  benchFig(x, y, w) {

    bkBrick(this.cv, x, this.BENCH_Y - 2, x + w, this.BENCH_Y + 8, this.ROOM_WOOD,

    for (const side of [-1, 1]) {
      const ex = side < 0 ? x : x + w;
      const tipx = ex + side * 15 * k, tipy = y - h - 11 * k;
      this.cv.create_polygon(ex, y - h, ex + side * 2, y - h - 2,

                             { fill: this.CARTON, outline: this.CARTON_EDGE });

        this.cv.create_line(ex + side * 2, y - h - 1, tipx, tipy + 1, { fill: back });
    }
    if (k > 0.5 && content) {
      this.cv.create_rectangle(x + 11, y - h + 5, x + w - 11, y - 9,
        { fill: this.tint("accent", 0.52), outline: this.shade("accent", 0.20) });

  lampsFig(x, y) {

    this.cv.create_rectangle(x + 22, y - 22, x + 30, y - 6, { fill: steel, outline: "" });
    bkBrick(this.cv, x, y - 64, x + 52, y - 20, this.room(0.20), 3, 0.8, true, steel);

  floorBoxes(x, n) {

  binsFig() {

      const dark = this.mixc(tone, 0.52, 0);
      this.cv.create_oval(x - 4, y - 5, x + this.BIN_W + 4, y + 4,
                          { fill: "rgba(40,52,60,0.5)", outline: "" });
      this.bkStack(x, y, this.BIN_W, this.mixc(tone, 0.34, 0), 3, 15, 1.0, 4, dark);
      bkBrick(this.cv, x - 3, y - 62, x + this.BIN_W + 3, y - 45, tone, 4, 1.0, true, dark);
      this.cv.create_text(x + this.BIN_W / 2, y - 53,
                          { text: names[i], fill: "#F7F8F4", font: font(8, true) });
    });
  }
  statusStrip(left, right) {
    const y = this.H - 20;
    this.cv.create_rectangle(0, y, this.W, this.H, { fill: this.ROOM_BAND, outline: "" });
    this.cv.create_text(14, y + 10, { text: left, anchor: "w",
                        fill: this.ROOM_CREAM, font: font(8, true) });
    this.cv.create_text(this.W - 14, y + 10, { text: right, anchor: "e",
                        fill: this.ROOM_MUTED, font: font(8) });
  }
  drawWorker(pose) {
    /* 判定桌與驗貨檯的人：反光背心加安全帽的樂高小人。 */
    const sw = Math.sin(RMA.t * 0.26) * (pose.walk ? 4.6 : 0.8);
    this.minifig(pose.x, pose.y, this.HIVIS,
                 { face: pose.face, cap: this.HARDHAT, band: "#F5EFE4",
                   crouch: pose.crouch, swing: sw,
                   arms: pose.carrying ? "carry" : (pose.hands ? "reach" : "swing"),
                   hands: pose.hands });
    if (pose.carrying && pose.hands)
      this.parcel(pose.hands[0] - 15, pose.hands[1] + 26, 26, 22);
  }
  checkStation() {
    const g = RMA, ph = g.chkPhase, k = this.chkK();
    this.benchFig(this.CHK_X, this.FLOOR, this.CHK_W);
    this.terminalFig(this.PC_X, this.BENCH_Y);
    this.floorBoxes(this.CHK_DONE_X, g.done + (ph === "stack" && k >= 0.70 ? 1 : 0));
    this.floorBoxes(this.CHK_PILE_X, g.chkWait - (ph === "take" && k > 0.35 ? 1 : 0));
    let onBench = ["open", "lift", "count", "key", "close"].indexOf(ph) >= 0;
    if (ph === "hoist") onBench = k <= 0.40;
    else if (ph === "place") onBench = k >= 0.60;
    if (onBench) {
      this.openCarton(this.CHK_BOX_X, this.BENCH_Y, g.chkFlap, g.chkLift <= 0.02);
      if (g.chkLift > 0.02) {
        const top = this.BENCH_Y - 23 - 12 * g.chkLift;
        this.cv.create_rectangle(this.CHK_BOX_X + 11, top, this.CHK_BOX_X + 29, top + 14,
          { fill: this.tint("accent", 0.52), outline: this.shade("accent", 0.20) });
        this.cv.create_rectangle(this.CHK_BOX_X + 11, top, this.CHK_BOX_X + 29, top + 4,
          { fill: this.tint("accent", 0.70), outline: "" });
      }
    }
    this.drawWorker(this.checkerPose());
  }
  render() {
    const cv = this.cv, g = RMA;
    cv.clear();
    this.indoorRoom(this.FLOOR, "RMA RETURNS");
    this.backRacking();
    for (let wx = 0; wx < this.W; wx += 46)
      bkBrick(cv, wx, this.FLOOR - 20, wx + 44, this.FLOOR, this.room(0.26),
              3, 0.8, true, this.room(0.12), false);
    this.intakeRack(this.INTAKE_X, this.FLOOR);
    this.benchFig(this.BENCH_X, this.FLOOR);
    this.checkStation();
    this.binsFig();
    this.lampsFig(this.PANEL_X, this.BENCH_Y);
    if (["scan", "open", "inspect", "graded"].indexOf(g.phase) >= 0) {
      this.openCarton(this.BOX_X, this.BENCH_Y, g.flap);
      if (g.phase === "scan")
        cv.create_line(this.BOX_X + 14, this.BENCH_Y - 10,
                       this.BOX_X + 24, this.BENCH_Y - 20, { fill: "#E0433A", width: 2 });
    }
    this.drawWorker(this.graderPose());
    const lang = (typeof S !== "undefined" && S.lang) || "en";
    const zh = lang === "zh";
    const names = { zh: ["重新上架", "整新加工", "隔離待判", "報廢"],
                    en: ["Restock", "Rework", "Quarantine", "Scrap"],
                    es: ["Reubicar", "Reacond.", "Cuarentena", "Desecho"] }[lang]
                  || ["Restock", "Rework", "Quarantine", "Scrap"];
    const zhT = { to_intake: "取件", take: "取件", to_bench: "送上檢驗桌",
                  scan: "刷 RMA 建檔", open: "拆箱", inspect: "比對與判定",
                  graded: "比對與判定", to_bin: "入桶", drop: "入桶" };
    const enT = { to_intake: "Fetching", take: "Fetching", to_bench: "To the bench",
                  scan: "Scanning the RMA", open: "Opening", inspect: "Grading",
                  graded: "Grading", to_bin: "Putting away", drop: "Putting away" };
    let left = (zh ? zhT : enT)[g.phase] || "";
    const right = (zh ? "待處理 %d ・ 已驗 %d ・ 已判定 %d"
                      : "IN QUEUE %d  ·  CHECKED %d  ·  GRADED %d")
      .replace("%d", g.stock).replace("%d", g.checked)
      .replace("%d", g.filled.reduce((a, b) => a + b, 0));
    if (["graded", "to_bin", "drop"].indexOf(g.phase) >= 0)
      left = left + " → " + names[g.verdict];
    const chkZh = { open: "拆箱", lift: "取出內容物", count: "逐項比對",
                    key: "鍵入系統", close: "封箱", hoist: "抱起來",
                    carry: "送往待判堆", stack: "放下待判件", fetch: "去取下一件",
                    take: "抱起下一件", back: "送回檯前", place: "放上檯面" };
    const chkEn = { open: "Opening", lift: "Unpacking", count: "Checking off",
                    key: "Keying in", close: "Taping up", hoist: "Lifting",
                    carry: "To the pending stack", stack: "Setting it down",
                    fetch: "To the next return", take: "Lifting the next",
                    back: "Back to the bench", place: "Onto the bench" };
    const ck = (zh ? chkZh : chkEn)[g.chkPhase] || "";
    left = zh ? ("判定桌：" + left + "　｜　驗貨檯：" + ck)
              : ("Grading bench: " + left + "  |  Check bench: " + ck);
    this.statusStrip(left, right);
  }
}

/* ---- 第一分頁第三章下半：ShipoutScene——打好的板從待運區送上拖車。
   打板的下一段：看的不再是手，是路徑與順序。堆高機叉一板→走到月台→
   進車廂→放在既有的板旁邊→退出來再叉下一板；門口一位地面指揮揮手
   （堆高機進車廂駕駛看不到後面，那個人就是他的後視鏡）；放滿四板關門、
   車走、換一台空車。室內，不吃天色。 ------------------------------------ */
const SHIP = { phase: "to_pick", hold: 0.0, stock: 3, aboard: 0,
               tx: 520 - 120.0, lift: 0.0, shut: 0.0, t: 0 };
class ShipoutBanner extends Banner {
  constructor(canvas) {
    super(canvas, 860, 228, 60, 184);
    this.FLOOR = 184; this.DOOR_X = 520; this.STAGE_X = 96;
    this.STAGE_GAP = 74; this.STOCK = 3; this.ABOARD = 4; this.GUIDE_X = 470;
    this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.HIVIS = "#E7C931"; this.HARDHAT = "#E2842B";
    /* 室內的殼和打板那一格共用一套：深藍灰的牆、天花板燈盤、樂高地板。
       同一個倉庫的兩段，不該長成兩間不同的房子。 */
    this.ROOM_WALL = "#24343F"; this.ROOM_WALL2 = "#1E2D36";
    this.ROOM_BAND = "#16222A"; this.ROOM_FLOOR = "#314550";
    this.ROOM_FLOOR2 = "#3A5260"; this.ROOM_LINE = "#49616D";
    this.ROOM_STEEL = "#607987"; this.ROOM_STEEL2 = "#425965";
    this.ROOM_RACK = "#4B7180"; this.ROOM_WOOD = "#8A6947";
    this.ROOM_WOOD2 = "#644B34";
    this.ROOM_KRAFT = "#D0A06B"; this.ROOM_MUTED = "#91A4AE";
  }
  stageX(n) { return this.STAGE_X + n * this.STAGE_GAP; }
  slotX(n) { return this.DOOR_X + 26 + n * 62; }
  toward(v, target, step) {
    const gap = target - v;
    return Math.abs(gap) <= step ? target : v + (gap > 0 ? step : -step);
  }
  tick(d) {
    const g = SHIP;
    g.t += d; this.t = g.t;
    g.hold += d;
    if (g.phase === "to_pick") {
      const target = this.stageX(g.stock - 1) + 62;
      g.tx = this.toward(g.tx, target, 5.2 * d);
      if (g.tx === target) { g.phase = "fork_in"; g.hold = 0.0; }
    } else if (g.phase === "fork_in") {
      g.lift += (14.0 - g.lift) * Math.min(1.0, 0.15 * d);
      if (g.hold > 16) { g.stock -= 1; g.phase = "to_dock"; g.hold = 0.0; }
    } else if (g.phase === "to_dock") {
      const target = this.slotX(g.aboard) + 34;
      g.tx = this.toward(g.tx, target, 4.6 * d);
      if (g.tx === target) { g.phase = "set_down"; g.hold = 0.0; }
    } else if (g.phase === "set_down") {
      g.lift += (0.0 - g.lift) * Math.min(1.0, 0.17 * d);
      if (g.hold > 16) { g.aboard += 1; g.phase = "back_out"; g.hold = 0.0; }
    } else if (g.phase === "back_out") {
      g.tx = this.toward(g.tx, this.DOOR_X - 90, 4.8 * d);
      if (g.tx === this.DOOR_X - 90) {
        if (g.aboard >= this.ABOARD) { g.phase = "close"; g.hold = 0.0; }
        else if (g.stock <= 0) { g.phase = "restock"; g.hold = 0.0; }
        else { g.phase = "to_pick"; g.hold = 0.0; }
      }
    } else if (g.phase === "restock") {
      if (g.hold > 44) { g.stock = this.STOCK; g.phase = "to_pick"; g.hold = 0.0; }
    } else if (g.phase === "close") {
      g.shut = Math.min(1.0, g.shut + 0.028 * d);
      if (g.shut >= 1.0 && g.hold > 30) { g.aboard = 0; g.phase = "open"; g.hold = 0.0; }
    } else if (g.phase === "open") {
      g.shut = Math.max(0.0, g.shut - 0.028 * d);
      if (g.shut <= 0.0) { g.phase = g.stock <= 0 ? "restock" : "to_pick"; g.hold = 0.0; }
    }
  }
  gmaPallet(x, y, w, sc) { YardBanner.prototype.gmaPallet.call(this, x, y, w, sc); }
  palletLoad(x, y, sc) { YardBanner.prototype.palletLoad.call(this, x, y, sc); }
  forkliftFig(x, y, carrying, lift) {
    YardBanner.prototype.forkliftFig.call(this, x, y, carrying, lift);
  }
  dockOpening() {
    const cv = this.cv, g = SHIP;
    const x0 = this.DOOR_X - 26, y0 = this.FLOOR - 140;
    cv.create_rectangle(x0, y0, this.W, this.FLOOR, { fill: "#1A2730", outline: "" });
    for (let rx = x0 + 16; rx < this.W; rx += 34)
      cv.create_line(rx, y0 + 8, rx, this.FLOOR - 20, { fill: "#22323C" });
    cv.create_rectangle(x0, y0, this.W, y0 + 7, { fill: "#2A3C47", outline: "" });
    cv.create_rectangle(x0, this.FLOOR - 20, this.W, this.FLOOR,
                        { fill: this.room(0.22), outline: "" });
    cv.create_rectangle(x0, this.FLOOR - 20, this.W, this.FLOOR - 17,
                        { fill: this.room(0.12), outline: "" });
    cv.create_rectangle(x0 - 9, y0 - 12, x0 + 3, this.FLOOR,
                        { fill: this.room(0.40), outline: this.ROOM_STEEL2 });
    cv.create_rectangle(x0 - 9, y0 - 14, this.W, y0 - 6,
                        { fill: this.room(0.32), outline: "" });
    for (let i = 0; i < g.aboard; i++)
      this.palletLoad(this.slotX(i), this.FLOOR - 18, 0.92);
    if (g.shut > 0.0) {
      const drop = (this.FLOOR - y0) * g.shut;
      cv.create_rectangle(x0, y0, this.W, y0 + drop,
                          { fill: this.room(0.36), outline: this.ROOM_STEEL2 });
      for (let ry = y0 + 8; ry < y0 + drop; ry += 11)
        cv.create_line(x0, ry, this.W, ry, { fill: this.room(0.18) });
    }
  }
  room(k) { return PalletBanner.prototype.room.call(this, k); }
  indoorRoom(floor, sign) { PalletBanner.prototype.indoorRoom.call(this, floor, sign); }
  backRacking(from) { RmaBanner.prototype.backRacking.call(this, from); }
  guide() {
    const g = SHIP;
    const busy = ["to_dock", "set_down", "back_out"].indexOf(g.phase) >= 0;
    const sw = Math.sin(g.t * (busy ? 0.24 : 0.08));
    const hy = this.FLOOR - 62 - (busy ? 14 : 4) * Math.abs(sw);
    this.minifig(this.GUIDE_X, this.FLOOR, this.HIVIS,
                 { face: 1, cap: this.HARDHAT, band: "#F5EFE4", arms: "reach",
                   hands: [this.GUIDE_X + 22 + 6 * sw, hy] });
  }
  render() {
    const cv = this.cv, g = SHIP;
    cv.clear();
    this.indoorRoom(this.FLOOR, null);
    this.backRacking(60);
    for (let wx = 0; wx < this.DOOR_X - 30; wx += 46)
      bkBrick(cv, wx, this.FLOOR - 20, wx + 44, this.FLOOR, this.room(0.26),
              3, 0.8, true, this.room(0.12), false);
    cv.create_rectangle(0, this.H - 15, this.W, this.H - 11,
                        { fill: this.tint("accent", 0.44), outline: "" });
    this.dockOpening();
    /* 區域牌畫在開口之後，不然會被月台那片蓋掉。開口在右，牌子放左上。 */
    {
      const sign = "SHIPOUT", wide = Math.max(112, 9 * sign.length + 26);
      cv.create_rectangle(16, 26, 16 + wide, 48,
                          { fill: this.ROOM_BAND, outline: this.ROOM_LINE });
      cv.create_text(16 + wide / 2, 37,
                     { text: sign, fill: this.ROOM_MUTED, font: font(9, true) });
    }
    for (let i = 0; i < Math.max(0, g.stock); i++)
      this.palletLoad(this.stageX(i), this.FLOOR, 1.0);
    this.guide();
    const carrying = g.phase === "to_dock" || g.phase === "set_down";
    this.forkliftFig(g.tx, this.FLOOR, carrying, g.lift);
    if (carrying) this.palletLoad(g.tx + 6, this.FLOOR - g.lift, 0.86);
  }
}

/* ---- 分頁五（結果頁）：DeliveryScene——尾程那一段。
   包裹車靠邊停、司機抱著件走到門口、住宅要簽收（門開、人走出來、簽、
   帶著件進屋、關門）、商業放收貨門口（住戶／收件人出來撿走，綁在車開走
   的距離上，所以車出畫面之前一定收完）、沒人在家貼招領單。一趟結束換
   幹線飛機從屋頂上飛過去。晚上沒有車，只有飛機——貨在時間上本來就是
   白天送件、晚上跑線。 --------------------------------------------------- */
const DLV = { mode: "van", dest: "house", outcome: "signature", busy: false,
              pinned: false, phase: "driving", hold: 0, carry: 0.0,
              vanX: -290.0, t: 0,
              stray: "in", strayT: 0.0, strayX: -40.0, strayFace: 1, pud: 0.0 };
class DeliveryBanner extends Banner {
  constructor(canvas) {
    super(canvas, 860, 200, 96, 128);
    this.ROAD = 128;
    this.GREEN_MID = "#5A7F58"; this.GREEN_NEAR = "#4E7150"; this.GREEN_DEEP = "#3C5A41";
    this.LANE = "#B3A895"; this.LANE_EDGE = "#968D7C";
    this.STOP_X = 0.62; this.HOUSE_X = 0.78;
    this.SPEED = 7.0; this.NOSE = 210; this.STEP_OUT = 150; this.AIR_SPEED = 6.5;
    this.TRUNK = "#6B5138";
    this.CARTON = "#D9B487"; this.CARTON_EDGE = "#B08A5E";
    this.SIGN_STEPS = [[0.00, 0.16, "opening"], [0.16, 0.34, "stepping"],
                       [0.34, 0.64, "signing"], [0.64, 0.82, "backin"],
                       [0.82, 1.00, "closing"]];
    this.PICK_STEPS = [[0.00, 0.16, "opening"], [0.16, 0.42, "stepping"],
                       [0.42, 0.56, "bending"], [0.56, 0.84, "backin"],
                       [0.84, 1.00, "closing"]];
    this.LOBES = [[-26, 12, 21], [0, 5, 30], [27, -3, 37], [60, 8, 27], [87, 14, 19]];
    this.t = 0;
  }
  groundTone() { return this.LANE; }
  ease01(k) { k = Math.max(0.0, Math.min(1.0, k)); return k * k * (3.0 - 2.0 * k); }
  delivering() { const h = this.sky().hour; return 8.5 <= h && h <= 20.5; }
  walkRate() { return DLV.dest === "rural" ? 0.013 : 0.020; }
  houseX() { return this.W * (DLV.dest === "rural" ? 0.82 : this.HOUSE_X); }
  doorX() { return this.W * this.HOUSE_X + 4; }
  warm(base, glow) {
    glow = glow || "#FFE7A6";
    const L = this.sky().light;
    const k = Math.max(0.0, Math.min(1.0, (0.62 - L) / 0.42));
    return this.blend(base, glow, k);
  }
  resetRun() {
    DLV.phase = DLV.mode === "van" ? "driving" : "flying";
    DLV.hold = 0; DLV.carry = 0.0;
    DLV.vanX = DLV.mode === "van" ? -290.0 : -160.0;
  }
  nextRun() {
    DLV.mode = (DLV.mode === "air" && (this.delivering() || DLV.pinned)) ? "van" : "air";
    this.resetRun();
  }
  play(dest) {
    DLV.pinned = true;
    DLV.dest = dest;
    DLV.outcome = dest === "shop" ? "doorstep" : "signature";
    DLV.mode = "van";
    this.resetRun();
  }
  tick(d) {
    DLV.t += d; this.t = DLV.t;
    this.stepStreetStrays(d);
    if (DLV.mode === "van") this.stepVan(d); else this.stepAir(d);
  }
  stepVan(d) {
    const stop = this.W * this.STOP_X - this.NOSE;
    if (DLV.phase === "driving") {
      DLV.vanX += this.SPEED * d;
      if (DLV.vanX >= stop) { DLV.vanX = stop; DLV.phase = "unloading"; DLV.hold = DLV.t + 18; }
    } else if (DLV.phase === "unloading") {
      if (DLV.t >= DLV.hold) DLV.phase = "walking";
    } else if (DLV.phase === "walking") {
      DLV.carry = Math.min(1.0, DLV.carry + this.walkRate() * d);
      if (DLV.carry >= 1.0) {
        DLV.phase = "delivered";
        DLV.hold = DLV.t + ({ signature: 132, notice: 40 }[DLV.outcome] || 26);
      }
    } else if (DLV.phase === "delivered") {
      if (DLV.t >= DLV.hold) DLV.phase = "returning";
    } else if (DLV.phase === "returning") {
      DLV.carry = Math.max(0.0, DLV.carry - this.walkRate() * 1.2 * d);
      if (DLV.carry <= 0.0) { DLV.phase = "boarding"; DLV.hold = DLV.t + 10; }
    } else if (DLV.phase === "boarding") {
      if (DLV.t >= DLV.hold) DLV.phase = "leaving";
    } else if (DLV.phase === "leaving") {
      DLV.vanX += (this.SPEED + 3.5) * d;
      if (DLV.vanX > this.W + 200) this.nextRun();
    }
  }
  stepAir(d) {
    DLV.vanX += this.AIR_SPEED * d;
    if (DLV.vanX > this.W + 180) this.nextRun();
  }
  signStage() {
    if (DLV.phase !== "delivered" || DLV.outcome !== "signature") return [null, 0.0];
    let u = 1.0 - Math.max(0.0, (DLV.hold - DLV.t) / 132.0);
    u = Math.max(0.0, Math.min(1.0, u));
    for (const [a0, b0, name] of this.SIGN_STEPS)
      if (u < b0) return [name, (u - a0) / (b0 - a0)];
    return ["closing", 1.0];
  }
  pickupStage() {
    if (DLV.outcome !== "doorstep" || DLV.phase !== "leaving") return [null, 0.0];
    const stop = this.W * this.STOP_X - this.NOSE;
    const span = Math.max(1.0, (this.W + 200) - stop);
    const u = Math.max(0.0, Math.min(1.0, (DLV.vanX - stop) / (span * 0.86)));
    for (const [a0, b0, name] of this.PICK_STEPS)
      if (u < b0) return [name, (u - a0) / (b0 - a0)];
    return ["closing", 1.0];
  }
  doorOpen() {
    let [st, k] = this.signStage();
    if (st === null) [st, k] = this.pickupStage();
    if (st === null) return 0.0;
    if (st === "opening") return this.ease01(k);
    if (st === "closing") return 1.0 - this.ease01(k);
    return 1.0;
  }
  cloud(cx, cy, sc) { YardBanner.prototype.cloud.call(this, cx, cy, sc); }
  /* 人行道上的一個人。梯形上身、圓柱頭、爪型手、頭頂一顆凸點——和倉庫
     裡的員工同一套做法，五個分頁的人才像同一個世界裡的人。帽子、提袋、
     咖啡杯、胖瘦、小孩由 seed 決定，所以每一個都不一樣但每次都一樣。 */
  passerby(x, y, tone, o = {}) {
    let { sc = 0.62, phase = 0.0, seed = null, seated = false } = o;
    const cv = this.cv;
    const SK = ["#F0C89B", "#D8A277", "#B9835A", "#8A5A3C", "#6B4430"];
    const HR = ["#3A2E22", "#1E1912", "#6E4A2E", "#A8813F", "#8A8378"];

      for (const [sy, ey] of [[S(30), S(24)], [S(19), S(12)]])
        this.cv.create_line(x + face * S(2), y - sy, grip, y - ey,
                            { fill: coat, width: Math.max(2, Math.trunc(S(4.2))),
                              capstyle: "round" });
    }
  }
  freighter(x, y) {
    /* 貨機。桌面版那一版的機身是一條 smooth 的封閉多邊形，Tk 的雲形線
       會把它收成一個梭形；canvas 這邊照抄出來就是一坨白色橢圓，機鼻、
       尾錐、駕駛艙全部糊掉。這裡改成把輪廓一段一段講清楚：左邊是尾錐、
       右邊是機鼻、後掠的垂直尾翼帶公司色、平尾在尾錐上、低單翼吊兩具
       發動機、駕駛艙窗和一排客艙窗。長度與站位不變，換的是輪廓。 */
    const c = themeColors(), edge = this.shade("muted", 0.22);
    y += Math.sin(this.t * 0.05) * 2;
    const body = "#F7F5F1", belly = this.tint("muted", 0.66);
    /* 主翼與發動機先畫：從這個角度它們在機身底下。 */
    this.cv.create_polygon(x + 96, y + 2, x + 52, y + 18, x + 78, y + 18,
                           x + 116, y + 2,
                           { fill: this.shade("accent", 0.12), outline: edge });
    for (const ex of [60, 80]) {
      this.cv.create_polygon(ex + x, y + 7, x + ex + 17, y + 7,
                             x + ex + 17, y + 13, x + ex, y + 13,
                             { fill: this.tint("muted", 0.40), outline: edge });
      this.cv.create_oval(x + ex + 12, y + 6.5, x + ex + 18, y + 13.5,
                          { fill: c.soft, outline: edge });
    }
    /* 垂直尾翼：後掠，前緣斜、後緣直，翼尖在左上——這一筆是「飛機」和
       「一條白色橢圓」的分別。 */
    this.cv.create_polygon(x + 30, y - 6, x + 12, y - 34, x + 26, y - 34,
                           x + 44, y - 6, { fill: c.accent, outline: "" });
    this.cv.create_polygon(x + 18, y - 24, x + 26, y - 34, x + 26, y - 24,
                           { fill: this.tint("accent", 0.42), outline: "" });
    /* 平尾：長在尾錐上，不是長在機腹。 */
    this.cv.create_polygon(x + 18, y - 4, x + 2, y - 15, x + 16, y - 15,
                           x + 34, y - 4, { fill: this.tint("accent", 0.30), outline: edge });
    /* 機身：尾錐（左，往上收）→ 平直的中段 → 機鼻（右，往下收成圓頭）。 */
    this.cv.create_polygon(
      x + 10, y - 9,            /* 尾錐上緣 */
      x + 40, y - 11, x + 108, y - 11,
      x + 134, y - 8, x + 146, y - 2, x + 148, y + 2,   /* 機鼻 */
      x + 140, y + 7, x + 108, y + 9, x + 40, y + 9,
      x + 14, y + 5,            /* 尾錐下緣 */
      { fill: body, outline: edge, width: 1 });
    this.cv.create_polygon(x + 10, y - 9, x + 14, y + 5, x + 2, y + 1,
                           { fill: body, outline: edge });      /* 尾椎的尖 */
    /* 機腹的分色線：白機身在夜空上是一片，這條線給它厚度。 */
    this.cv.create_polygon(x + 16, y + 4, x + 40, y + 6, x + 108, y + 6,
                           x + 140, y + 4, x + 140, y + 7,
                           x + 108, y + 9, x + 40, y + 9, x + 16, y + 5,
                           { fill: belly, outline: "" });
    /* 駕駛艙窗：機鼻上緣一小塊斜的。 */
    this.cv.create_polygon(x + 128, y - 7, x + 140, y - 3, x + 132, y - 1,
                           x + 124, y - 3, { fill: "#3E5A6E", outline: "" });
    /* 客艙窗：一排小點，間距固定。 */
    for (let wx = x + 44; wx < x + 118; wx += 11)
      this.cv.create_rectangle(wx, y - 5, wx + 5, y - 1,
                               { fill: this.tint("muted", 0.30), outline: "" });
  }
  van(x, y) { TariffBanner.prototype.van.call(this, x, y); }
  wheels(x, y, p, e) { YardBanner.prototype.wheels.call(this, x, y, p, e); }
  driver(x, y, cap) { YardBanner.prototype.driver.call(this, x, y, cap); }
  vanUps(x, y) { TariffBanner.prototype.vanUps.call(this, x, y); }
  vanFedex(x, y) { TariffBanner.prototype.vanFedex.call(this, x, y); }
  vanUsps(x, y) { TariffBanner.prototype.vanUsps.call(this, x, y); }
  drawVan() {
    const cv = this.cv;
    const hx = this.houseX() - 18;
    const atDoor = ["delivered", "returning", "boarding", "leaving"].indexOf(DLV.phase) >= 0;
    const kept = DLV.outcome === "notice";
    if (atDoor) {
      if (kept) this.doortag(hx + 14, this.ROAD - 24, 0.9);
      else if (DLV.outcome !== "signature") {
        const [pk, pu] = this.pickupStage();
        const lifted = pk === "backin" || pk === "closing"
                       || (pk === "bending" && pu > 0.55);
        if (!lifted) {
          /* 放下：件從手上移到台階，不是瞬間換位置。抵達後的前 22 格
             走完這一段，之後就一直在台階上。 */
          /* 起點就是他手上那一箱的落點與尺寸（courier() 裡：手上的箱
             寬 18·sc、高 14·sc，底邊在腳上方 11·sc），終點是台階上那
             一箱。位置和大小一起內插，接縫才看不出來。 */
          const set = DLV.phase === "delivered"
            ? this.ease01(Math.min(1.0, (DLV.t - (DLV.hold - 26)) / 22.0)) : 1.0;
          const csc0 = 0.80;
          const fromX = hx + 4 * csc0, fromY = this.ROAD - 11 * csc0;
          const fw = 18 * csc0, fh = 14 * csc0;
          const px2 = fromX + (hx + 22 - fromX) * set;
          const py2 = fromY + (this.ROAD - 2 - fromY) * set;
          this.parcel(px2, py2, fw + (22 - fw) * set, fh + (18 - fh) * set);
          if (DLV.busy) this.parcel(hx + 44, this.ROAD - 2, 18, 15);
        }
        /* 關門那一拍住戶還在門口——件跟著人進屋才叫「被收走」；
           兩個一起在同一格消失，看起來就是東西自己不見了。 */
        if (pk === "closing" && pu < 0.6)
          this.resident(this.houseX() + 4, this.ROAD - 2, 0.78);
        if (["stepping", "bending", "backin"].indexOf(pk) >= 0) {
          const dx = this.houseX() + 4, out = hx + 30;
          let rx, bend;
          if (pk === "stepping") { rx = dx + (out - dx) * this.ease01(pu); bend = 0.0; }
          else if (pk === "bending") { rx = out; bend = Math.sin(Math.min(1.0, pu) * Math.PI); }
          else { rx = out + (dx - out) * this.ease01(pu); bend = 0.0; }
          this.resident(rx, this.ROAD - 2, 0.78 - 0.16 * bend);
          if (lifted || (pk === "bending" && bend > 0.4))
            this.parcel(rx - 9, this.ROAD - 14 + 10 * bend, 18, 15);
        }
      }
    }
    if (["unloading", "walking", "delivered", "returning", "boarding"].indexOf(DLV.phase) >= 0) {
      const vx = DLV.vanX + this.STEP_OUT;
      const cx = vx + (hx - vx) * DLV.carry;
      const kerb = this.H - 10;
      const cy = kerb + (this.ROAD - kerb) * DLV.carry;
      const csc = 1.0 - 0.20 * DLV.carry;
      let holding = DLV.phase === "walking" || DLV.phase === "unloading"
                    || (kept && (DLV.phase === "returning" || DLV.phase === "boarding"));
      if (DLV.outcome === "signature" && DLV.phase === "delivered") {
        const [st, k] = this.signStage();
        const dx = this.houseX() + 4, out = dx - 26;
        let rx = dx;
        if (st === "stepping") rx = dx + (out - dx) * this.ease01(k);
        else if (st === "signing") rx = out;
        else if (st === "backin") rx = out + (dx - out) * this.ease01(k);
        if (st === "closing" && k < 0.6) this.resident(dx, this.ROAD - 2, 0.78);
        if (["stepping", "signing", "backin"].indexOf(st) >= 0) {
          this.resident(rx, this.ROAD - 2, 0.78);
          if (st === "backin") {
            const csc0 = 0.80;
            const hxb = hx + 4 * csc0, hyb = this.ROAD - 11 * csc0;
            const fw = 18 * csc0, fh = 14 * csc0;
            const u = this.ease01(k);
            this.parcel(hxb + (rx - 8 - hxb) * u, hyb + (this.ROAD - 26 - hyb) * u,
                        fw + (16 - fw) * u, fh + (13 - fh) * u);
          }
          if (st === "signing") {
            const bx = (rx + hx + 22) / 2, by = this.ROAD - 30;
            cv.create_rectangle(bx - 7, by - 9, bx + 7, by + 5,
                                { fill: "#F6F3E8", outline: this.shade("muted", 0.30) });
            cv.create_line(bx - 4, by - 1 + Math.sin(this.t * 0.55) * 1.6, bx + 4, by - 1,
                           { fill: this.shade("muted", 0.50) });
          }
        }
        holding = ["opening", "stepping", "signing"].indexOf(st) >= 0;
      }
      this.courier(cx, cy, holding,
                   (DLV.phase === "returning" || DLV.phase === "boarding") ? -1 : 1, csc);
    }
    this.van(DLV.vanX, this.H - 10);
  }
  render() {
    const cv = this.cv;
    cv.clear();
    this.drawSky();
    this.daystar(15);
    const drift = (this.t * 0.20) % (this.W + 260) - 130;
    for (const [bx, by, sc] of [[60, 18, 0.62], [430, 12, 0.5], [760, 22, 0.58]])
      this.cloud(((bx + drift) % (this.W + 260) + (this.W + 260)) % (this.W + 260) - 130, by, sc);
    if (DLV.mode === "air") this.freighter(DLV.vanX, 40);
    cv.create_rectangle(0, this.HORIZON, this.W, this.ROAD,
                        { fill: this.lit(this.GREEN_NEAR), outline: "" });
    cv.create_rectangle(0, this.ROAD, this.W, this.H,
                        { fill: this.litGround(this.LANE), outline: "" });
    cv.create_rectangle(0, this.ROAD, this.W, this.ROAD + 3,
                        { fill: this.litGround(this.LANE_EDGE), outline: "" });
    bkBaseplate(cv, 0, this.ROAD + 3, this.W, this.H, this.litGround(this.LANE), 1.1, 3, false);
    for (let dx = -80; dx < this.W + 80; dx += 70)
      cv.create_rectangle(dx + 18, this.H - 12, dx + 52, this.H - 8,
                          { fill: this.lit(this.mixc(this.LANE, 0.62)), outline: "" });
    /* 前後關係一律照腳下那條線排：踩得越低（y 越大）離鏡頭越近，越晚
       畫。原本行人和路燈都畫在野狗之前，可是行人站在 y=136/190、路燈
       的杆子立在 y=138，野狗只在 y=126——遠的東西反而蓋住近的，狗看
       起來就浮在路燈前面。這是與桌面版不同的一處，理由寫在這裡。 */
    const hx = this.houseX();
    if (DLV.dest === "shop") { this.blockRow(); }
    else {
      /* 左邊那一棟是集散站：件從那裡出來。少了它，這一條街只剩三條
         橫帶。樹先畫在房子之前——它們比房子遠。 */
      this.tree(this.W * 0.30, this.ROAD - 2, 0.8);
      this.tree(this.W * 0.66, this.ROAD - 4, 0.62);
      this.depot(this.W * 0.12, this.ROAD - 2);
      this.house(hx, this.ROAD - 2);
      if (DLV.dest === "rural") this.mailbox(hx - 74, this.ROAD + 12, DLV.busy);
    }
    this.grass(this.ROAD + 1, this.GREEN_DEEP);
    /* 路邊的兩隻畫在車之前：車經過的時候擋在牠們前面，那才是站在路邊
       而不是站在馬路中間。 */
    const px = this.W * 0.22;
    this.hydrant(px, this.ROAD - 2);
    if (DLV.pud > 0.02) {
      const pw = 4 + 9 * DLV.pud;
      cv.create_oval(px - pw, this.ROAD - 5, px + pw, this.ROAD + 1,
                     { fill: "rgba(140,138,94,0.25)", outline: "" });
    }
    if (DLV.stray !== "away") {
      const lift = DLV.stray === "lift" ? 1.0 : 0.0;
      const face = (DLV.stray === "sniff" || DLV.stray === "lift") ? 1 : DLV.strayFace;
      this.strayDog(DLV.strayX, this.ROAD - 2,
                    { lift, walking: DLV.stray === "in" || DLV.stray === "off",
                      head_down: DLV.stray === "sniff" ? 1.0 : 0.0,
                      face, sc: 0.48, gait: null });
      if (DLV.stray === "lift" && 20 < DLV.strayT && DLV.strayT < 100)
        this.strayStream(DLV.strayX - 9, this.ROAD - 2, this.t * 0.06);
    }
    this.strayCat(this.W * 0.52, this.ROAD - 3, { sc: 0.52 });
    /* 路燈的杆子立在 y=138，比狗貓近：後畫。 */
    this.streetlamp(this.W * 0.34, this.ROAD + 10);
    /* 行人踩在 y=136 與 190，是這一格最近的一層（只有車比他們更近）。 */
    this.streetLife(DLV.dest === "shop");
    if (DLV.mode === "van") this.drawVan();
  }
}

const BANNERS = {};
function mountBanner(id, cls) {
  const c = document.getElementById(id);
  if (!c) return;
  if (!BANNERS[id]) BANNERS[id] = new cls(c);
  BANNERS[id].render();
}
/* 換承運商：已掛起來的場景全部重畫一次，不必等下一格。倉庫那一格的
   靜態層是快取的，一併重建。 */
function repaintScenes() {
  for (const id in BANNERS) {
    try { BANNERS[id].render(); } catch (e) { /* 尚未 mount 的先跳過 */ }
  }
  if (typeof rebuildStatic === "function") rebuildStatic();
}

function bannerFrame(dt) {
  if (BANNERS.tariffscene) BANNERS.tariffscene.tick(dt);
  if (BANNERS.yardscene) BANNERS.yardscene.tick(dt);
  if (BANNERS.gaugescene) BANNERS.gaugescene.tick(dt);
  if (BANNERS.palletscene) BANNERS.palletscene.tick(dt);
  if (BANNERS.rmascene) BANNERS.rmascene.tick(dt);
  if (BANNERS.shipoutscene) BANNERS.shipoutscene.tick(dt);
  if (BANNERS.deliveryscene) BANNERS.deliveryscene.tick(dt);
  for (const id in BANNERS) {
    const b = BANNERS[id];
    if (b.cv.c.offsetParent === null) continue;
    try { b.render(); }
    catch (e) { if (!b._warned) { b._warned = true; console.error(id, e); } }
  }
}

/* ===========================================================================
   介面。分頁、欄位、三語切換、主題配色，跟桌面版同一份文案、同一組欄位。
   =========================================================================== */

const $ = (sel, root) => (root || document).querySelector(sel);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt !== undefined) n.textContent = txt;
  return n;
};
/* pick()：桌面版的 (中文, 英文) 成對字串，西文從英文那一半查表。 */
function pickPair(pair, lang) {
  if (!pair) return "";
  if (lang === "zh") return pair[0];
  if (lang === "es" && pair.length > 2) return pair[2];
  return pair[1];
}
function dpick(d, lang) {
  if (!d) return undefined;
  return d[lang] !== undefined ? d[lang] : d.en;
}

function fieldRow(key) {
  const row = el("label", "row");
  const lab = el("span", "lab");
  lab.dataset.tr = key;
  const inp = el("input", "inp");
  inp.type = "text";
  inp.value = S.v[key] === undefined ? "" : S.v[key];
  inp.dataset.field = key;
  inp.addEventListener("input", () => { S.v[key] = inp.value; });
  row.appendChild(lab); row.appendChild(inp);
  return row;
}

function card(titleKey, keys, noteKey) {
  const c = el("section", "card");
  if (titleKey) { const h = el("h3"); h.dataset.tr = titleKey; c.appendChild(h); }
  if (noteKey) { const p = el("p", "note"); p.dataset.tr = noteKey; c.appendChild(p); }
  const grid = el("div", "grid");
  for (const k of keys) grid.appendChild(fieldRow(k));
  c.appendChild(grid);
  return c;
}

function blockList(dict, lang) {
  const wrap = el("div", "blocks");
  const rows = dpick(dict, lang) || [];
  for (const [t, body] of rows) {
    const b = el("div", "block");
    b.appendChild(el("h4", null, t));
    b.appendChild(el("p", null, body));
    wrap.appendChild(b);
  }
  return wrap;
}

/* -------------------------------------------------------------------------- */
let TABS = [], PANES = [], curTab = 0, curChapter = 0;

function selectTab(i) {
  curTab = i;
  TABS.forEach((b, n) => b.classList.toggle("on", n === i));
  PANES.forEach((p, n) => p.classList.toggle("hidden", n !== i));
  if (i === 0) drawScene();
  if (i === 1) mountBanner("yardscene", YardBanner);
  if (i === 2) mountBanner("gaugescene", GaugeBanner);
  if (i === 3) mountBanner("tariffscene", TariffBanner);
  if (i === 4) {
    mountBanner("deliveryscene", DeliveryBanner);
    /* 結果頁不留白：第一次切過去就用目前的欄位算一次，看得到東西才知道
       這一頁在說什麼。之後按「計算」會覆蓋掉。 */
    const out = $("#output");
    if (out && !out.textContent.trim()) doCalculate();
  }
}
function selectChapter(i) {
  curChapter = i;
  document.querySelectorAll(".subtab").forEach((b, n) => b.classList.toggle("on", n === i));
  document.querySelectorAll(".chapter").forEach((c, n) => c.classList.toggle("hidden", n !== i));
  if (i === 1) mountBanner("rmascene", RmaBanner);
  if (i === 2) {
    mountBanner("palletscene", PalletBanner);
    mountBanner("shipoutscene", ShipoutBanner);
  }
}

function onCarrier() {
  applyServiceRules();
  const sSel = $("#serviceSel");
  sSel.innerHTML = "";
  for (const [n] of (D.SERVICES[S.carrier] || [])) {
    const o = el("option", null, n); o.value = n; sSel.appendChild(o);
  }
  sSel.value = S.service;
  applyTheme();
  applyLang();
  syncFields();
}
function onService() {
  applyServiceRules();
  S.v.zone = D.DEFAULT.zone;
  applyLang();
  syncFields();
}

function applyTheme() {
  document.querySelectorAll("#carrierbar .cbtn").forEach(b2 =>
    b2.classList.toggle("on", b2.dataset.carrier === S.carrier));
  const th = D.THEMES[S.carrier];
  const r = document.documentElement.style;
  for (const k in th) r.setProperty("--" + k, th[k]);
  document.body.dataset.carrier = S.carrier;
}

function syncFields() {
  document.querySelectorAll("input[data-field]").forEach(i => {
    const k = i.dataset.field;
    if (S.v[k] !== undefined) i.value = S.v[k];
  });
  document.querySelectorAll("input[data-zfee]").forEach(i => {
    const [k, b] = i.dataset.zfee.split("|");
    i.value = S.zoneFees[k][b];
  });
  const usps = S.carrier === "usps";
  $("#addrRow").classList.toggle("hidden", usps);
  $("#dasRow").classList.toggle("hidden", usps);
  $("#chk_ahspack").classList.toggle("hidden", usps);
  $("#chk_peak").classList.toggle("hidden", usps);
  if (usps) { S.address = "commercial"; S.dastier = "none"; S.ahspack = false; S.peak = false; }
  $("#addrSel").value = S.address;
  $("#dasSel").value = S.dastier;
  $("#unitSel").value = S.units;
  for (const [flag] of FLAGS) {
    const box = document.querySelector("#chk_" + flag + " input");
    if (box) box.checked = !!S[flag];
  }
}

function applyLang() {
  const lang = S.lang;
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.querySelectorAll("[data-tr]").forEach(n => {
    const k = n.dataset.tr;
    const t = D.TXT[lang];
    let v = (t && t[k] !== undefined) ? t[k] : (n.dataset.fallback || k);
    if (Array.isArray(v)) return;
    n.textContent = v;
  });
  const t = D.TXT[lang];
  document.title = t.title;
  $("#appTitle").textContent = t.title;
  $("#footer").textContent = t.footer;
  t.tabs.forEach((name, i) => { if (TABS[i]) TABS[i].textContent = name; });
  t.lvtabs.forEach((name, i) => {
    const b = document.querySelector('.subtab[data-lv="' + i + '"]');
    if (b) b.textContent = name;
  });
  document.querySelectorAll("[data-dlv],[data-act]").forEach(b =>
    { b.textContent = b.dataset[S.lang] || b.dataset.en; });
  $("#carrierdesc").textContent = t["carrier_" + S.carrier];
  $("#themeName").textContent = dpick(D.THEME_NAMES, lang)[S.carrier];
  /* 承運商各自的說明文字：dimnote / ahsnote 這些在桌面版是按承運商換的 */
  for (const key in D.CARRIER_NOTES) {
    const pair = D.CARRIER_NOTES[key][S.carrier];
    if (!pair) continue;
    document.querySelectorAll('[data-tr="' + key + '"]').forEach(n => {
      n.textContent = pickPair(pair, lang);
    });
  }
  fillSlot(".jobs-slot", D.JOBS);
  fillSlot(".fba-slot", D.FBA_MODES);
  fillSlot(".rma-slot", D.RMA);
  fillSlot(".tl-slot", D.TRUCKLOAD);
  fillSlot(".tship-slot", D.TRUCKLOAD_SHIP);
  fillSlot(".tllimit-slot", D.TRUCKLOAD_LIMITS);
  fillFees();
  if (S.last) showResult(S.last);
}

function fillSlot(sel, dict) {
  const host = document.querySelector(sel);
  if (!host) return;
  host.innerHTML = "";
  host.appendChild(blockList(dict, S.lang));
}
function fillFees() {
  const host = document.querySelector(".fees-slot");
  if (!host) return;
  host.innerHTML = "";
  const wrap = el("div", "blocks");
  /* 每一項配一個小圖示：十五塊一樣的白卡片，掃過去分不出哪一項是哪一
     項；圖示不是裝飾，是讓人在一排裡找得到那一格。用 emoji 而不是自己
     畫——這一格是文字卡不是場景，畫一套向量圖只會多一份要維護的東西。 */
  const FEE_ICONS = ["📦", "🗄️", "⏱️", "🫳", "📮", "🏷️", "🧱", "🔧", "🧩",
                     "↩️", "🧾", "📷", "🗑️", "🚚", "🕒"];
  D.WAREHOUSE_FEES.forEach((row, i) => {
    const b = el("div", "block feeblock");
    const head = el("div", "feehead");
    head.appendChild(el("span", "feeicon", FEE_ICONS[i] || "•"));
    head.appendChild(el("h4", null, S.lang === "zh" ? row[0] : row[1]));
    b.appendChild(head);
    b.appendChild(el("p", null, S.lang === "zh" ? row[2] : row[3]));
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
}

/* -------------------------------------------------------------------------- */
function doCalculate() {
  try {
    const d = computeData();
    S.last = d;
    showResult(d);
    selectTab(4);
  } catch (e) {
    S.last = null;
    const out = $("#output");
    out.innerHTML = "";
    const line = el("div", "t-total", D.TXT[S.lang].error || "Error");
    out.appendChild(line);
    out.appendChild(el("div", "t-body", String(e.message || e)));
    selectTab(4);
  }
}

function showResult(d) {
  const out = $("#output");
  out.innerHTML = "";
  for (const [text, tag] of renderResult(d)) {
    out.appendChild(el("div", "t-" + tag, text));
  }
  out.scrollTop = 0;
}

function showSelfTest() {
  const res = runSelfTests();
  const bad = res.filter(r => !r.ok).length;
  const zh = S.lang === "zh";
  const lines = [(res.length - bad) + " / " + res.length + (zh ? " 通過" : " passed")];
  if (bad) lines.push(zh ? "有案例對不上，引擎被改動過。" : "cases disagree; the engine has moved.");
  lines.push("");
  for (const r of res) {
    lines.push((r.ok ? "PASS  " : "FAIL  ") + r.label + (r.err ? "  [" + r.err + "]" : ""));
    lines.push("        " + (zh ? "計費重 " : "billable ") + r.gw + " (" + (zh ? "預期 " : "expected ") + r.expW + ")"
      + "   total $" + r.gt + " (" + (zh ? "預期 $" : "expected $") + r.expT + ")");
  }
  $(".testout").textContent = lines.join("\n");
  syncFields();
}

/* -------------------------------------------------------------------------- */
function boot() {
  applyServiceRules();
  const head = $("#head");
  const langSel = $("#langSel");
  langSel.addEventListener("change", () => { S.lang = langSel.value; applyLang(); });

  /* 承運商切換放在標題列：換一家，介面配色、費率表、車與場景全部跟著換。 */
  document.querySelectorAll("#carrierbar .cbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      S.carrier = btn.dataset.carrier;
      const sel = $("#carrierSel");
      if (sel) sel.value = S.carrier;
      onCarrier();
      repaintScenes();
    });
  });

  const tz = $("#tzSel");
  if (tz) tz.addEventListener("change", () => {
    setSceneZone(tz.value);
    rebuildStatic();          /* 牆上的鐘與天色在靜態層，要重畫 */
    repaintScenes();
  });

  const strip = $("#tabstrip");
  const body = $("#tabbody");
  const builders = [buildTab1, buildTab2, buildTab3, buildTab4, buildTab5];
  builders.forEach((b, i) => {
    const btn = el("button", "tab" + (i ? "" : " on"));
    btn.addEventListener("click", () => selectTab(i));
    strip.appendChild(btn); TABS.push(btn);
    const pane = b();
    if (i) pane.classList.add("hidden");
    body.appendChild(pane); PANES.push(pane);
  });
  /* 按了就跳到結果頁——算完卻停在原地，等於要人自己去找答案在哪。 */
  $("#calcBtn").addEventListener("click", () => { selectTab(4); doCalculate(); });
  onCarrier();
  selectChapter(0);
  selectTab(0);
}

if (typeof window !== "undefined") {
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
