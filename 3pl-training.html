<title>3PL Training</title>
<style>
:root{--bg:#EFE3CB;--panel:#FBF4E5;--field:#FFFCF4;--text:#2C1A0E;--muted:#7A6753;
--accent:#351C15;--hover:#1E0F0A;--soft:#FFB500;--onsoft:#2C1A0E}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
font:14px/1.55 "Trebuchet MS","Noto Sans TC",system-ui,sans-serif}
header{background:var(--accent);color:#fff;padding:10px 16px;
display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;flex:0 0 auto}
header .spacer{flex:1}
header select{background:var(--field);color:var(--text);border:0;border-radius:5px;
padding:5px 8px;font:inherit}
#themeName{color:var(--soft);font-size:12px}
#topbar{position:sticky;top:0;z-index:30;
filter:drop-shadow(0 2px 8px rgba(0,0,0,.18))}
#tabrow{display:flex;align-items:flex-end;gap:12px;background:var(--soft);
padding:6px 16px 0;border-radius:0 0 16px 16px}
#tabstrip{display:flex;gap:2px;flex:1;flex-wrap:wrap}
#tabrow #calcBtn{margin-bottom:7px;white-space:nowrap;border-radius:999px;padding:7px 18px}
.tab,.subtab{border:0;background:transparent;color:var(--onsoft);font:inherit;
padding:7px 14px;border-radius:11px 11px 0 0;cursor:pointer;opacity:.72}
.tab.on{background:var(--panel);opacity:1;font-weight:700}
.subtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.subtab{background:var(--panel);border-radius:6px;opacity:.7;color:var(--text)}
.subtab.on{background:var(--accent);color:#fff;opacity:1}
main{padding:14px 16px 40px;max-width:1180px;margin:0 auto}
.hidden{display:none!important}
.card{background:var(--panel);border-radius:10px;padding:14px 16px;margin:0 0 14px;
box-shadow:0 1px 0 rgba(0,0,0,.06)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--accent)}
.note{color:var(--muted);margin:0 0 10px;font-size:13px;white-space:pre-line}
.note.pre,.flow{white-space:pre-wrap}
.flow{background:var(--field);border-radius:7px;padding:10px;overflow-x:auto;
font:12px/1.6 ui-monospace,"Menlo",monospace;margin:0 0 10px}
.warn{background:#00000010;border-left:4px solid var(--soft);padding:8px 10px;
margin:8px 0 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 16px}
.row{display:flex;align-items:center;gap:8px}
.lab{flex:1;font-size:13px;color:var(--muted)}
.inp{width:120px;background:var(--field);border:1px solid #00000022;border-radius:5px;
padding:5px 7px;font:inherit;color:var(--text)}
.inp.small{width:82px}
select.inp{width:150px}
.check{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:13px}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.block{background:var(--field);border-radius:8px;padding:10px 12px}
.block h4{margin:0 0 4px;font-size:13px;color:var(--accent)}
.block p{margin:0;font-size:12.5px;color:var(--muted)}
.zonegrid{border-collapse:collapse;width:100%}
.zonegrid th,.zonegrid td{padding:4px 6px;text-align:left;font-size:12.5px}
.zonegrid th{color:var(--muted);font-weight:600}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 16px;
font:inherit;cursor:pointer}
.btn:hover{background:var(--hover)}
#actionbar{background:var(--soft);padding:9px 16px;
display:flex;gap:10px;align-items:center;justify-content:flex-end;
border-radius:16px 16px 0 0}
#footer{color:var(--onsoft);font-size:12px;margin-right:auto}
.scenebox{background:#18242D;border-radius:10px;padding:0;overflow:auto;margin:0 0 14px;
display:flex;justify-content:center}
canvas.scene{display:block;width:auto;max-width:100%;height:auto;margin:0 auto}
.output,.testout{background:var(--field);border-radius:8px;padding:14px;
font:12.5px/1.5 ui-monospace,"Menlo",monospace;white-space:pre-wrap;
overflow-x:auto;max-height:none;margin:0}
.t-eyebrow{color:var(--muted);font-size:11px;letter-spacing:1px}
.t-title{color:var(--accent);font-weight:700;font-size:15px;margin-top:6px}
.t-step{color:var(--accent);font-weight:700;margin-top:8px}
.t-sum{font-weight:600}
.t-total{color:var(--accent);font-weight:700;background:#00000008}
.t-note{color:var(--muted)}
.t-foot{color:var(--muted);font-size:11.5px;margin-top:10px}
.t-body{min-height:1em}

#carrierbar { display: flex; gap: 6px; margin-right: 12px; }
#carrierbar .cbtn {
  font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 5px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  border: 1.5px solid var(--panel); background: transparent; color: var(--panel);
  opacity: .78;
}
#carrierbar .cbtn.on { background: var(--soft); border-color: var(--soft);
  color: var(--onsoft); opacity: 1; }
#carrierbar .cbtn:hover { opacity: 1; }

.output:empty::before { content: attr(data-hint); color: var(--muted);
  font: inherit; white-space: pre-wrap; }

select.inp{max-width:100%;text-overflow:ellipsis}

.feehead{display:flex;align-items:center;gap:8px;margin:0 0 2px}
.feehead h4{margin:0}
.feeicon{font-size:17px;line-height:1;filter:saturate(.85)}
.feeblock{border-left:3px solid var(--soft)}
</style>
</head>

<div id="topbar">
<header>
  <h1 id="appTitle"></h1>
  <span id="themeName"></span>

    <option value="pacific" selected>US Pacific</option>

  </select>
</header>
<div id="tabrow">
  <nav id="tabstrip"></nav>
  <button class="btn" id="calcBtn" data-tr="calc"></button>
</div>
</div>
<main id="tabbody"></main>
<div id="actionbar">
  <span id="footer"></span>
</div>

一筆所對應的作業內容，不列金額——各家 3PL 報價互異。","manzh":"3PL 入門手冊（中文版 PDF）","manen":"3PL 入門手冊（英文版 PDF）","manes":"3PL 入門手冊（西班牙文版 PDF）","rateload":"載入費率表（CSV）","ratelodnote":"內建的是示範費率，不是任何一家的公告價。要算真實金額，把公告費率表或客戶合約費率存成 CSV 載進來：第一列是 Zone 號碼，之後每列開頭是重量。","rateexport":"匯出／範本（CSV）","zoneimp":"匯入路線表（CSV）","zoneexp":"匯出／範本","zonebooknote":"欄位為 origin_zip, dest_zip, zone, das_tier；das_tier 可留白。匯出鍵會把目前已記錄的路線寫成同格式的檔案，空的時候則寫出一份範例。","lgnote":"下面所有門檻都用同一個量法。先把三個邊由大到小排：最長邊、第二長、第三長。長度加周長 ＝ 最長邊 ＋ 2 ×（第二長 ＋ 第三長）。欄位叫「長度」不代表它就是最長邊，要先排序再算。材積則是三邊相乘，1 立方英尺 ＝ 1,728 in³。","maint":"維護工具","advanced":"顯示進階門檻（尺寸細項、材積門檻、尺寸上限）","profile":"規則版本","profileload":"載入","profilesave":"另存目前設定","selftest":"跑一次自我測試","selftestnote":"用五個已核對過的案例跑一次計算引擎，比對計費重與總額。改完門檻或費率就按一次。","units":"輸入單位","unit_imp":"英制（in / lb）","unit_met":"公制（cm / kg）","weight":"實際重量（lb）","length":"長度（in）","width":"寬度（in）","height":"高度（in）","signature":"簽名服務","dastier":"偏遠地區附加費","das_none":"沒有（收件地不在任何偏遠清單）","das_das":"DAS 一般偏遠","das_edas":"Extended DAS 延伸偏遠","das_ras":"RAS 極偏遠／離島","ahspack":"包裝不符（未用瓦楞紙箱完整包覆，如輪胎、軟包裝、木箱）","nstdcard":"非標準尺寸費（Nonstandard Fee）","nstdnote":"包裹過長或體積過大者，USPS 另行加收非標準尺寸費。其判定僅依長度與體積，與重量無涉。以下三條分別判定，觸發幾條即加收幾筆。","nstdl1":"最長邊門檻（in）","nstdl2":"最長邊較高門檻（in）","nstdcu":"體積門檻（in³）","nstdfeecard":"非標準尺寸費金額","nstdfeenote":"金額為示範值，請依當年度 USPS 價目表更新。觸發條件在「規則設置」分頁。","nstdf1":"第一段加收（$）","nstdf2":"第二段再加收（$）","nstdfc":"逾體積門檻加收（$）","nstdeg":"舉例：一根 40 吋長的桿子，就算只有 3 磅，前兩條都中，加收 $22。如果箱子體積又超過 2 立方英尺，再加 $30。\n門檻（22／30／3456）是官方規則；金額是示範值，請依當年度 USPS 價目表改。","rulesnote":"本頁設定包裹的計費重量。運費並非依磅秤讀數計收，而是依計費重量計收；以下四組規則即為將磅秤讀數轉換為計費重量的程序。\n　　一、材積除數：將包裹體積換算為重量\n　　二、材積重適用條件：判斷本件是否適用材積重\n　　三、最低計費重量：觸發特定附加費後，重量下限的規定\n　　四、包裹尺寸與重量上限：逾此範圍者須改走貨運（詳見下方「包裹尺寸與重量上限」）","divisorhelp":"承運車輛的容積固定，體積大而重量輕的包裹佔用的空間並不因其輕而減少，故須將所佔體積換算為重量計價。算式為長×寬×高÷除數；除數越小，換算所得重量越高，運費亦越高。","minnote":"最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","ahsnote":"AHS 是「這件有點麻煩」的加價。分揀場靠輸送帶跑，包裹丟上帶子自動掃描分流，全程沒有人碰它，成本最低。有些東西上不了帶子，要靠人工搬，這一筆就是收那個成本。\n下面每一格是一個門檻，任何一項超過就算中，不用全部超過。全部都是「大於」不是「大於等於」——剛好等於不算。","lpsnote":"LPS 是比 AHS 更上一級的加價，金額大約是 AHS 的五倍。\n中了 LPS 就不收 AHS，不是兩個都收——LPS 已經是最麻煩那一級，AHS 被吸收掉了。\n同樣每一格是一個門檻，中一項就算。","rules":"計費重量規則","divisor":"材積除數","dimcube":"體積要超過","dimzone":"in³，而且 Zone 要到這個數字以上，才算材積重：","dimnote":"此二欄位用以判斷本件是否適用材積重。\n　　填 0：不設條件，所有包裹一律適用。UPS 與 FedEx 屬此。\n　　填數字：兩項條件均成立方適用。USPS 屬此（1728 與 5）。\n\n以同一包裹說明——20×15×10 吋、體積 3,000 in³、實重 10 磅：\n　　UPS（0、0）　　　　　　　無條件限制 → 適用材積重 → 計費 22 磅\n　　USPS 寄至 Zone 7　　　　 體積與 Zone 均達標 → 適用材積重 → 計費 22 磅\n　　USPS 寄至 Zone 3　　　　 Zone 未達 5 → 不適用 → 計費 10 磅\n　　USPS 小型包裹（480 in³） 體積未達 1728 → 不適用 → 依實重計費\n\n同一包裹因寄送距離不同，USPS 分別以 10 磅與 22 磅計價，差異顯著。","usemin":"套用最低計費重量","ahsmin":"AHS 最低計費重量（lb）","lpsmin":"LPS 最低計費重量（lb）","balloonlg":"大而輕：長度加周長超過","balloonmin":"in，就至少照這個重量計費（lb）：","balloonnote":"包裹體積大而重量輕者，USPS 不以實際重量計價。逾門檻即適用下限重量，與是否觸發附加費無關，屬重量規則。\n英文叫 balloon pricing，看帳單和郵局公告時會看到這個字。","ahs":"額外處理費規則（AHS）","autoahs":"自動判斷 AHS","ahsw":"實際重量超過（lb）","ahsl":"最長邊超過（in）","ahss":"第二長邊超過（in）","ahsg":"長度加周長超過（in）","ahscu":"材積體積超過（in³）","lps":"大型包裹規則（LPS）","autolps":"自動判斷 LPS","lpsw":"實際重量超過（lb）","lpsl":"最長邊超過（in）","lpsg":"長度加周長超過（in）","lpscu":"材積體積超過（in³）","omax":"包裹尺寸與重量上限","maxw":"最大重量（lb）","maxl":"最長邊上限（in）","maxlg":"長度加周長上限（in）","omaxon":"超限仍照寄，計算 Over Maximum Limits 罰款","omaxfee":"Over Maximum Limits（每件）","pkomax":"Demand－超過上限 Over Maximum（$）","omaxnote":"三項數值隨運輸商與服務別自動切換，此處顯示的即為目前所選者的上限。任一項超過，該件即不屬包裹範疇，須改走貨運。逕行交寄者，承運商得逕予退運或加收高額費用。","base":"基本運費","baseintro":"用計費重量 + Zone 查這張表。一磅一列，到 150 lb 為止。","zonefees":"依 Zone 變動的附加費","zonefeenote":"AHS 和 LPS 分四段 Zone 計價。數字可以直接改，改了就用你的。這裡是示範值，正式作業要看合約。","f_ahs_w":"AHS－重量","f_ahs_s":"AHS－尺寸","f_ahs_p":"AHS－包裝","f_lps_c":"LPS－商業","f_lps_r":"LPS－住宅","fees":"固定金額的附加費","dascom":"DAS 商業（$）","dasres":"DAS 住宅（$）","edascom":"Extended DAS 商業（$）","edasres":"Extended DAS 住宅（$）","rascom":"RAS 商業（$）","rasres":"RAS 住宅（$）","sigfee":"簽名服務費（$）","ressur":"住宅附加費（$）","fuel":"燃油附加費（%）","feenote":"金額照合約填。偏遠分三個層級，收件 ZIP 落在哪一份清單就收哪一個，一票只會中一個，而且住宅一律比商業貴。三個都跟 Zone 無關。\n住宅附加費和 DAS 住宅是兩筆不同的錢，數字也不一樣：一個看「是不是住家」，一個看「ZIP 在不在偏遠清單上」。","peak":"旺季計價（Demand Surcharge）","peakhelp":"勾選後，本次試算加上 Demand。此為旺季限定，約每年 10 月到隔年 1 月，其他時間不會有這一筆。金額在「費率與附加費」分頁的 Demand 卡片。","peakcard":"旺季附加費金額（Demand）","peaknote":"Demand 是旺季限定的加價，約每年 10 月到隔年 1 月，期間以外不會出現。\n它不會自成一列，而是掛在既有的附加費上，帳單寫成 Demand — Residential Delivery Charge。所以同一單出現兩列住宅費、只差 Demand 字樣，那不是重複計費。\n下面是示範金額。實際金額每年公告、依上期量級分級，並計入燃油基數。","peakon":"本次試算計入 Demand（預設不計）","pkres":"Demand－住宅（$）","pkahs":"Demand－額外處理 AHS（$）","pklps":"Demand－大型包裹 LPS（$）","fuelcard":"燃油附加費","fuelnote":"燃油每週一換一次，陸運和空運各一張表。按下面的按鈕會直接開該運輸商的燃油頁面，當週的百分比在那裡看得到，看完填進上面的欄位。程式也會在背景試著自己抓，抓到就列在下面。","fuelfetch":"開啟燃油頁面","fuellink":"燃油頁面（每週一更新）","fuelcol_date":"生效日","fuelcol_g":"陸運 %","fuelcol_a":"空運 %","result":"計算結果","calc":"開始計算","recalc":"重新計算","lang":"語言","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"是","no":"否","none":"無","error":"請檢查資料","unexpected":"程式發生錯誤"},"en":{"title":"3PL Logistics Training","sub":"","tabs":["1. Warehouse","2. Carrier & Parcel","3. Rule Setup","4. Rates & Surcharges","5. Calculation Result"],"lvtabs":["Level 1 · Warehouse Operations","Level 2 · Prep, Forwarding & Storage Fees","Level 3 · Palletizing & Freight"],"mission":"Practice Case","missionhelp":"Pick a case and the data loads itself. Change anything you like.","guess":"Your prediction: what is the main result?","casebasic":"Standard Parcel","casedim":"DIM Weight Trap","caseahsw":"AHS - Weight","caseahss":"AHS - Size","caselps":"Large Package","casemixed":"Multiple AHS Triggers","guessnone":"No special surcharge","guessahsw":"AHS - Weight","guessahss":"AHS - Size / Packaging","guesslps":"LPS","caseapply":"Load Case","actfeed":"Feed the animals","actvisit":"Will Call pickup","actstart":"Start the shift","actlunch":"Break time","actwrap":"Wrap it up","actscrap":"Animals tussle","actbreak":"Water break","actmeet":"Floor meeting","actboss":"Boss's rounds","actclean":"Clean the litter box","actdog":"Pet the animals","actscold":"Boss lays into the crew","actwc":"Bathroom break","tzpick":"Warehouse clock","fullicon":"FULL","dockhint":"The dog, the cat, the food bowls, the water bowl, the litter tray, the forklift, the label bench and the scanner all respond to a click; click a food bowl and both animals come to eat, click the water bowl and they come for a drink, click the litter tray and somebody comes to scoop, double-click and they come over to you.","yardtruck":"A truck arrives","yardplane":"The line-haul passes","yardguard":"The guard walks a round","yardthief":"A thief breaks in","yarddog":"A stray wanders in","sfxon":"🔊 Sound: on","sfxoff":"🔇 Sound: off (muted)","sfxnote":"This switch covers all five tabs, not just this scene.","tload":"Pallet build to trailer load: one line","tlnote":"Past a certain volume the cartons stop travelling one at a time. At that point the freight goes on pallets and a truck comes for it, and it is priced on a completely different basis from parcels. This card is the build itself: cartons come off the line and go onto a deck course by course, then the stack is wrapped and labelled.","tlflow":"Picked cartons  →  build the courses (heavy low, flush to the edge)  →  wrap down to the deck  →  measure height and weight  →  label all four faces  →  move to staging","tship":"2. Loading the trailer","tshipnote":"The second half of the same line. The pallet is built; what is left is getting it aboard. The work here is routes and paperwork rather than hands: a fork truck runs the pallets out of staging and into the trailer with somebody spotting at the door, the trailer closes when it is full, and the bill of lading and the delivery slot have to be in place before the truck ever arrives.","tshipflow":"Staging  →  fork truck picks up  →  into the trailer (heavy forward, no gaps)  →  doors down  →  check the BOL, photograph the load  →  away on the booked slot","fba":"Into FBA: choosing between SPD and LTL/FTL","fbanote":"There are two ways into an Amazon building: carton by carton as small parcels (SPD), or palletised on a freight carrier (LTL or FTL). They are not two prices for the same thing -- the labels differ, the appointment rules differ, and they fail in different ways.","fbawarn":"What is written here is the shape of the process, not Amazon’s current rules. Pallet heights, weights, label formats and the way appointments are booked all get revised; the shipping and routing requirements in Seller Central are what govern. Prices come from three live quotes, never from this card.","tllimit":"The limits (general figures, not contract terms)","tlwarn":"Every figure above is a general one. What governs is the receiving building's current documentation and your own contract: the FBA height and weight limits are revised, freight class and fuel are the carrier's own, and what a 53 ft trailer can actually carry depends on the tare weight of the tractor and trailer under it. This section teaches the shape of the job; it is not a quoting source. For a real shipment, put three quotes side by side.","tlpick":"Jump to a stage:","tlbuild":"Palletize","tlwrap":"Wrap and label","tlstage":"Push to staging","tltruck":"Load the truck","rmapick":"Grade the next one as:","rmab0":"Restock","rmab1":"Rework","rmab2":"Quarantine","rmab3":"Scrap","gspick":"Set what the next parcel measures:","gsok":"Ordinary","gswatch":"AHS borderline","gsover":"Over limits","dlvpick":"Last mile: residential or commercial","dlvhouse":"Residential","dlvshop":"Commercial","rma":"RMA returns: grading and put-away","rmanote":"Until it has been graded, a return is not stock -- it is a pile of goods nobody knows can be sold. This bay keeps it off the sellable locations: every piece is scanned against its RMA, booked in, opened and matched, then graded to one of four destinations. Grading it wrong does not cost one item; it costs the second return and the platform metric that follow a faulty unit going back on sale.","rmaflow":"Return arrives  →  scan the RMA, photograph, book in  →  open and match item and quantity  →  grade (restock / rework / quarantine / scrap)  →  post back to the platform and the WMS","rmawarn":"Grading is a trained job, not something a picker decides in passing. Storage runs on quarantined and scrap stock the whole time it sits there, and a growing quarantine bay is the most common hidden storage bill in the building. Return policies and sellable criteria differ by platform; the client contract and the platform's current rules are what govern.","prep":"Prep and Forward: Inbound to FBA and Walmart","prepnote":"Shipping to consumers is not the only route. Cross-border sellers very often send a bulk shipment to our warehouse first, and we receive it, inspect it, relabel, repack and palletize before sending it on into Amazon's or Walmart's own fulfillment network, where the platform ships it to the buyer. This leg is called prep and forward.","prepflow":"Factory / seller  →  3PL warehouse (receive · label · repack · palletize)  →  Amazon FBA / Walmart WFS  →  platform ships to the buyer","prepwarn":"What goes wrong here is labels and appointments, not freight. A wrong label, a missing carton label, an overweight carton without a team-lift label, an unbooked slot -- any one of them can get the whole shipment refused, and sending it back costs far more than the freight did.","whatis":"Scope of Third-Party Logistics","whatisnote":"3PL stands for third-party logistics. The seller is relieved of leasing warehouse space, employing picking and packing staff, and dealing with carriers directly. Goods are consigned to our facility and all subsequent handling is performed on the seller’s behalf.","flow":"Seller / client  →  3PL warehouse (receiving · stock · shipping)  →  Carrier: UPS / FedEx / USPS  →  Buyer","jobs":"Warehouse Roles","manuals":"Staff manual","manualnote":"","carrier":"Carrier","carriernote":"","carrierpick":"Carrier","servicepick":"Service","carrier_ups":"UPS -- the workhorse for US domestic parcels. Cost follows five things: service, zone, billable weight, address type and surcharges.","carrier_fedex":"FedEx -- Ground and Express run as two networks, and Ground splits again into Ground for businesses and Home Delivery for homes. Its surcharge names are its own, and remote areas count on the pickup side as well as the destination. See the FedEx billing guide.","carrier_usps":"USPS -- the postal service, and the furthest from the other two: no residential surcharge, no delivery area surcharge, a 70 lb ceiling, and postage paid up front rather than invoiced. Since April 2026 it does charge fuel: a flat 8% running to 2027-01-17, rather than a figure that moves weekly. PO Boxes and military addresses are USPS-only. See the USPS guide.","package":"Package Info","address":"Address Type","commercial":"Commercial","residential":"Residential","from":"From ZIP Code","to":"To ZIP Code","zone":"Zone","zonehelp":"Filled in automatically once both ZIPs are complete.","zoneimport":"Import zone chart","zoneimportnote":"Download the UPS zone chart from the link above and import it here. It goes into the local cache, and this origin resolves offline from then on.","feegloss":"Warehouse Charges","feeglossnote":"The other half of the invoice. Freight is charged by the carrier; the items below are charged by the warehouse, and staff generally encounter them well before they encounter AHS. Each entry states the operation being paid for. Amounts are omitted deliberately: every 3PL prices its own, and a figure shown here would be read as a market rate.","manzh":"Staff manual (Chinese PDF)","manen":"Staff manual (English PDF)","manes":"Staff manual (Spanish PDF)","rateload":"Load a rate table (CSV)","ratelodnote":"The built-in grid is a demonstration set, not any carrier’s published price. To rate at real money, save the published or contracted table as CSV and load it: first row zone numbers, every later row starting with a weight.","rateexport":"Export / template (CSV)","zoneimp":"Import lanes (CSV)","zoneexp":"Export / template","zonebooknote":"Columns are origin_zip, dest_zip, zone, das_tier; the tier may be left blank. Export writes the lanes already recorded in the same format, or a worked example when the book is still empty.","lgnote":"Every threshold below is measured the same way. Sort the three sides largest first: longest, second, third. Length + girth = longest + 2 x (second + third). The field called Length is not necessarily the longest side, so the sort comes first. Cube is the three sides multiplied; one cubic foot is 1,728 in³.","maint":"Maintenance","advanced":"Show advanced thresholds (size detail, DIM triggers, size ceilings)","profile":"Rule set","profileload":"Load","profilesave":"Save current","selftest":"Run self-test","selftestnote":"Runs five checked cases through the engine and compares billable weight and total. Press it after editing a threshold or a rate.","units":"Input units","unit_imp":"Imperial (in / lb)","unit_met":"Metric (cm / kg)","weight":"Weight (lb)","length":"Length (in)","width":"Width (in)","height":"Height (in)","signature":"Signature","dastier":"Remote area surcharge","das_none":"None (not on any remote list)","das_das":"DAS - standard","das_edas":"Extended DAS","das_ras":"RAS - remote / island","ahspack":"Packaging (not fully encased in corrugated cardboard: tires, soft packs, wood crates)","nstdcard":"Nonstandard Fee","nstdnote":"USPS levies a nonstandard fee on parcels that are excessively long or bulky. It is assessed on length and cube alone; weight is not considered. The three rules below are judged separately, and a parcel is charged for each one it triggers.","nstdl1":"Longest side threshold (in)","nstdl2":"Higher longest side threshold (in)","nstdcu":"Cube threshold (in3)","nstdfeecard":"Nonstandard fee amounts","nstdfeenote":"The amounts are illustrative; set them from the current USPS price list. The thresholds that trigger them are on the Rule Setup tab.","nstdf1":"First step, add ($)","nstdf2":"Second step, add ($)","nstdfc":"Over the cube threshold, add ($)","nstdeg":"For example: a 40-inch pole weighing three pounds trips both length rules, so $22. If the box is also over two cubic feet, another $30.\nThe thresholds (22 / 30 / 3456) are the published rule; the amounts are illustrative -- set them from the current USPS price list.","rulesnote":"This page sets the billable weight of a parcel. Freight is charged on the billable weight rather than on the scale reading; the four groups of rules below are the procedure that converts one into the other.\n    1. DIM divisor: converts volume into a weight\n    2. Conditions for dimensional weight: whether it applies to this parcel\n    3. Minimum billable weight: the floor imposed once certain surcharges apply\n    4. Size and weight limits: past these the item has to move as freight (see Parcel Size and Weight Limits below)","divisorhelp":"Vehicle capacity is fixed, and a bulky but light parcel occupies its space regardless of what it weighs, so the volume it takes up is converted into a weight for pricing. The calculation is length x width x height divided by this number; the smaller the divisor, the greater the resulting weight and the higher the charge.","minnote":"A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","ahsnote":"AHS is the charge for an awkward parcel. A hub runs on conveyors: a parcel goes on the belt, gets scanned and sorted, and nobody touches it. Some things cannot ride the belt and have to be moved by hand, and this charge pays for that.\nEach box below is a threshold, and any single one being exceeded is enough. All of them are strictly greater than -- landing exactly on the number does not trigger it.","lpsnote":"LPS is the tier above AHS, roughly five times the amount.\nWhere LPS applies, AHS does not -- not both. LPS is already the severe grade and it absorbs the milder one.\nAgain each box is a threshold, and one is enough.","rules":"Billable Weight Rules","divisor":"DIM Divisor","dimcube":"Cube must exceed","dimzone":"in3, AND the zone must reach this, before DIM counts:","dimnote":"These two boxes ask one question: does this parcel get dimensional weight at all?\n    0 = no condition, every parcel gets it. That is UPS and FedEx.\n    A number = both conditions must hold first. That is USPS (1728 and 5).\n\nOne box makes it clear -- 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb:\n    UPS (0, 0)              no condition -> DIM applies -> billed 22 lb\n    USPS to zone 7          cube and zone both pass -> DIM applies -> billed 22 lb\n    USPS to zone 3          zone below 5 -> no DIM -> billed 10 lb\n    USPS, small box (480 in3)   cube under 1728 -> no DIM -> actual weight\n\nThe gap is large: the same box billed at 10 lb going near and 22 lb going far.","usemin":"Use Minimum Billable Weight","ahsmin":"AHS Minimum Weight (lb)","lpsmin":"LPS Minimum Weight (lb)","balloonlg":"Big but light: length + girth over","balloonmin":"in, bill at least (lb):","balloonnote":"Where a parcel is large in dimension but light in weight, USPS does not rate it on actual weight. Past the threshold a floor weight applies. It is unrelated to surcharges and is a weight rule.\nUSPS calls it balloon pricing, which is the term you will see on the invoice and in postal notices.","ahs":"Additional Handling Rules","autoahs":"Check AHS Automatically","ahsw":"Weight Over (lb)","ahsl":"Longest Side Over (in)","ahss":"Second Side Over (in)","ahsg":"Length + Girth Over (in)","ahscu":"Cubic Volume Over (in3)","lps":"Large Package Rules","autolps":"Check LPS Automatically","lpsw":"Weight Over (lb)","lpsl":"Longest Side Over (in)","lpsg":"Length + Girth Over (in)","lpscu":"Cubic Volume Over (in3)","omax":"Parcel Size and Weight Limits","maxw":"Maximum Weight (lb)","maxl":"Maximum Longest Side (in)","maxlg":"Maximum Length + Girth (in)","omaxon":"Ship over limit anyway and charge Over Maximum Limits","omaxfee":"Over Maximum Limits (per package)","pkomax":"Demand - Over Maximum Limits ($)","omaxnote":"These three values follow the carrier and service selected above, so the figures shown are the limits that apply to the current selection. Exceed any one of them and the item is no longer a parcel and must move as freight. Tendered anyway, it may be returned or charged at a substantial penalty.","base":"Base Transportation","baseintro":"Billable weight + zone, looked up here. One row per pound, up to 150 lb.","zonefees":"Zone-Dependent Surcharges","zonefeenote":"AHS and LPS price in four zone bands. Edit any cell and the calculation uses yours. Demo figures -- check the contract for real work.","f_ahs_w":"AHS - Weight","f_ahs_s":"AHS - Size","f_ahs_p":"AHS - Packaging","f_lps_c":"LPS - Commercial","f_lps_r":"LPS - Residential","fees":"Flat Surcharges","dascom":"DAS - commercial ($)","dasres":"DAS - residential ($)","edascom":"Extended DAS - commercial ($)","edasres":"Extended DAS - residential ($)","rascom":"RAS - commercial ($)","rasres":"RAS - residential ($)","sigfee":"Signature Fee ($)","ressur":"Residential Surcharge ($)","fuel":"Fuel (%)","feenote":"Set these to your contract. Remote areas come in three tiers -- whichever list the destination ZIP sits on is the one charged, only ever one per shipment, and residential is always dearer than commercial. None of the three has anything to do with the zone.\nThe residential surcharge and DAS residential are two different charges carrying two different amounts: one asks whether it is a home, the other whether the ZIP is on the remote list.","peak":"Peak season pricing (demand surcharge)","peakhelp":"Tick this and the quote adds the demand surcharge. It is peak-season only, roughly October to January; outside that window there is no such charge. The amounts sit on the rates tab.","peakcard":"Demand Surcharge Amounts","peaknote":"Demand applies only during peak season, roughly October to January. Outside that window it does not appear.\nIt is never a line of its own: it rides on an existing surcharge and is billed as Demand - Residential Delivery Charge. Two residential lines on one shipment differing only by the word Demand are not double billing.\nThe amounts below are demonstration values. Real ones are published annually, banded by volume, and included in the fuel basis.","peakon":"Include Demand in this quote (off by default)","pkres":"Demand - Residential ($)","pkahs":"Demand - Additional Handling ($)","pklps":"Demand - Large Package ($)","fuelcard":"Fuel Surcharge","fuelnote":"Fuel changes every Monday, on separate tables for ground and air. The button opens that carrier's own fuel page, where the week's percentage is published; read it and type it in above. The tool also tries to fetch it in the background, and lists what it finds below.","fuelfetch":"Open the fuel page","fuellink":"The fuel page, updated every Monday","fuelcol_date":"Effective","fuelcol_g":"Ground %","fuelcol_a":"Air %","result":"Calculation Result","calc":"Calculate","recalc":"Calculate Again","lang":"Language","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"Yes","no":"No","none":"None","error":"Please Check","unexpected":"Something Went Wrong"},"es":{"title":"Capacitación en Logística 3PL","sub":"","tabs":["1. Almacén","2. Transportista y paquete","3. Reglas","4. Tarifas y recargos","5. Resultado"],"lvtabs":["Nivel 1 · Operativa de almacén","Nivel 2 · Preparación y tarifas de almacenaje","Nivel 3 · Paletizado y carga"],"mission":"Caso de práctica","missionhelp":"Elige un caso y los datos se cargan solos. Puedes cambiar lo que quieras.","guess":"Tu pronóstico: ¿cuál será el resultado principal?","casebasic":"Paquete normal","casedim":"Trampa de peso volumétrico","caseahsw":"AHS - Peso","caseahss":"AHS - Tamaño","caselps":"Paquete grande (LPS)","casemixed":"Varias condiciones de AHS","guessnone":"Sin recargo especial","guessahsw":"AHS - Peso","guessahss":"AHS - Tamaño / Embalaje","guesslps":"LPS","caseapply":"Cargar caso","actfeed":"Dar de comer","actvisit":"Recogida Will Call","actstart":"Iniciar el turno","actlunch":"Hora de comida","actwrap":"Cerrar la jornada","actscrap":"Perro y gato alborotan","actbreak":"Ir por agua","actmeet":"Reunión en el piso","actboss":"Ronda del jefe","actclean":"Limpiar arenero","actdog":"Acariciar animales","actscold":"El jefe los regaña","actwc":"Ir al baño","tzpick":"Reloj del almacén","fullicon":"COMPL.","dockhint":"El perro, el gato, los platos de comida, el bebedero, el montacargas, la mesa de etiquetado y el escáner responden al clic; haz clic en un plato y los dos animales vienen a comer, haz clic en el bebedero y vienen a beber, y con doble clic se te acercan.","yardtruck":"Llega un camión","yardplane":"Pasa el vuelo de línea","yardguard":"Ronda del vigilante","yardthief":"Entra un ladrón","yarddog":"Entra un perro callejero","sfxon":"🔊 Sonido: activado","sfxoff":"🔇 Sonido: desactivado (silencio)","sfxnote":"Este control aplica a las cinco pestañas, no solo a esta escena.","tload":"1. Armar la tarima","tlnote":"A partir de cierto volumen ya no se entregan cajas una por una. La mercancía va en tarimas y la recoge una línea de carga, y la tarificación no se parece en nada a la de paquetería. Esta tarjeta es el armado: las cajas bajan de la línea, se acomodan en camas sobre la tarima, se emplayan y se etiquetan.","tlflow":"Cajas surtidas  →  armar las camas (lo pesado abajo, al ras del borde)  →  emplayar hasta la base  →  medir altura y peso  →  etiquetar las cuatro caras  →  pasar a la zona de salida","tship":"2. Cargar el remolque","tshipnote":"La tarima ya está armada; falta subirla. Aquí lo importante no son las manos sino el recorrido y los documentos: el montacargas saca las tarimas de la zona de salida y las mete al remolque con alguien dirigiendo en la puerta, se cierra cuando está lleno, y el BOL y la cita tienen que estar listos antes de que llegue el camión.","tshipflow":"Zona de salida  →  el montacargas levanta  →  al remolque (lo pesado adelante, sin huecos)  →  cerrar puertas  →  revisar el BOL y fotografiar  →  salida en la cita reservada","fba":"Entrada a FBA: elegir entre SPD y LTL/FTL","fbanote":"Hay dos maneras de entrar a una bodega de Amazon: caja por caja como paquetería (SPD), o paletizado con una línea de carga (LTL o FTL). No son dos precios de lo mismo: cambian las etiquetas, cambian las reglas de cita y fallan de maneras distintas.","fbawarn":"Aquí está la forma del proceso, no las reglas vigentes de Amazon. Las alturas, los pesos, los formatos de etiqueta y la manera de reservar cita se revisan cada año; lo que manda son los requisitos de envío y ruteo de Seller Central. Los precios salen de tres cotizaciones reales, nunca de esta tarjeta.","tllimit":"Los límites (valores generales, no términos de contrato)","tlwarn":"Cada cifra de arriba es general. Lo que manda es la documentación vigente del almacén receptor y tu propio contrato: los límites de altura y peso de FBA se revisan, la clase de flete y el combustible son del transportista, y lo que realmente carga un remolque de 53 pies depende de la tara del tractor y del remolque. Esta sección enseña la forma del trabajo; no es una fuente de cotización. Para un embarque real, compara tres cotizaciones.","tlpick":"Ir a una etapa:","tlbuild":"Paletizar","tlwrap":"Emplayar y etiquetar","tlstage":"Pasar a salida","tltruck":"Cargar el camión","rmapick":"Clasificar el siguiente como:","rmab0":"Reubicar","rmab1":"Reacond.","rmab2":"Cuarentena","rmab3":"Desecho","gspick":"Fijar la medida del siguiente:","gsok":"Normal","gswatch":"Límite AHS","gsover":"Fuera de límites","dlvpick":"Última milla: residencial o comercial","dlvhouse":"Residencial","dlvshop":"Comercial","rma":"Zona de devoluciones RMA: clasificar y guardar","rmanote":"Hasta que se clasifica, una devolución no es inventario: es mercancía de la que nadie sabe si se puede vender. Esta zona la mantiene fuera de las ubicaciones vendibles: cada pieza se escanea contra su RMA, se registra, se abre y se coteja, y después se clasifica hacia uno de cuatro destinos. Clasificar mal no cuesta un artículo; cuesta la segunda devolución y la métrica de la plataforma.","rmaflow":"Llega la devolución  →  escanear el RMA, fotografiar, registrar  →  abrir y cotejar artículo y cantidad  →  clasificar (reubicar / reacondicionar / cuarentena / desecho)  →  actualizar la plataforma y el WMS","rmawarn":"La clasificación es trabajo de personal capacitado, no algo que decide de paso quien surte. El almacenaje sigue corriendo sobre la mercancía en cuarentena y en desecho, y una zona de cuarentena que crece es el costo oculto de almacenaje más común. Las políticas de devolución cambian por plataforma; manda el contrato del cliente y la regla vigente.","prep":"Preparación y reenvío: entrada a FBA y Walmart","prepnote":"Enviar al consumidor no es la única ruta. Los vendedores transfronterizos mandan muy seguido un embarque completo primero a nuestro almacén, y nosotros lo recibimos, lo revisamos, lo reetiquetamos, lo reempacamos y lo paletizamos antes de mandarlo a la red de Amazon o de Walmart, donde la plataforma lo envía al comprador. A este tramo se le llama preparación y reenvío (prep and forward).","prepflow":"Fábrica / vendedor  →  Almacén 3PL (recibo · etiquetado · reempaque · paletizado)  →  Amazon FBA / Walmart WFS  →  la plataforma envía al comprador","prepwarn":"Aquí lo que falla son las etiquetas y las citas, no el flete. Una etiqueta equivocada, una caja sin etiqueta, una caja con sobrepeso sin etiqueta de Team Lift, una cita no reservada: cualquiera de ellas puede hacer que rechacen el embarque completo, y devolverlo cuesta mucho más que el flete.","whatis":"Ámbito de la logística de terceros","whatisnote":"3PL significa logística de terceros. El vendedor queda relevado de arrendar bodega, emplear personal de surtido y empaque, y tratar directamente con los transportistas. La mercancía se consigna a nuestras instalaciones y todo el manejo posterior se realiza por cuenta del vendedor.","flow":"Vendedor / cliente  →  Almacén 3PL (recibo · inventario · envío)  →  Transportista: UPS / FedEx / USPS  →  Comprador","jobs":"Puestos de operación en almacén","manuals":"Manual del personal","manualnote":"","carrier":"Transportista","carriernote":"","carrierpick":"Transportista","servicepick":"Servicio","carrier_ups":"UPS: el caballo de batalla de la paquetería nacional en Estados Unidos. El costo lo deciden cinco cosas: el servicio, la zona, el peso facturable, el tipo de dirección y los recargos.","carrier_fedex":"FedEx: Ground y Express son dos redes distintas, y Ground se divide a su vez en Ground (para empresas) y Home Delivery (para domicilios). Los nombres de sus recargos son propios, y las zonas remotas cuentan tanto en la recolección como en el destino. Consulta la guía de facturación de FedEx.","carrier_usps":"USPS: el servicio postal, y el más distinto de los tres: sin recargo de combustible, sin recargo residencial, tope de 70 lb, y el franqueo se paga por adelantado en lugar de facturarse. Los apartados postales y las direcciones militares solo los cubre USPS. Consulta la guía de USPS.","package":"Datos del paquete","address":"Tipo de dirección","commercial":"Comercial","residential":"Residencial","from":"Código postal de origen","to":"Código postal de destino","zone":"Zona","zonehelp":"Se llena solo en cuanto los dos códigos postales estén completos.","zoneimport":"Importar tabla de zonas","zoneimportnote":"Descarga la tabla de zonas de UPS desde el enlace de arriba e impórtala aquí. Se guarda en la memoria local y desde entonces este origen se resuelve sin conexión.","feegloss":"Cargos por operación de almacén","feeglossnote":"La otra mitad de la factura. El flete lo cobra el transportista; los conceptos siguientes los cobra el almacén, y el personal suele encontrarlos bastante antes que el AHS. Cada entrada indica la operación que se está pagando. Los importes se omiten de forma deliberada: cada 3PL fija los suyos, y una cifra aquí se interpretaría como precio de mercado.","manzh":"Manual del personal (PDF en chino)","manen":"Manual del personal (PDF en inglés)","manes":"Manual del personal (PDF en español)","rateload":"Cargar tabla de tarifas (CSV)","ratelodnote":"La tabla incluida es una muestra de demostración, no el precio publicado de ningún transportista. Para cotizar con dinero real, guarda la tabla publicada o contratada como CSV y cárgala: la primera fila lleva los números de zona y cada fila siguiente empieza con un peso.","rateexport":"Exportar / plantilla (CSV)","zoneimp":"Importar rutas (CSV)","zoneexp":"Exportar / plantilla","zonebooknote":"Las columnas son origin_zip, dest_zip, zone, das_tier; el nivel puede quedar en blanco. Exportar escribe las rutas ya registradas en el mismo formato, o un ejemplo resuelto cuando todavía no hay ninguna.","lgnote":"Todos los umbrales de abajo se miden igual. Ordena los tres lados de mayor a menor: el más largo, el segundo y el tercero. Largo + contorno = el más largo + 2 × (segundo + tercero). El campo que se llama Largo no es necesariamente el lado más largo, así que primero se ordena. El volumen es el producto de los tres lados; un pie cúbico son 1,728 in³.","maint":"Mantenimiento","advanced":"Mostrar umbrales avanzados (detalle de tamaño, disparadores de volumétrico, topes de tamaño)","profile":"Juego de reglas","profileload":"Cargar","profilesave":"Guardar el actual","selftest":"Ejecutar autoprueba","selftestnote":"Pasa cinco casos ya verificados por el motor y compara el peso facturable y el total. Presiónalo después de editar un umbral o una tarifa.","units":"Unidades de entrada","unit_imp":"Imperial (in / lb)","unit_met":"Métrico (cm / kg)","weight":"Peso (lb)","length":"Largo (in)","width":"Ancho (in)","height":"Alto (in)","signature":"Firma","dastier":"Recargo por zona remota","das_none":"Ninguno (no está en ninguna lista remota)","das_das":"DAS - estándar","das_edas":"Extended DAS","das_ras":"RAS - remota / isla","ahspack":"Embalaje (no va totalmente cubierto de cartón corrugado: llantas, bolsas flexibles, huacales de madera)","nstdcard":"Cargo por tamaño no estándar","nstdnote":"USPS aplica un cargo por tamaño no estándar a los paquetes excesivamente largos o voluminosos. Se determina solo por largo y volumen; el peso no se toma en cuenta. Las tres reglas de abajo se evalúan por separado, y el paquete paga por cada una que active.","nstdl1":"Umbral del lado más largo (in)","nstdl2":"Umbral superior del lado más largo (in)","nstdcu":"Umbral de volumen (in³)","nstdfeecard":"Importes del cargo por tamaño no estándar","nstdfeenote":"Los importes son ilustrativos; ajústalos según la lista de precios vigente de USPS. Los umbrales que los activan están en la pestaña de Reglas.","nstdf1":"Primer tramo, agregar ($)","nstdf2":"Segundo tramo, agregar ($)","nstdfc":"Sobre el umbral de volumen, agregar ($)","nstdeg":"Por ejemplo: una barra de 40 pulgadas que pesa tres libras activa las dos reglas de largo, o sea $22. Si además la caja pasa de dos pies cúbicos, otros $30.\nLos umbrales (22 / 30 / 3456) son la regla publicada; los importes son ilustrativos: ajústalos según la lista de precios vigente de USPS.","rulesnote":"Esta página fija el peso facturable de un paquete. El flete se cobra sobre el peso facturable y no sobre lo que marca la báscula; los cuatro grupos de reglas de abajo son el procedimiento que convierte uno en el otro.\n    1. Divisor volumétrico: convierte el volumen en peso\n    2. Condiciones del peso volumétrico: si aplica o no a este paquete\n    3. Peso facturable mínimo: el piso que se impone cuando aplican ciertos recargos\n    4. Límites de tamaño y peso: pasados estos el artículo tiene que ir como carga (ver Límites de tamaño y peso del paquete más abajo)","divisorhelp":"La capacidad del vehículo es fija, y un paquete voluminoso pero ligero ocupa su espacio sin importar lo que pese, así que el volumen que ocupa se convierte en peso para cobrarlo. El cálculo es largo × ancho × alto entre este número; mientras más chico el divisor, mayor el peso resultante y más alto el cargo.","minnote":"Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEsto es una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula.","ahsnote":"AHS es el cargo por un paquete incómodo. Un centro de distribución funciona con bandas: el paquete se sube a la banda, se escanea y se clasifica, y nadie lo toca. Algunas cosas no pueden ir en la banda y hay que moverlas a mano, y este cargo paga eso.\nCada casilla de abajo es un umbral, y basta con que una sola se rebase. Todas son estrictamente mayor que: quedar justo en el número no lo activa.","lpsnote":"LPS es el nivel arriba de AHS, más o menos cinco veces el importe.\nDonde aplica LPS, no aplica AHS: no se cobran los dos. LPS ya es el grado severo y absorbe al leve.\nOtra vez, cada casilla es un umbral y con una basta.","rules":"Reglas del peso facturable","divisor":"Divisor volumétrico","dimcube":"El volumen debe pasar de","dimzone":"in³, Y la zona debe llegar a esto, antes de que cuente el volumétrico:","dimnote":"Estas dos casillas contestan una sola pregunta: ¿este paquete lleva peso volumétrico o no?\n    0 = sin condición, todos los paquetes lo llevan. Así son UPS y FedEx.\n    Un número = las dos condiciones deben cumplirse primero. Así es USPS (1728 y 5).\n\nUna sola caja lo deja claro: 20 × 15 × 10 in, 3,000 in³, peso real 10 lb:\n    UPS (0, 0)                   sin condición → aplica volumétrico → se cobran 22 lb\n    USPS a la zona 7             volumen y zona pasan → aplica volumétrico → se cobran 22 lb\n    USPS a la zona 3             zona menor a 5 → no aplica → se cobran 10 lb\n    USPS, caja chica (480 in³)   volumen bajo 1728 → no aplica → peso real\n\nLa diferencia es grande: la misma caja cobrada a 10 lb yendo cerca y a 22 lb yendo lejos.","usemin":"Aplicar el peso facturable mínimo","ahsmin":"Peso mínimo de AHS (lb)","lpsmin":"Peso mínimo de LPS (lb)","balloonlg":"Grande pero ligero: largo + contorno arriba de","balloonmin":"in, cobrar al menos (lb):","balloonnote":"Cuando un paquete es grande de dimensiones pero ligero de peso, USPS no lo cobra por peso real. Pasado el umbral aplica un peso piso. No tiene relación con los recargos y es una regla de peso.\nUSPS le llama balloon pricing, y así aparece en la factura y en los avisos postales.","ahs":"Reglas de manejo adicional (AHS)","autoahs":"Revisar AHS automáticamente","ahsw":"Peso mayor a (lb)","ahsl":"Lado más largo mayor a (in)","ahss":"Segundo lado mayor a (in)","ahsg":"Largo + contorno mayor a (in)","ahscu":"Volumen mayor a (in³)","lps":"Reglas de paquete grande (LPS)","autolps":"Revisar LPS automáticamente","lpsw":"Peso mayor a (lb)","lpsl":"Lado más largo mayor a (in)","lpsg":"Largo + contorno mayor a (in)","lpscu":"Volumen mayor a (in³)","omax":"Límites de tamaño y peso del paquete","maxw":"Peso máximo (lb)","maxl":"Lado más largo máximo (in)","maxlg":"Largo + contorno máximo (in)","omaxon":"Enviar fuera de límite y cobrar Over Maximum Limits","omaxfee":"Over Maximum Limits (por paquete)","pkomax":"Demand - Over Maximum Limits ($)","omaxnote":"Estos tres valores siguen al transportista y al servicio elegidos arriba, así que las cifras mostradas son los límites que aplican a la selección actual. Si se rebasa cualquiera de ellos, el artículo deja de ser paquete y tiene que moverse como carga. Si aun así se entrega, puede devolverse o cobrarse con una penalización fuerte.","base":"Flete base","baseintro":"Peso facturable + zona, se busca aquí. Un renglón por libra, hasta 150 lb.","zonefees":"Recargos que dependen de la zona","zonefeenote":"AHS y LPS cobran en cuatro bandas de zona. Edita cualquier celda y el cálculo usa la tuya. Son cifras de demostración: para trabajo real, revisa el contrato.","f_ahs_w":"AHS - Peso","f_ahs_s":"AHS - Tamaño","f_ahs_p":"AHS - Embalaje","f_lps_c":"LPS - Comercial","f_lps_r":"LPS - Residencial","fees":"Recargos de importe fijo","dascom":"DAS - comercial ($)","dasres":"DAS - residencial ($)","edascom":"Extended DAS - comercial ($)","edasres":"Extended DAS - residencial ($)","rascom":"RAS - comercial ($)","rasres":"RAS - residencial ($)","sigfee":"Cargo por firma ($)","ressur":"Recargo residencial ($)","fuel":"Combustible (%)","feenote":"Ajústalos a tu contrato. Las zonas remotas vienen en tres niveles: se cobra el de la lista donde caiga el código postal de destino, nunca más de uno por envío, y residencial siempre sale más caro que comercial. Ninguno de los tres tiene que ver con la zona.\nEl recargo residencial y el DAS residencial son dos cargos distintos con dos importes distintos: uno pregunta si es domicilio, el otro si el código postal está en la lista remota.","peak":"Precio de temporada alta (recargo por demanda)","peakhelp":"Al marcar esta casilla, la cotización suma el recargo por demanda. Solo existe en temporada alta, de octubre a enero aproximadamente; fuera de esa ventana no hay tal cargo. Los importes están en la pestaña de tarifas.","peakcard":"Importes del recargo por demanda","peaknote":"Demand solo aplica en temporada alta, aproximadamente de octubre a enero. Fuera de esa ventana no aparece.\nNunca es un renglón propio: va montado sobre un recargo existente y se factura como Demand - Residential Delivery Charge. Dos renglones residenciales en un mismo envío que solo se diferencian por la palabra Demand no son doble cobro.\nLos importes de abajo son de demostración. Los reales se publican cada año, se escalonan por volumen y entran en la base del combustible.","peakon":"Incluir Demand en esta cotización (desactivado por defecto)","pkres":"Demand - Residencial ($)","pkahs":"Demand - Manejo adicional ($)","pklps":"Demand - Paquete grande ($)","fuelcard":"Recargo por combustible","fuelnote":"El combustible cambia cada lunes, en tablas separadas para terrestre y aéreo. El botón abre la página de combustible del propio transportista, donde se publica el porcentaje de la semana; léelo y escríbelo arriba. La herramienta también intenta consultarlo en segundo plano y lista abajo lo que encuentre.","fuelfetch":"Abrir la página de combustible","fuellink":"La página de combustible, se actualiza cada lunes","fuelcol_date":"Vigencia","fuelcol_g":"Terrestre %","fuelcol_a":"Aéreo %","result":"Resultado del cálculo","calc":"Calcular","recalc":"Calcular de nuevo","lang":"Idioma","footer":"Internal Training Use Only  •  Developed by Sandy Liu","yes":"Sí","no":"No","none":"Ninguno","error":"Revisa los datos","unexpected":"Ocurrió un error"}},"DEFAULT":{"zone":"5","weight":"10","length":"20","width":"15","height":"10","divisor":"139","dimcube":"0","dimzone":"0","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","ahsmin":"40","lpsmin":"90","ahsw":"50","ahsl":"48","ahss":"30","ahsg":"105","lpsw":"110","lpsl":"96","lpsg":"130","lpscu":"17280","ahscu":"10368","maxw":"150","maxl":"108","maxlg":"165","ressur":"6.35","dascom":"4.20","dasres":"6.15","edascom":"7.20","edasres":"9.10","rascom":"14.60","rasres":"17.00","sigfee":"7.15","fuel":"18","pkres":"1.75","pkahs":"8.00","pklps":"65.00","pkomax":"510.00","omaxfee":"1875.00","from":"91789","to":""},"CARRIER_RULES":{"ups":{"divisor":"139","dimcube":"0","dimzone":"0","fuel":"18","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","maxw":"150","maxl":"108","maxlg":"165"},"fedex":{"divisor":"139","dimcube":"0","dimzone":"0","fuel":"18","nstdl1":"0","nstdl2":"0","nstdcu":"0","nstdf1":"4.00","nstdf2":"18.00","nstdfc":"30.00","balloonlg":"0","balloonmin":"0","maxw":"150","maxl":"108","maxlg":"165"},"usps":{"divisor":"139","dimcube":"1728","dimzone":"5","fuel":"8","maxw":"70","maxl":"108","maxlg":"130","nstdl1":"22","nstdl2":"30","nstdcu":"3456","balloonlg":"84","balloonmin":"20"}},"SERVICES":{"ups":[["Ground",{},true],["Ground Saver",{},false]],"fedex":[["Ground",{},false],["Home Delivery",{},false],["Ground Economy",{},false]],"usps":[["Ground Advantage",{"maxlg":"130"},false],["First-Class Package",{"maxlg":"130","maxw":"0.999"},false],["Priority Mail",{"maxlg":"108"},false],["Media Mail",{"maxlg":"108","dimcube":"-1"},false]]},"SERVICE_NOTES":{"usps|Ground Advantage":["電商小包的主力。長度加周長上限 130 in，是 USPS 裡最大的。","The workhorse for small e-commerce parcels, and at 130 in length plus girth the most generous size ceiling USPS offers.","El caballo de batalla del paquete pequeño de comercio electrónico, y con 130 in de largo más contorno, el tope de tamaño más generoso que ofrece USPS."],"usps|First-Class Package":["重量上限 15.999 oz（不到 1 磅），郵局櫃台的零售版更低，只到 13 oz。超過就不是這個價，自動變成 Ground Advantage 的磅計價。\n2023 年 7 月已經併進 Ground Advantage，不再是獨立產品，現在它其實是「1 磅以下的價格級距」——級距是 4 oz、8 oz、12 oz、15.999 oz，往上取。舊 SOP 和平台選單上還看得到這個名字，看到就當作 Ground Advantage 處理。\n不要跟 First-Class Mail 搞混：那是信件和扁平件，不是包裹。","The ceiling is 15.999 oz -- just under a pound -- and lower still at 13 oz over the retail counter. Above that it is no longer this price; it becomes Ground Advantage by the pound.\nIt was folded into Ground Advantage in July 2023 and is really a sub-pound price tier now, stepping at 4 oz, 8 oz, 12 oz and 15.999 oz, rounded up. The name survives in older SOPs and platform dropdowns; treat it as Ground Advantage when you see it.\nDo not confuse it with First-Class Mail, which is letters and flats rather than parcels.","El tope son 15.999 oz, poco menos de una libra, y baja a 13 oz en el mostrador de menudeo. Arriba de eso ya no es este precio: pasa a Ground Advantage cobrado por libra.\nEn julio de 2023 se integró a Ground Advantage, así que hoy en realidad es un escalón de precio por debajo de la libra, con cortes en 4 oz, 8 oz, 12 oz y 15.999 oz, redondeando hacia arriba. El nombre sobrevive en SOP viejos y en los menús de las plataformas; cuando lo veas, trátalo como Ground Advantage.\nNo lo confundas con First-Class Mail, que son cartas y piezas planas, no paquetes."],"usps|Priority Mail":["比較快，1-3 個工作天，但尺寸上限降到 108 in——同一個箱子 Ground Advantage 收得下，Priority 可能就不行。","Faster at 1-3 business days, but the ceiling drops to 108 in. The same box that Ground Advantage accepts may be too big for Priority.","Más rápido, de uno a tres días hábiles, pero el tope baja a 108 in. La misma caja que Ground Advantage acepta puede ser demasiado grande para Priority."],"usps|Priority Mail Express":["最快，也是 USPS 唯一有準點退費保證的服務。尺寸上限一樣 108 in。","The fastest, and the only USPS service with a money-back guarantee. Same 108 in ceiling.","El más rápido, y el único servicio de USPS con garantía de devolución. El mismo tope de 108 in."],"usps|Media Mail":["只能寄書籍、教材這類合格品項，寄別的東西被抓到要補郵資。它不分 Zone，只看重量，也不算材積重——所以上面的材積規則整組不適用。","Books and other qualifying media only; ship anything else and the shortfall gets collected. It is not zoned, prices on weight alone, and takes no dimensional weight -- so the DIM rules above do not apply at all.","Solo libros y otros materiales que califiquen; manda cualquier otra cosa y te cobran la diferencia. No va por zonas, cobra únicamente por peso y no toma peso volumétrico, así que las reglas de volumétrico de arriba no aplican en absoluto."],"ups|Ground":["陸運。1 到 5 個工作天，沒有時效保證，單價最低，美國電商包裹絕大多數走這一個。","Ground. One to five business days with no time guarantee, the cheapest per parcel, and what the great majority of US e-commerce moves on.","Terrestre. De uno a cinco días hábiles, sin garantía de tiempo, el más barato por paquete, y por donde se mueve la gran mayoría del comercio electrónico estadounidense."],"ups|Ground Saver":["最慢，末端常交郵局。走陸運燃油表。","The slowest; the final leg often goes via the post office. Ground fuel table.","El más lento; el último tramo muchas veces va por el correo. Tabla de combustible terrestre."],"ups|3 Day Select":["卡車送的，但燃油吃「空運」那張表——這是最常記錯的一條。","It moves by truck but takes the AIR fuel table -- the single most misremembered rule.","Va por camión pero toma la tabla de combustible AÉREA: la regla que más se recuerda al revés."],"fedex|Ground":["送企業地址。住宅要走 Home Delivery，是另一個服務名稱。","For business addresses. Homes go by Home Delivery, which is a separate service name.","Para direcciones comerciales. Los domicilios van por Home Delivery, que es un nombre de servicio aparte."],"fedex|Home Delivery":["送住家，跑同一個陸運網路，但在報表和帳單上是分開的一行。算量體時不能只抓 Ground。","For homes, on the same ground network, but a separate line on reports and invoices. Sizing volume from Ground alone understates it.","Para domicilios, sobre la misma red terrestre, pero es un renglón aparte en los reportes y en las facturas. Dimensionar el volumen solo con Ground lo subestima."],"fedex|Express Saver":["名字像陸運、要三天，但它是 Express，吃 Express 的費率表和燃油。","It sounds like ground and takes three days, but it is Express: Express rate table and Express fuel.","Suena a terrestre y tarda tres días, pero es Express: tabla de tarifas Express y combustible Express."]},"CARRIER_NOTES":{"dimnote":{"ups":["此二欄位用以判斷本件是否適用材積重。UPS 兩欄均為 0，即不設條件，所有包裹一律適用材積重。\n範例：20×15×10 吋、體積 3,000 in³、實重 10 磅 → 適用材積重 → 計費 22 磅。","These two boxes decide whether dimensional weight applies at all. Both are 0 for UPS, meaning no condition: every parcel gets it.\nExample: 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb -> DIM applies -> billed 22 lb.","Estas dos casillas deciden si el peso volumétrico aplica o no. En UPS las dos están en 0, o sea sin condición: todos los paquetes lo llevan.\nEjemplo: 20 x 15 x 10 in, 3,000 in3, peso real 10 lb -> aplica volumétrico -> se cobran 22 lb."],"fedex":["此二欄位用以判斷本件是否適用材積重。FedEx 兩欄均為 0，即不設條件，所有包裹一律適用材積重。\n範例：20×15×10 吋、體積 3,000 in³、實重 10 磅 → 適用材積重 → 計費 22 磅。","These two boxes decide whether dimensional weight applies at all. Both are 0 for FedEx, meaning no condition: every parcel gets it.\nExample: 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb -> DIM applies -> billed 22 lb.","Estas dos casillas deciden si el peso volumétrico aplica o no. En FedEx las dos están en 0, o sea sin condición: todos los paquetes lo llevan.\nEjemplo: 20 x 15 x 10 in, 3,000 in3, peso real 10 lb -> aplica volumétrico -> se cobran 22 lb."],"usps":["此二欄位用以判斷本件是否適用材積重。USPS 須兩項條件均成立方適用：體積逾 1,728 in³（1 立方英尺），且 Zone 達 5 以上。\n以 20×15×10 吋、體積 3,000 in³、實重 10 磅之包裹為例：\n　　寄至 Zone 7　　　體積與 Zone 均達標 → 適用材積重 → 計費 22 磅\n　　寄至 Zone 3　　　Zone 未達 5 → 不適用 → 計費 10 磅\n　　體積 480 in³　　 未逾 1,728 → 不適用 → 依實重計費\n同一包裹因寄送距離不同，分別以 10 磅與 22 磅計價，差異顯著。","These two boxes decide whether dimensional weight applies at all. USPS requires both conditions: over 1,728 in3 (one cubic foot) and zone 5 or beyond.\nTake a parcel of 20 x 15 x 10 in, 3,000 in3, actual weight 10 lb:\n    to zone 7      both conditions met -> DIM applies -> billed 22 lb\n    to zone 3      below zone 5 -> does not apply -> billed 10 lb\n    at 480 in3     under 1,728 -> does not apply -> billed on actual weight\nThe same parcel is rated at 10 lb or at 22 lb depending only on how far it travels.","Estas dos casillas deciden si el peso volumétrico aplica o no. USPS exige que se cumplan las dos condiciones: más de 1,728 in3 (un pie cúbico) y zona 5 o más lejos.\nToma un paquete de 20 x 15 x 10 in, 3,000 in3, peso real 10 lb:\n    a la zona 7     se cumplen las dos -> aplica volumétrico -> se cobran 22 lb\n    a la zona 3     por debajo de la zona 5 -> no aplica -> se cobran 10 lb\n    con 480 in3     por debajo de 1,728 -> no aplica -> se cobra el peso real\nEl mismo paquete se cobra a 10 lb o a 22 lb dependiendo solo de qué tan lejos va."]},"minnote":{"ups":["最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEs una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula."],"usps":["USPS 不設 AHS 或 LPS 的最低計費重量。其唯一的下限重量來自 balloon pricing：長度加周長逾 84 吋者，以 20 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列。","USPS has no AHS or LPS minimum. Its only floor weight comes from balloon pricing: past 84 in of length plus girth a parcel is rated at 20 lb.\nThis is a weight rule rather than a charge and carries no line of its own on the invoice.","USPS no tiene mínimo de AHS ni de LPS. Su único peso piso viene del balloon pricing: pasadas las 84 in de largo más contorno, el paquete se cobra a 20 lb.\nEs una regla de peso, no un cargo, y no lleva renglón propio en la factura."],"fedex":["最低計費重量係指：包裹觸發特定附加費後，無論實際重量多輕，一律以規定的下限重量計價。\n例如 12 磅之大型空箱觸發 AHS－尺寸者，以 40 磅計價；觸發 LPS 者，以 90 磅計價。\n此為重量規則而非費用項目，帳單上不會另立一列，僅能由計費重量的異常察覺。","A minimum billable weight means that once a parcel triggers certain surcharges it is rated at a floor weight, however light it actually is.\nA 12 lb box that triggers AHS by size is rated at 40 lb; one that triggers LPS is rated at 90 lb.\nThis is a weight rule rather than a charge. It carries no line of its own on the invoice and is visible only as a billable weight that does not match the scale.","Un peso facturable mínimo significa que, en cuanto un paquete activa ciertos recargos, se cobra a un peso piso por muy ligero que sea en realidad.\nUna caja de 12 lb que activa AHS por tamaño se cobra a 40 lb; una que activa LPS se cobra a 90 lb.\nEs una regla de peso, no un cargo. No lleva renglón propio en la factura y solo se nota como un peso facturable que no cuadra con la báscula."]}},"CARRIER_ZONES":{"ups":{"lo":1,"hi":8,"offshore":[44,45,46]},"fedex":{"lo":2,"hi":8,"offshore":[9,10,11,12,17]},"usps":{"lo":1,"hi":9,"offshore":[]}},"OFFSHORE_ZONES":[9,10,11,12,17,44,45,46],"ZONE_FEE_DEFAULTS":{"f_ahs_w":{"2":46.5,"3-4":50.75,"5-6":56.25,"7+":58.75},"f_ahs_s":{"2":30.0,"3-4":33.25,"5-6":38.5,"7+":40.5},"f_ahs_p":{"2":30.0,"3-4":33.25,"5-6":38.5,"7+":40.5},"f_lps_c":{"2":219.5,"3-4":239.5,"5-6":273.0,"7+":286.0},"f_lps_r":{"2":254.5,"3-4":274.5,"5-6":320.5,"7+":331.0}},"ZONE_FEE_ROWS":[["f_ahs_w","AHS - Weight"],["f_ahs_s","AHS - Size"],["f_ahs_p","AHS - Packaging"],["f_lps_c","LPS - Commercial"],["f_lps_r","LPS - Residential"]],"DEMO_ZONE_MULTIPLIER":{"1":0.94,"2":1.0,"3":1.1,"4":1.22,"5":1.36,"6":1.52,"7":1.72,"8":1.94,"9":2.18,"10":2.34,"11":2.5,"12":2.66,"17":3.02,"44":2.64,"45":2.86,"46":3.08},"THEMES":{"ups":{"bg":"#EFE3CB","panel":"#FBF4E5","field":"#FFFCF4","text":"#2C1A0E","muted":"#7A6753","accent":"#351C15","hover":"#1E0F0A","soft":"#FFB500","onsoft":"#2C1A0E"},"fedex":{"bg":"#E7DFF2","panel":"#F6F1FB","field":"#FDFBFF","text":"#241042","muted":"#6B5E80","accent":"#4D148C","hover":"#330A63","soft":"#FF6600","onsoft":"#241042"},"usps":{"bg":"#DDE8F1","panel":"#F0F6FB","field":"#FAFDFF","text":"#16283A","muted":"#5C7185","accent":"#004B87","hover":"#00335C","soft":"#DA291C","onsoft":"#FFFFFF"}},"THEME_NAMES":{"zh":{"ups":"UPS 棕金","fedex":"FedEx 紫橘","usps":"USPS 藍紅"},"en":{"ups":"UPS Brown","fedex":"FedEx Purple","usps":"USPS Blue"},"es":{"ups":"UPS café y oro","fedex":"FedEx morado y naranja","usps":"USPS azul y rojo"}},"ES_RESULT":{"billing":"facturación","Zone":"Zona","Delivery Area Surcharge (DAS)":"Recargo por zona de entrega (DAS)","Extended Delivery Area Surcharge":"Recargo por zona de entrega extendida","Remote Area Surcharge (RAS)":"Recargo por zona remota (RAS)","Signature Fee":"Cargo por firma","Large Package Surcharge (LPS)":"Recargo por paquete grande (LPS)","Additional Handling - Weight":"Manejo adicional - Peso","Additional Handling - Size":"Manejo adicional - Tamaño","Additional Handling - Packaging":"Manejo adicional - Embalaje","Residential Surcharge":"Recargo residencial","Demand - Residential Delivery":"Demand - Entrega residencial","Demand - Additional Handling":"Demand - Manejo adicional","Demand - Large Package":"Demand - Paquete grande","Nonstandard Fee - Length tier 1":"Tamaño no estándar - Largo, tramo 1","Nonstandard Fee - Length tier 2":"Tamaño no estándar - Largo, tramo 2","Nonstandard Fee - Cube":"Tamaño no estándar - Volumen","longest side":"lado más largo","second side":"segundo lado","length + girth":"largo + contorno","actual weight":"peso real","cubic volume":"volumen","Calculation Result":"Resultado del cálculo","Large Package Surcharge applies":"Aplica el recargo por paquete grande","AHS - Weight applies":"Aplica AHS - Peso","AHS - Size / Packaging applies":"Aplica AHS - Tamaño / Embalaje","Nonstandard fee applies":"Aplica el cargo por tamaño no estándar","Standard parcel: no AHS or LPS":"Paquete normal: sin AHS ni LPS","Final billable weight":"Peso facturable final","Estimated total":"Total estimado","Billing tip: When LPS applies, AHS does not stack.":"Nota de facturación: cuando aplica LPS, el AHS no se suma encima.","Billing tip: Low actual weight does not guarantee a low charge; DIM weight may win.":"Nota de facturación: un peso real bajo no garantiza un cargo bajo; el peso volumétrico puede ganar.","Billing tip: The Length field is not always the longest side; sort all three dimensions first.":"Nota de facturación: el campo Largo no siempre es el lado más largo; ordena primero las tres dimensiones.","Full calculation":"Cálculo completo","STEP 0: Convert the units":"PASO 0: Convertir las unidades","Entered":"Capturado","Converted":"Convertido","The carrier's divisor is imperial, so the parcel is converted to in/lb first rather than the divisor being swapped.":"El divisor del transportista es imperial, así que primero se convierte el paquete a in/lb en lugar de cambiar el divisor.","STEP 1: Identify the lane":"PASO 1: Identificar la ruta","From ZIP Code":"Código postal de origen","To ZIP Code":"Código postal de destino","blank":"sin llenar","Address type":"Tipo de dirección","Residential":"Residencial","Commercial":"Comercial","Zone comes from origin AND destination. Change the origin and it changes.":"La zona sale del origen Y del destino. Si cambias el origen, cambia.","STEP 2: Sort the three sides":"PASO 2: Ordenar los tres lados","Sorted":"Ordenado","Column names lie -- the Length field is not always the longest side.":"Los nombres de los campos engañan: el campo Largo no siempre es el lado más largo.","STEP 3: Length + Girth":"PASO 3: Largo + contorno","STEP 4: DIM weight":"PASO 4: Peso volumétrico","Cube":"Volumen","This service takes no dimensional weight; the actual weight is used.":"Este servicio no toma peso volumétrico; se usa el peso real.","STEP 5: Actual vs DIM, take the larger":"PASO 5: Real contra volumétrico, gana el mayor","Actual":"Real","DIM":"Volumétrico","does not apply (see step 4)":"no aplica (ver paso 4)","Rounded up":"Redondeado hacia arriba","Larger, rounded up":"El mayor, redondeado hacia arriba","STEP 6: Surcharge triggers":"PASO 6: Disparadores de recargo","The nonstandard fee looks only at length and cube. Weight never enters into it, so a long light parcel is caught all the same.":"El cargo por tamaño no estándar solo mira el largo y el volumen. El peso nunca entra, así que un paquete largo y ligero cae igual.","  Automatic checking is switched off.":"  La revisión automática está desactivada.","  LPS applies because:":"  Aplica LPS porque:","When LPS applies, AHS is not charged as well. They never stack.":"Cuando aplica LPS, el AHS no se cobra además. Nunca se suman.","  LPS does not apply.":"  No aplica LPS.","  AHS Weight applies because:":"  Aplica AHS Peso porque:","  AHS Size applies because:":"  Aplica AHS Tamaño porque:","  AHS Packaging applies:":"  Aplica AHS Embalaje:","    not fully encased in corrugated cardboard (ticked by hand; cannot be derived from dimensions)":"    no va totalmente cubierto de cartón corrugado (se marca a mano; no se deduce de las medidas)","Several AHS conditions met -- charged once, at the higher amount.":"Se cumplieron varias condiciones de AHS: se cobra una sola vez, al importe mayor.","  AHS does not apply.":"  No aplica AHS.","STEP 7: Final billable weight":"PASO 7: Peso facturable final","  Minimum billable weight is switched off.":"  El peso facturable mínimo está desactivado.","  No minimum billable weight applies.":"  No aplica ningún peso facturable mínimo.","LPS":"LPS","AHS Size":"AHS Tamaño","Minimum applied":"Mínimo aplicado","A long light parcel is billed at a floor weight although nothing about it is heavy. This rule reads length plus girth and is not a surcharge.":"Un paquete largo y ligero se cobra a un peso piso aunque nada en él sea pesado. Esta regla lee largo más contorno y no es un recargo.","The minimum raised the billable weight. It is a weight rule, not a fee.":"El mínimo subió el peso facturable. Es una regla de peso, no un cargo.","STEP 8: Base transportation":"PASO 8: Flete base","Lookup":"Búsqueda","Weight break used":"Escalón de peso usado","Base rate":"Tarifa base","Built-in demonstration rates, not UPS published rates. Reconcile against your own table.":"Tarifas de demostración incluidas, no las tarifas publicadas de UPS. Concílialas contra tu propia tabla.","Rate tables are stepped; a weight lands on the next break at or above it.":"Las tablas de tarifas van por escalones; un peso cae en el siguiente escalón igual o superior.","Usually the weight is past the end of the table, or that zone has no rates.":"Normalmente el peso pasa del final de la tabla, o esa zona no tiene tarifas.","STEP 9: Surcharge amounts":"PASO 9: Importes de los recargos","All three remote tiers follow which ZIP list the destination sits on, not the zone, and a shipment only ever takes one of them.":"Los tres niveles remotos dependen de en qué lista de códigos postales cae el destino, no de la zona, y un envío nunca toma más de uno.","  No surcharges.":"  Sin recargos.","Subtotal":"Subtotal","STEP 10: Fuel":"PASO 10: Combustible","Fuel basis":"Base del combustible","air":"aéreo","ground":"terrestre","Rate source":"Origen de la tarifa","Air fuel with a Ground base rate -- treat this total as practice, not a reconciliation.":"Combustible aéreo sobre una tarifa base terrestre: toma este total como práctica, no como conciliación.","typed in":"capturado a mano","Total  =  (base + surcharges) x (1 + fuel%)":"Total  =  (base + recargos) × (1 + combustible%)","Base":"Base","Surcharges":"Recargos","Fuel":"Combustible","TOTAL":"TOTAL","This is not a full quote: no base freight was found, so the figure above is surcharges and fuel only.":"Esto no es una cotización completa: no se encontró flete base, así que la cifra de arriba es solo recargos y combustible.","For production work, verify against the carrier's current rates and your customer contract.":"Para trabajo real, verifica contra las tarifas vigentes del transportista y el contrato de tu cliente."},"ES_FEES":{"Receiving / Devanning":["Recibo / Desconsolidado","El cargo por descargar la carga que llega, contarla y confirmar qué y cuánto entró."],"Putaway":["Acomodo","El cargo por llevar la mercancía ya contada a su ubicación de almacenamiento y registrar dónde quedó."],"Storage":["Almacenaje","La renta del espacio que ocupa la mercancía mientras está en el almacén, cobrada por tiempo."],"Pick fee":["Surtido","El cargo por bajar un artículo del anaquel cuando entra un pedido."],"Pack fee / Materials":["Empaque / Materiales","El cargo por encajonar, rellenar y sellar un pedido, más la caja y la cinta que se usaron."],"Labelling":["Etiquetado","El cargo por poner una etiqueta obligatoria en un artículo o una caja, por ejemplo un FNSKU de Amazon."],"Palletizing":["Paletizado","El cargo por acomodar cajas sueltas en una tarima, emplayarla y etiquetarla."],"Rework / Repack":["Reproceso / Reempaque","El cargo por rehacer mercancía que ya está en inventario: cambiar de caja, cambiar etiqueta, separar o juntar."],"Kitting":["Armado de kits","El cargo por combinar varios artículos en una nueva unidad vendible."],"Returns processing":["Proceso de devoluciones","El cargo por recibir una devolución, revisarla y decidir si regresa al anaquel."],"Order fee":["Cargo por pedido","Un cargo administrativo que se cobra una vez por pedido, sin importar qué lleve dentro."],"Inspection / photos":["Inspección / fotos","El cargo por una revisión extra de la mercancía al llegar, o por fotografiarla como constancia."],"Disposal":["Destrucción","El cargo por deshacerse de mercancía que ya no se va a vender."],"Drayage":["Acarreo","El cargo terrestre por trasladar la mercancía del puerto o del aeropuerto al almacén."],"Project labour":["Mano de obra por proyecto","El cargo por trabajos sueltos sin tarifa fija, contados por persona y por hora."]},"SELF_TESTS":[["AHS-Weight, DIM wins","ups","Ground",{"zone":"5","weight":"52","length":"30","width":"24","height":"18","address":"commercial"},94,161.62],["LPS, 90 lb floor","ups","Ground",{"zone":"5","weight":"35","length":"96","width":"10","height":"10","address":"residential"},90,477.95],["Plain parcel, no trigger","ups","Ground",{"zone":"5","weight":"10","length":"20","width":"15","height":"10","address":"commercial"},22,37.16],["Actual beats DIM","ups","Ground",{"zone":"4","weight":"40","length":"12","width":"12","height":"12","address":"commercial"},40,47.42],["AHS-Size on girth","ups","Ground",{"zone":"6","weight":"18","length":"40","width":"20","height":"14","address":"residential"},81,148.44],["Demand on residential + AHS","ups","Ground",{"zone":"5","weight":"52","length":"30","width":"24","height":"18","address":"residential","peak":true},94,180.62],["Demand once on multi-trigger AHS","ups","Ground",{"zone":"4","weight":"55","length":"50","width":"22","height":"14","address":"commercial","peak":true},111,166.0]],"WAREHOUSE_FEES":[["收貨費 / 卸櫃費","Receiving / Devanning","貨運到倉庫時，卸下來、清點、確認品項和數量的費用。","The charge for unloading arriving freight, counting it and confirming what and how much came in."],["上架費","Putaway","把清點好的貨搬到儲位放好、並登記位置的費用。","The charge for moving counted goods to a storage location and recording where they went."],["倉儲費","Storage","貨放在倉庫裡佔用空間的租金，按時間計算。","Rent for the space the goods occupy while they sit in the warehouse, charged by time."],["揀貨費","Pick fee","有訂單時，把商品從儲位拿出來的費用。","The charge for taking an item off the shelf when an order comes in."],["包裝費 / 耗材費","Pack fee / Materials","把商品裝箱、填充、封箱的費用，以及用掉的紙箱膠帶。","The charge for boxing, padding and sealing an order, plus the carton and tape it used."],["貼標費","Labelling","在商品或外箱貼上平台要求的標籤的費用，例如 Amazon 的 FNSKU。","The charge for putting a required label on an item or carton, such as an Amazon FNSKU."],["打板費","Palletizing","把一箱一箱的貨堆成棧板、纏膜、貼板標的費用。","The charge for stacking loose cartons into a pallet, wrapping it and labeling it."],["加工費 / 重新包裝","Rework / Repack","把貨拆開重做的費用：換箱、換標、拆箱或合併。","The charge for redoing goods already in stock: re-boxing, re-labeling, splitting or combining."],["組裝費","Kitting","把好幾個商品組成一個新的販售組合的費用。","The charge for combining several items into one new sellable unit."],["退貨處理費","Returns processing","收到退貨後，檢查它、決定重新上架還是報廢的費用。","The charge for receiving a return, inspecting it, and deciding whether it goes back on the shelf."],["訂單處理費","Order fee","每接一張訂單就收一次的行政費用，跟裡面有幾件無關。","An administrative charge taken once per order, whatever is inside it."],["驗貨拍照費","Inspection / photos","進倉時額外檢查商品狀況或拍照留存的費用。","The charge for an extra check of the goods on arrival, or for photographing them as a record."],["銷毀費","Disposal","把不要的貨處理掉的費用。","The charge for getting rid of goods that are not going to be sold."],["拖車費","Drayage","把貨從港口或機場載到倉庫的陸運費用。","The road charge for hauling goods from the port or airport to the warehouse."],["人工工時費","Project labour","沒有固定費率的雜項工作，按人按小時計算的費用。","The charge for odd jobs with no set rate, counted per person per hour."]],"JOBS":{"zh":[["收貨 / 上架","核對到貨的 SKU、數量、外箱狀況，然後把商品放到正確的庫位。這一步做錯，後面全部會錯。"],["庫存管理","記錄庫存數量、放在哪一格、可不可以賣。盤點和異常也在這裡處理。"],["訂單履約","接到訂單後揀貨、包裝、貼標、出貨，再將 Tracking 回傳給賣家系統。"],["退貨處理","確認退回來的東西狀況，決定重新上架、隔離、報廢還是退回客戶。"],["加工作業","換標、組裝、重新包裝這類客製需求，每個客戶要求都不一樣。"],["客服 / 系統","查訂單、庫存、配送狀態，處理 WMS、平台和物流商之間的資料。"],["中轉 / 備貨","把賣家的整批貨驗收、貼標、重新裝箱、打板，再送進 Amazon FBA 或 Walmart 的倉庫。"]],"en":[["Receiving","Check the arriving SKU, quantity and carton condition, then put the goods in the right location. Get this wrong and everything downstream is wrong."],["Inventory","Record how much is on hand, where it sits, and whether it is sellable. Cycle counts and discrepancies live here too."],["Fulfillment","Pick, pack, label and ship the order, then write the tracking number back."],["Returns","Inspect what came back and decide: restock, quarantine, scrap, or send it to the client."],["Value-added","Relabeling, kitting, repacking -- client-specific work, different for every account."],["Support","Check orders, stock and delivery status; move data between the WMS, the platforms and the carriers."],["Prep & forward","Receive a seller's bulk shipment, inspect it, relabel, repack, palletize, and send it on into an Amazon FBA or Walmart fulfillment center."]],"es":[["Recibo","Revisa el SKU, la cantidad y el estado de las cajas que llegan, y acomoda la mercancía en la ubicación correcta. Si esto sale mal, todo lo que viene después sale mal."],["Inventario","Registra cuánto hay, dónde está y si se puede vender. Los conteos cíclicos y las diferencias también viven aquí."],["Surtido y envío","Surte, empaca, etiqueta y envía el pedido, y después regresa el número de rastreo al sistema."],["Devoluciones","Revisa lo que regresó y decide: se resurte, se aparta, se destruye o se manda al cliente."],["Valor agregado","Reetiquetado, armado de kits, reempaque: trabajo específico de cada cliente, distinto en cada cuenta."],["Soporte y sistemas","Consulta pedidos, existencias y estado de entrega; mueve datos entre el WMS, las plataformas y los transportistas."],["Preparación y reenvío","Recibe el embarque completo de un vendedor, lo revisa, lo reetiqueta, lo reempaca, lo paletiza y lo manda a un centro de Amazon FBA o de Walmart."]]},"TRUCKLOAD":{"zh":[["疊箱","重箱置下、輕箱置上，箱角與棧板邊緣切齊。交錯疊（逐層轉向）之穩定性較佳；直疊之抗壓強度較高，外箱標示 ISTA 抗壓值者以直疊為原則。"],["外突","箱體不得超出棧板邊緣，並無 2 in 之容許緩衝：FBA 為零容許，LTL 承運人條款亦要求切齊，實務建議內縮約 1 in。突出之箱角為最先受撞處；承運人以最外緣丈量，外突即等同全板尺寸放大，計價隨之調整。無法排入 48 x 40 in 範圍者，應改變排列方式或改用適配尺寸之棧板。（另有兩處常見之 2 in 規格：邊角護角厚度至少 2 in、封箱膠帶寬度至少 2 in，與外突容許無關。）"],["纏膜","自下而上纏繞並下收至棧板底座，使貨與板結合為一件。底座至少繞三圈，頂層須壓覆。膜未下至底座者，車輛行進中整疊易生位移。"],["標籤","每板須具備 BOL 之板號、收貨方與件數；進 FBA 另須板標，四面皆貼。板標錯貼或缺面，收貨端得予拒收。"],["打完先量","板高、板重與最外緣尺寸應於移入待運區前完成丈量。至月台始發現超高者，須拆板重打。"]],"en":[["Stacking","Heavy at the bottom, light on top, carton corners flush with the pallet edge and nothing overhanging. Interlocked courses ride better; column stacking is stronger in compression, so where the carton carries an ISTA rating, stack in columns."],["Overhang","There is no two-inch allowance: FBA permits none at all, carrier tariffs ask for flush, and the practical target is an inch of underhang. A carton over the deck edge is the first corner anything hits, and the carrier measures to the outermost point, so the overhang enlarges the whole pallet and the rate with it. Change the pattern, or use a pallet sized for the goods."],["Wrapping","Wrap from the bottom up and take the film down onto the deck, so the load and the pallet become one object. Three turns round the base at least, and a turn over the top course. Film that never reached the deck lets the whole stack walk."],["Labels","Every pallet carries its number from the BOL, the consignee and the piece count. Into FBA it also carries pallet labels on all four sides. A wrong or missing label is grounds for the receiving dock to refuse it."],["Measure it here","Height, weight and the widest point, measured while the pallet is still on the build spot. Finding out at the dock that it is over height means stripping it and building it again."]]},"TRUCKLOAD_SHIP":{"zh":[["三種走法","SPD 逐箱交付 UPS／FedEx，按件計價。LTL 打成棧板與他人貨物共用車廂，按板數與貨物等級計價。FTL 承包整車，按趟計價。量體已達門檻而未調整走法者，運費差距可達數倍。"],["何時應打板","現場之概略分界為：六板以內採 LTL，超過則評估 FTL；六箱以內且單箱不重者，多數情況仍以 SPD 為佳。實際判斷應取三方報價比較，此數字僅供初判。"],["裝車順序","先裝者置於車廂最內側，重板靠近車頭。板與板之間不留空隙；無法避免時應以氣囊或木撐固定。未固定之貨物於行進中位移，位移即產生碰撞。"],["地面指揮","堆高機進入車廂時，駕駛之後方視線受阻，門口須配置指揮人員，並確認拖車已上輪擋、月台鎖已扣合。裝載中拖車滑移屬重大人員傷亡風險。"],["預約進倉","LTL／FTL 進入 FBA、Walmart 等大型收貨點，須事先取得預約時段（ISA／carrier appointment）。未預約或逾時到場者整車退回，重新排程通常需數日。"],["BOL 與存證","提單所載板數、件數與重量須與實際一致，司機簽收前應逐項核對。關門前拍攝全車照片；貨損爭議中，該照片為貨物完好裝車之主要證據。"]],"en":[["Three ways to ship","SPD hands cartons to UPS or FedEx one at a time and is priced per piece. LTL puts them on pallets sharing a trailer with other freight, priced by pallet count and freight class. FTL takes the whole trailer, priced by the run. Staying on the wrong one as volume grows costs multiples, not percentages."],["When to palletize","The rough line on the floor is LTL up to about six pallets and FTL beyond it, while six cartons or fewer of no great weight usually still go SPD. The real answer is three live quotes side by side, not this rule of thumb."],["Loading order","First in goes furthest forward, heavy toward the nose, and no gaps between pallets -- or fill them with airbags or bracing. Freight that can move will move, and moving freight hits something."],["Somebody on the ground","The driver cannot see behind the truck going into a tra
